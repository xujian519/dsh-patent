  - path: 第二部分第四章5.4
    topics: [创造性, 商业成功]
    text: |-
      当发明的产品在商业上获得成功时，如果这种成功是由于发明的技术特征直接导致的，则一方面反映了发明具有有益效果，同时也说明了发明是非显而易见的，因而这类发明具有突出的实质性特点和显著的进步，具备创造性。但是，如果商业上的成功是由于其他原因所致，例如由于销售技术的改进或者广告宣传造成的，则不能作为判断创造性的依据。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第四章6.2
    topics: [创造性, 事后诸葛亮]
    text: |-
      审查发明的创造性时，由于审查员是在了解了发明内容之后才作出判断，因而容易对发明的创造性估计偏低，从而犯“事后诸葛亮”的错误。审查员应当牢牢记住，对发明的创造性评价是由发明所属技术领域的技术人员依据申请日以前的现有技术与发明进行比较而作出的，以减少和避免主观因素的影响。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第四章6.3
    topics: [创造性, 预料不到的技术效果]
    text: |-
      在创造性的判断过程中，考虑发明的技术效果有利于正确评价发明的创造性。按照本章第5.3 节中所述，如果发明与现有技术相比具有预料不到的技术效果，则不必再怀疑其技术方案是否具有突出的实质性特点，可以确定发明具备创造性。但是，应当注意的是，如果通过本章第3.2 节中所述的方法，可以判断出发明的技术方案对本领域的技术人员来说是非显而易见的，且能够产生有益的技术效果，则发明具有突出的实质性特点和显著的进步，具备创造性，此种情况不应强调发明是否具有预料不到的技术效果。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
