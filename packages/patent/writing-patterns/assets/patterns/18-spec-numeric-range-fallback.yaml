id: "wp-spec-numeric-range-fallback"
name: "数值范围退路——端点与中值都写进实施例"
category: "spec_drafting"
sub_category: "embodiment"
summary: "数值范围是答复与无效阶段最常用的退守位置；说明书要写出范围两端点、至少一个中值与范围外对比例，使每次限缩都有原始依据。"
context: "适用于权要含温度、压力、配比、尺寸等数值范围的说明书撰写。"
keywords: ["数值范围", "端点", "中值", "对比例", "退路"]
source_ref: "专利法第26条第3款；审查指南第二部分第二章2.1.3"
quality: 0.87
version: 1
steps:
  - order: 1
    name: "列出权要中的数值范围"
    instruction: "逐项记录每个数值范围及其单位、测量条件，避免同一参数在不同段落使用不同单位或基准。"
  - order: 2
    name: "写端点与中值"
    instruction: "范围两端点各给一个实施例，并在范围内取至少一个中值或优选值；端点应可实施，不能只写边界数值而无工艺条件。"
  - order: 3
    name: "写范围外对比例"
    instruction: "在范围外紧邻端点的位置给一个对比例，说明超出后效果如何下降或无法实施，支撑范围的临界性。"
  - order: 4
    name: "标注退守顺序"
    instruction: "把中值、端点和优选子范围按可接受顺序排列，答复时按从宽到窄依次限缩，避免一次退到最窄。"
examples:
  - context: "温度范围"
    text: "权要 80-95℃；实施例分别写 80℃、88℃、95℃，对比例写 75℃ 时反应不完全，转化率下降 20%。"
dos:
  - rule: "每个数值范围都有端点、中值与至少一个对比例"
  - rule: "测量条件与单位在全文保持一致"
donts:
  - rule: "不要只在权要写范围，说明书只给一个中点实施例"
  - rule: "不要用范围外效果更差但没有数据的断言支撑临界性"
