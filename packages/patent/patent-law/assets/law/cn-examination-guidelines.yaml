  - path: 第二部分第二章2.2.7
    topics: [说明书, 撰写要求]
    text: |-
      说明书应当用词规范，语句清楚。即说明书的内容应当明确，无含糊不清或者前后矛盾之处，使所属技术领域的技术人员容易理解。
      说明书应当使用发明或者实用新型所属技术领域的技术术语。对于自然科学名词，国家有规定的，应当采用统一的术语，国家没有规定的，可以采用所属技术领域约定俗成的术语，也可以采用鲜为人知或者最新出现的科技术语，或者直接使用外来语（中文音译或意译词），但是其含义对所属技术领域的技术人员来说必须是清楚的，不会造成理解错误；必要时可以采用自定义词，在这种情况下，应当给出明确的定义或者说明。一般来说，不应当使用在所属技术领域中具有基本含义的词汇来表示其本意之外的其他含义，以免造成误解和语义混乱。说明书中使用的技术术语与符号应当前后一致。
      说明书应当使用中文，但是在不产生歧义的前提下，个别词语可以使用中文以外的其他文字。在说明书中第一次使用非中文技术名词时，应当用中文译文加以注释或者使用中文给予说明。
      例如，在下述情况下可以使用非中文表述形式：
      （1）本领域技术人员熟知的技术名词可以使用非中文形式表述，例如用“EPROM”表示可擦除可编程只读存储器，用“CPU”表示中央处理器；但在同一语句中连续使用非中文技术名词可能造成该语句难以理解的，则不允许。
      （2）计量单位、数学符号、数学公式、各种编程语言、计算机程序、特定意义的表示符号（例如中国国家标准缩写GB）等可以使用非中文形式。
      此外，所引用的外国专利文献、专利申请、非专利文献的出处和名称应当使用原文，必要时给出中文译文，并将译文放置在括号内。
      说明书中的计量单位应当使用国家法定计量单位，包括国际单位制计量单位和国家选定的其他计量单位。必要时可以在括号内同时标注本领域公知的其他计量单位。
      说明书中无法避免使用商品名称时，其后应当注明其型号、规格、性能及制造单位。
      说明书中应当避免使用注册商标来确定物质或者产品。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第二章2.3
    topics: [附图, 附图标记]
    text: |-
      附图是说明书的一个组成部分。
      附图的作用在于用图形补充说明书文字部分的描述，使人能够直观地、形象化地理解发明或者实用新型的每个技术特征和整体技术方案。对于机械和电学技术领域中的专利申请，说明书附图的作用尤其明显。因此，说明书附图应该清楚地反映发明或者实用新型的内容。
      对发明专利申请，用文字足以清楚、完整地描述其技术方案的，可以没有附图。
      实用新型专利申请的说明书必须有附图。
      一件专利申请有多幅附图时，在用于表示同一实施方式的各幅图中，表示同一组成部分（同一技术特征或者同一对象）的附图标记应当一致。说明书中与附图中使用的相同的附图标记应当表示同一组成部分。说明书文字部分中未提及的附图标记不得在附图中出现，附图中未出现的附图标记也不得在说明书文字部分中提及。
      附图中除了必需的词语外，不应当含有其他的注释；但对于流程图、框图一类的附图，应当在其框内给出必要的文字或符号。
      关于附图的绘制要求适用本指南第一部分第一章第4.3 节的规定。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第二章2.4
    topics: [摘要]
    text: |-
      摘要是说明书记载内容的概述，它仅是一种技术信息，不具有法律效力。
      摘要的内容不属于发明或者实用新型原始记载的内容，不能作为以后修改说明书或者权利要求书的根据，也不能用来解释专利权的保护范围。
      摘要应当满足以下要求：
      （1）摘要应当写明发明或者实用新型的名称和所属技术领域，并清楚地反映所要解决的技术问题、解决该问题的技术方案的要点以及主要用途，其中以技术方案为主；摘要可以包含最能说明发明的化学式；
      （2）有附图的专利申请，应当指定或者由审查员指定一幅最能反映该发明或者实用新型技术方案的主要技术特征的说明书附图作为摘要附图；
      （3）摘要附图的大小及清晰度应当保证在该图缩小到4 厘米×6 厘米时，仍能清楚地分辨出图中的各个细节；
      （4）摘要文字部分（包括标点符号）不得超过300 个字，并且不得使用商业性宣传用语。
      此外，摘要文字部分出现的附图标记应当加括号。
      本章以上各节对说明书的实质性内容和撰写方式的要求作了详细的规定。应当注意，在实质审查中，当说明书因公开不充分而不符合专利法第二十六条第三款的规定时，属于专利法实施细则第五十九条规定的应当予以驳回的情形；若仅仅存在不满足专利法实施细则第二十条要求的缺陷，则不属于可以根据专利法实施细则第五十九条规定予以驳回的情形。如果说明书中存在的用词不规范、语句不清楚缺陷并不导致发明不可实现，那么该情形属于专利法实施细则第二十条所述的缺陷，审查员不应当据此驳回该申请。此外，专利法实施细则第五十九条规定的应当予以驳回的情形中不包括说明书摘要不满足要求的情形。
