  - path: 第二部分第四章6.4
    title: 对要求保护的发明进行审查
    kind: amended
    oldColumnText: |-
      发明是否具备创造性是针对要求保护的发明而言的，
      因此，对发明创造性的评价应当针对权利要求限定的技术
      方案进行。发明对现有技术作出贡献的技术特征，例如，
      使发明产生预料不到的技术效果的技术特征，或者体现发
      明克服技术偏见的技术特征，应当写入权利要求中；否则，
      即使说明书中有记载，评价发明的创造性时也不予考虑。
      此外，创造性的判断，应当针对权利要求限定的技术方案
      整体进行评价，即评价技术方案是否具备创造性，而不是
      评价某一技术特征是否具备创造性。
    newColumnText: |-
      发明是否具备创造性是针对要求保护的发明而言的，
      因此，对发明创造性的评价应当针对权利要求限定的技术
      方案进行。在判断创造性时，应当针对权利要求限定的技
      术方案整体进行评价，即评价技术方案是否具备创造性，
      而不是评价某一技术特征是否具备创造性。
      发明对现有技术作出贡献的技术特征，例如，使发明
      产生预料不到的技术效果的技术特征，或者体现发明克服
      技术偏见的技术特征，应当写入权利要求中；否则，即使
      说明书中有记载，评价发明的创造性时也不予考虑。
      对技术问题的解决没有作出贡献的
      特征，即使写入权利要求中，通常也不会对技术方案的创造
      性产生影响。
      【例如】
      一项涉及照相机的发明，发明所要解决的技术问题是如
      何实现更灵活的控制快门，该技术问题是通过改进相机内部
      的相关机械和电路结构实现的。在审查员指出权利要求不具
      备创造性后，申请人在权利要求中增加了包括照相机外壳的
      形状、显示屏大小、电池仓的位置等特征。说明书中并未说
      明权利要求新增特征与所述技术问题的解决存在任何关联，
      这些新增特征或者是权利要求主题本身所隐含的常规组成部
      分，或者是本领域的技术人员基于其普通技术知识和常规实
      验手段所能得到的，申请人也未提供证据证明或者充分理由
      说明这些技术特征能够给要求保护的技术方案带来任何进一
      步的技术效果，因此，上述技术特征没有对所述技术问题的
      解决作出贡献，并不会给要求保护的技术方案带来创造性。

