# 不写作「2.0」。第二次核对（2026-10-17）按同一版本全文逐条核对随包资产与源码里的全部
# 指南引用，把引用本身正确、索引原先漏登记的路径补齐——它们此前落成「不在索引中」，
# 读起来像引用错了。同日转录节正文时又订正一处真实错误：送达规则原登记为
# 第五部分第二章2.3.1，而第五部分第二章是专利费用、不含该节；该节在第五部分第六章2.3.1。
