  - path: 第二部分第三章3.2.1
    topics: [新颖性, 相同内容]
    text: |-
      如果要求保护的发明或者实用新型与对比文件所公开的技术内容完全相同，或者仅仅是简单的文字变换，则该发明或者实用新型不具备新颖性。另外，上述相同的内容应该理解为包括可以从对比文件中直接地、毫无疑义地确定的技术内容。例如一件发明专利申请的权利要求是“一种电机转子铁心，所述铁心由钕铁硼永磁合金制成，所述钕铁硼永磁合金具有四方晶体结构并且主相是Nd2Fe14B 金属间化合物”，如果对比文件公开了“采用钕铁硼磁体制成的电机转子铁心”，就能够使上述权利要求丧失新颖性，因为该领域的技术人员熟知所谓的“钕铁硼磁体”即指主相是Nd2Fe14B 金属间化合物的钕铁硼永磁合金，并且具有四方晶体结构。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第三章3.2.2
    topics: [新颖性, 上位概念, 下位概念]
    text: |-
      如果要求保护的发明或者实用新型与对比文件相比，其区别仅在于前者采用一般（上位）概念，而后者采用具体（下位）概念限定同类性质的技术特征，则具体（下位）概念的公开使采用一般（上位）概念限定的发明或者实用新型丧失新颖性。例如，对比文件公开某产品是“用铜制成的”，就使“用金属制成的”同一产品的发明或者实用新型丧失新颖性。但是，该铜制品的公开并不使铜之外的其他具体金属制成的同一产品的发明或者实用新型丧失新颖性。
      反之，一般（上位）概念的公开并不影响采用具体（下位）概念限定的发明或者实用新型的新颖性。例如，对比文件公开的某产品是“用金属制成的”，并不能使“用铜制成的”同一产品的发明或者实用新型丧失新颖性。又如，要求保护的发明或者实用新型与对比文件的区别仅在于发明或者实用新型中选用了“氯”来代替对比文件中的“卤素”或者另一种具体的卤素“氟”，则对比文件中“卤素”的公开或者“氟”的公开并不导致用氯对其作限定的发明或者实用新型丧失新颖性。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第三章3.2.4
    topics: [新颖性, 数值范围]
    text: |-
      如果要求保护的发明或者实用新型中存在以数值或者连续变化的数值范围限定的技术特征，例如部件的尺寸、温度、压力以及组合物的组分含量，而其余技术特征与对比文件相同，则其新颖性的判断应当依照以下各项规定。
      （1）对比文件公开的数值或者数值范围落在上述限定的技术特征的数值范围内，将破坏要求保护的发明或者实用新型的新颖性。
      【例1】
      专利申请的权利要求为一种铜基形状记忆合金，包含10%～35%（重量）的锌和2%～8%（重量）的铝，余量为铜。如果对比文件公开了包含20%（重量）锌和5%（重量）铝的铜基形状记忆合金，则上述对比文件破坏该权利要求的新颖性。
      【例2】
      专利申请的权利要求为一种热处理台车窑炉，其拱衬厚度为100 毫米～400 毫米。如果对比文件公开了拱衬厚度为180毫米～250 毫米的热处理台车窑炉，则该对比文件破坏该权利要求的新颖性。
      （2）对比文件公开的数值范围与上述限定的技术特征的数值范围部分重叠或者有一个共同的端点，将破坏要求保护的发明或者实用新型的新颖性。
      【例1】
      专利申请的权利要求为一种氮化硅陶瓷的生产方法，其烧成时间为1 小时～10 小时。如果对比文件公开的氮化硅陶瓷的生产方法中的烧成时间为4 小时～12 小时，由于烧成时间在4小时～10 小时的范围内重叠，则该对比文件破坏该权利要求的新颖性。
      【例2】
      专利申请的权利要求为一种等离子喷涂方法，喷涂时的喷枪功率为20kW～50kW。如果对比文件公开了喷枪功率为50kW ～80kW 的等离子喷涂方法，因为具有共同的端点50kW，则该对比文件破坏该权利要求的新颖性。
      （3）对比文件公开的数值范围的两个端点将破坏上述限定的技术特征为离散数值并且具有该两端点中任一个的发明或者实用新型的新颖性，但不破坏上述限定的技术特征为该两端点之间任一数值的发明或者实用新型的新颖性。
      【例如】
      专利申请的权利要求为一种二氧化钛光催化剂的制备方法，其干燥温度为40℃、58℃、75℃或者100℃。如果对比文件公开了干燥温度为40℃～100℃的二氧化钛光催化剂的制备方法，则该对比文件破坏干燥温度分别为40℃和100℃时权利要求的新颖性，但不破坏干燥温度分别为58℃和75℃时权利要求的新颖性。
      （4）上述限定的技术特征的数值或者数值范围落在对比文件公开的数值范围内，并且与对比文件公开的数值范围没有共同的端点，则对比文件不破坏要求保护的发明或者实用新型的新颖性。
      【例1】
      专利申请的权利要求为一种内燃机用活塞环，其活塞环的圆环直径为95 毫米，如果对比文件公开了圆环直径为70 毫米～105 毫米的内燃机用活塞环，则该对比文件不破坏该权利要求的新颖性。
      【例2】
      专利申请的权利要求为一种乙烯－丙烯共聚物，其聚合度为100～200，如果对比文件公开了聚合度为50～400 的乙烯－丙烯共聚物，则该对比文件不破坏该权利要求的新颖性。
      有关数值范围的修改适用本部分第八章第5.2 节的规定。有关通式表示的化合物的新颖性判断适用本部分第十章第5.1节的规定。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第三章3.2.5
    topics: [新颖性, 性能参数, 产品权利要求]
    text: |-
      对于包含性能、参数、用途、制备方法等特征的产品权利要求新颖性的审查，应当按照以下原则进行。
      （1）包含性能、参数特征的产品权利要求
      对于这类权利要求，应当考虑权利要求中的性能、参数特征是否隐含了要求保护的产品具有某种特定结构和/或组成。如果该性能、参数隐含了要求保护的产品具有区别于对比文件产品的结构和/或组成，则该权利要求具备新颖性；相反，如果所属技术领域的技术人员根据该性能、参数无法将要求保护的产品与对比文件产品区分开，则可推定要求保护的产品与对比文件产品相同，因此申请的权利要求不具备新颖性，除非申请人能够根据申请文件或者现有技术证明权利要求中包含性能、参数特征的产品与对比文件产品在结构和/或组成上不同。例如，专利申请的权利要求为用X 衍射数据等多种参数表征的一种结晶形态的化合物A，对比文件公开的也是结晶形态的化合物A，如果根据对比文件公开的内容，难以将两者的结晶形态区分开，则可推定要求保护的产品与对比文件产品相同，该申请的权利要求相对于对比文件而言不具备新颖性，除非申请人能够根据申请文件或者现有技术证明，申请的权利要求所限定的产品与对比文件公开的产品在结晶形态上的确不同。
      （2）包含用途特征的产品权利要求
      对于这类权利要求，应当考虑权利要求中的用途特征是否隐含了要求保护的产品具有某种特定结构和/或组成。如果该用途由产品本身固有的特性决定，而且用途特征没有隐含产品在结构和/或组成上发生改变，则该用途特征限定的产品权利要求相对于对比文件的产品不具有新颖性。例如，用于抗病毒的化合物X 的发明与用作催化剂的化合物X 的对比文件相比，虽然化合物X 用途改变，但决定其本质特性的化学结构式并没有任何变化，因此用于抗病毒的化合物X 的发明不具备新颖性。但是，如果该用途隐含了产品具有特定的结构和/或组成，即该用途表明产品结构和/或组成发生改变，则该用途作为产品的结构和/或组成的限定特征必须予以考虑。例如“起重机用吊钩”是指仅适用于起重机的尺寸和强度等结构的吊钩，其与具有同样形状的一般钓鱼者用的“钓鱼用吊钩”相比，结构上不同，两者是不同的产品。
      （3）包含制备方法特征的产品权利要求
      对于这类权利要求，应当考虑该制备方法是否导致产品具有某种特定的结构和/或组成。如果所属技术领域的技术人员可以断定该方法必然使产品具有不同于对比文件产品的特定结构和/或组成，则该权利要求具备新颖性；相反，如果申请的权利要求所限定的产品与对比文件产品相比，尽管所述方法不同，但产品的结构和组成相同，则该权利要求不具备新颖性，除非申请人能够根据申请文件或者现有技术证明该方法导致产品在结构和/或组成上与对比文件产品不同，或者该方法给产品带来了不同于对比文件产品的性能从而表明其结构和/或组成已发生改变。例如，专利申请的权利要求为用X 方法制得的玻璃杯，对比文件公开的是用Y 方法制得的玻璃杯，如果两个方法制得的玻璃杯的结构、形状和构成材料相同，则申请的权利要求不具备新颖性。相反，如果上述X 方法包含了对比文件中没有记载的在特定温度下退火的步骤，使得用该方法制得的玻璃杯在耐碎性上比对比文件的玻璃杯有明显的提高，则表明要求保护的玻璃杯因制备方法的不同而导致了微观结构的变化，具有了不同于对比文件产品的内部结构，该权利要求具备新颖性。
      上述第3.2.1 至3.2.5 节中的基准同样适用于创造性判断中对该类技术特征是否相同的对比判断。
