# 转换语义: pattern_analysis(期望模式)→structural_analysis 单 element；severity warning→major；info→minor
version: "1.0"
rules:
  - id: CON-COMP-0101
    name: 禁止编造占位专利号
    domain: patent_general
    phase: post_execution
    severity: critical
    action: block
    basisKind: practice-note
    check:
      type: keyword_blocklist
      # 「不得使用 CNXXXXXX」是合规警示，不是占位号本身；引文同理。
      negationContext: true
      quoteImmune: true
      keywords:
        - CNXXXXXX
        - CNxxxxxx
        - CNXXXXXXX
        - CNxxxxxxx
        - CN20XX
        - CN20xx
        - (20XX)
        - (20xx)
        - （20XX）
        - （20xx）
        - USXXXXXXX
        - USXXXXXXXX
        - US20XX
        - WO20XX/
        - ZL20XX
  - id: CON-COMP-0104
    name: 禁止编造审查指南内容
    domain: patent_general
    phase: post_execution
    severity: critical
    action: block
    basisKind: practice-note
    check:
      type: structural_analysis
      requiresAll:
        - element: 期望模式
          description: 禁止编造审查指南内容
          patterns:
            - 审查指南
      minConfidence: 1
  - id: CON-COMP-0105
    name: 禁止商业宣传用语
    description: 说明书不得使用商业性宣传用语
    domain: patent_general
    phase: post_execution
    severity: major
    action: warn
    legalBasis: 专利法实施细则第二十条第三款；审查指南第二部分第二章2.2.7
    basisKind: statute
    check:
      type: keyword_blocklist
      negationContext: true
      quoteImmune: true
      keywords:
        - 世界领先
        - 行业首创
        - 独一无二
        - 前所未有
        - 最先进
        - 革命性
        - 颠覆性
        - 突破性
