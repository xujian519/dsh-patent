  - article: 4
    topics: ['在授予专利权之后的专利权有效期内,专利权人或者经']
    text: '在授予专利权之后的专利权有效期内,专利权人或者经专利权人同意享有专利标识标注权的被许可人可以在其专利产品、依照专利方法直接获得的产品、该产品的包装或者该产品的说明书等材料上标注专利标识。'
    sourceDoc: '专利标识标注办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 5
    topics: ['标注专利标识的,应当标明下述内容']
    text: |-
      标注专利标识的,应当标明下述内容:
      (一)采用中文标明专利权的类别,例如中国发明专利、中国实用新型专利、中国外观设计专利;
      (二)国家知识产权局授予专利权的专利号。
      除上述内容之外,可以附加其他文字、图形标记,但附加的文字、图形标记及其标注方式不得误导公众。
    sourceDoc: '专利标识标注办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 6
    topics: [在依照专利方法直接获得的产品、该产品的包装或者该]
    text: '在依照专利方法直接获得的产品、该产品的包装或者该产品的说明书等材料上标注专利标识的,应当采用中文标明该产品系依照专利方法所获得的产品。'
    sourceDoc: '专利标识标注办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 7
    topics: [专利权被授予前在产品、该产品的包装或者该产品的说]
    text: '专利权被授予前在产品、该产品的包装或者该产品的说明书等材料上进行标注的,应当采用中文标明中国专利申请的类别、专利申请号,并标明“专利申请,尚未授权”字样。'
    sourceDoc: '专利标识标注办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 8
    topics: [专利标识的标注不符合本办法第五条、第六条或者第七]
    text: |-
      专利标识的标注不符合本办法第五条、第六条或者第七条规定的,由管理专利工作的部⻔责令改正。
      专利标识标注不当,构成假冒专利行为的,由管理专利工作的部⻔依照专利法第六十三条的规定进行处罚。
    sourceDoc: '专利标识标注办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

