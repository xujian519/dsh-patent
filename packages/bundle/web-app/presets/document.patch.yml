# Agent preset document: one `@deepseek-ai/dsh-agent-preset` declaration
# inserted after the web patch, carrying the document-delivery agent
# composition. A service row here MUST sit inside a group carrying an `isolate`
# realm: without one it publishes into the root realm, where it is
# process-global and the registry refuses the mount. Edits saved from the Web
# editor override this row's `config.plugins` by id from the profile patch.
- insert:
    - id: preset-document
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: document
        name: 文档模式
        description: 面向产品/技术/运营/市场团队的文档交付 Agent：把需求拆解为规范成品——Markdown/Word 文档、HTML 单页工件、PDF（HTML 渲染导出）与 PPTX 演示。可挂载 OpenDesign 技能库（OPEN_DESIGN_DIR）增强模板与设计系统。交付前按 P0/P1 清单自检，登记交付物时做确定性复核。
        order: 6
        plugins:
          # ── identity ────────────────────────────────────────────────────────────────

          # The preset's own persona, shadowing the deployment default for this agent.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是资深文档交付工程师，服务于产品、技术、运营与市场团队，专职把需求交付为规范成品：Markdown/Word 文档、HTML 单页工件、PDF（HTML 渲染导出）与 PPTX 演示。工作语言为简体中文（按需求支持英文/双语）。

                ## 身份与专业边界
                - 你的专业领域：技术写作、产品文档（PRD/FAQ/Release Notes）、方案与报告、演示文稿、单页 HTML 工件（原型/落地页/仪表盘/海报）。
                - 你熟悉文档工程规范：清晰的信息架构、简洁的层级与留白、一致的术语与风格、可访问性（语义化 HTML、对比度、键盘导航）、自包含交付（单文件 HTML，内联样式与资源，不依赖外部 CDN）。
                - 你有权使用 shell 与文件系统把成品写入规范文件；聊天里只给摘要与关键决策，不给成品全文（HTML 全量代码不进对话）。

                ## 作业纪律（违背任意一条即视为失职）
                1. 交付物即文件：成品以规范文件名写入会话工作区（命名约定见 document-quality-gate 技能），交付时给出文件路径清单与导出格式。
                2. 无来源即撤回：任何事实性断言（数据、日期、引用、版本）必须附可验证来源（URL / 文件路径 / 附件）；URL 来源要用 `web_fetch` 打开原文核对，只凭 `web_search` 的摘要不算来源。拿不出来源就删除该断言。
                3. 不发明品牌：无设计系统时先用默认基线（System UI 字体栈 + 中性色板 + 单一强调色），或询问用户；不得凭空捏造品牌色/字体。
                4. 自包含优先：HTML 单文件内联资源；图片用占位（除非用户提供）；不引用外部 CDN。
                5. HITL 确认点不可跳过：brief 拆解、文档大纲、模板/风格选择、导出格式，在动手前用 ask_user_question 确认或至少说明取舍理由。
                6. 质量门强制：交付前执行 document-quality-gate 的 P0/P1 清单，P0 不过不交付——你自己核；登记时 `document_deliver` 只核该技能的确定性项表，不核 P0/P1 自述，阻断项先修。

                ## 标准作业流程
                brief 拆解（document-brief：目标/受众/格式/设计系统/成功标准）→ 大纲与结构 → 模板/设计系统选择 → 撰写与渲染 → document-quality-gate 自检 → HITL 确认 → 交付（文件 + 导出 + 打开方式）。

                ## 工具与技能
                - 撰写与渲染：内置技能 document-brief / document-html / document-report / document-deck / document-word / document-quality-gate 定义各自的管线与检查清单。
                - 模板库：随包模板用 `list_doc_templates` 查目录、`render_doc_template` 出 Markdown/HTML/DOCX 成品（变量表、残余占位符与警告都在返回值里，交付前必须读）。成品传 `output_path` 落盘，结果只回路径与字节数。若 OPEN_DESIGN_DIR 已配置（本 preset 自动挂载 open-design 技能源），同时优先使用其渲染模板与设计技能（web-prototype / saas-landing / dashboard / html-ppt-* / pm-spec 等）。
                - 书写风格：本部署已注入 assistant-neutral 样式指南（语气、禁用词、引用与免责声明约定）；`document_deliver` 的确定性核验用同一份风格判定禁用词，交付前按提示改掉。
                - Word：需要 .docx 时用 `render_doc_template`（format: docx）按模板生成，`output_path` 必填；页眉页脚、目录字段、页码等模板不覆盖的排版再用 officecli 技能加工。
                - 交付登记：成品落盘后调用 `document_deliver`（文件、格式、P0/P1 自述、style、char_budget），阻断项先修。
                - 长任务：一份交付物注册一个 goal；多阶段作业用 todo 跟踪；需要脚本化流水线时用 workflow；复杂文档（长报告/多章手册）可用 subagent_fork 专家互评（写作/评审角色）。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── clock ───────────────────────────────────────────────────────────────────

          # `document-quality-gate` 的 P1 页脚项要求文档名、日期与版本，persona 的
          # 「无来源即撤回」要求日期与版本可核验：模型需要知道「今天」，没有此行时
          # 只能绕道跑 `date`。插件在 agent/pre-step 追加一条带来源的时间快照 user
          # 消息，模型可见且入日志。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
          # publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
          # the criterion for host-plane ownership — injection resolves before any session
          # exists, so there is no agent to key by. Behind a preset realm those variables
          # never reached the model's shell at all. Both shell tools consume the host
          # registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
          # host-plane too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host plane:
          # its producers sit outside any realm this file could put it in — `tool-bash`
          # above resolves it with `ctx.get`, and an entry-local realm here is invisible
          # to every sibling row, so `run_in_background` would answer "background jobs
          # unavailable" while these controls sat in the catalog. The registry is keyed by
          # owning agent anyway, so one host instance serves every session. What a preset
          # chooses is whether its agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # 长报告与手册的交付提醒（章节交付、审阅回访、发布窗口）落在持久排程上。
          # 只挂模型可见的排程工具；排程 REGISTRY 与触发器留在 host 平面。
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes the six delivery skills (document-brief /
          # document-html / document-report / document-deck / document-word /
          # document-quality-gate, listed in presets/document.md) through
          # `customSkillDirs`; the root resolves through the package that ships them —
          # `@deepseek-ai/dsh-web-app/skills/document` — the way the loader resolves
          # plugin specifiers, so it follows the installation.
          # `skill-open-design` mounts an OpenDesign checkout's Agent-Skills
          # directories (skills/ + design-templates/) as an isolated provider when
          # `OPEN_DESIGN_DIR` is set — without the variable it registers with no roots,
          # an explicit empty catalog. `tool-skill` gives the agent the catalog and
          # loader; the merged catalog also carries whatever the deployment registered
          # globally.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-web-app/package.json')), 'skills/document')

          - id: skill-open-design
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: open-design
              includeDefaultRoots: false
              customSkillDirs: !!js 'process.env.OPEN_DESIGN_DIR ? [process.env.OPEN_DESIGN_DIR + "/skills", process.env.OPEN_DESIGN_DIR + "/design-templates"] : []'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── deliverable registration ────────────────────────────────────────────────

          # `tool-document-deliver` registers the model-facing `document_deliver` tool:
          # after the quality gate passes it records the delivered files, formats, and
          # P0/P1 gate state, and reads the delivered bytes itself to report its own
          # deterministic findings (residual placeholders, undeclared anchors, empty
          # sections, style forbidden words, the declared length budget) beside that
          # declaration. The call is session-logged, so the delivery studio derives the
          # deliverable list, the gate badges, and the machine-check badge without any
          # host write RPC; the tool resolves declared files through the HOST-plane `fs`
          # service and loads the packaged styles. It provides nothing, so it needs no
          # realm.
          - id: tool-document-deliver
            name: '@deepseek-ai/dsh-document-deliver'
            config:
              # The style the quality gate checks; it names the same style as the
              # `doc-template` row below, and `tests/document-preset.spec.ts` fails
              # when the two names drift apart.
              defaultStyle: assistant-neutral

          # `doc-template` registers the model-facing `list_doc_templates` and
          # `render_doc_template` tools over the packaged template assets and the
          # document styles they name, so a delivery starts from a reviewed template
          # instead of a hand-written document. `styleGuide` also injects that style's
          # guide as a system-prompt section and is the style `document_deliver` checks
          # against, so the words the model is told to avoid and the words the gate
          # refuses are the same list; both rows name that style explicitly, and
          # `tests/document-preset.spec.ts` fails when the two names drift apart. It
          # provides nothing, so it needs no realm.
          - id: doc-template
            name: '@deepseek-ai/dsh-doc-template'
            config:
              styleGuide: assistant-neutral

          # ── goals ───────────────────────────────────────────────────────────────────

          # The host patch disables its own `command-goal` row and leaves the command to
          # the preset ("presets own the human command and model-facing tool"). The goal
          # SERVICE and its session driver stay on the host plane: the Gateway serves the
          # goal domain as Remote endpoints whose receiver comes from a generated
          # descriptor, so it resolves `goals` on the host and an entry-local realm here
          # would hide it. The registry is keyed by session anyway, so one host instance
          # serves every session. What a preset chooses is whether its agent can call the
          # goal tool and whether its user gets the `/goal` command.
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is the correct
          # lifetime. The section carries the document-delivery planning discipline
          # first and then the standard plan-mode mechanics.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    计划正文与计划产物一律使用简体中文；在计划与思考过程中使用简体中文表述。

                    你在计划模式中。面向文档交付作业：交付规范（目标/受众/格式/设计系统）、文档大纲与结构、模板与渲染方案、导出清单都属于"计划"范畴；获批前不得生成对外交付文件（`document_deliver` 接受的格式：markdown / html / pdf / docx / pptx / other）。先完成：brief 拆解 → 方案 → 用 exit_plan_mode 提交计划。计划须包含：交付目标与成功标准、文档结构与大纲、模板与设计系统、阶段产物清单、HITL 确认点、风险与备选方案、验收方式。brief 与大纲在计划模式下以计划正文提交，获批后再落盘。

                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual workspace. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where something lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group the work into ordered steps; name what each step hands to the next; cover edge cases, failure modes, checks, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another person can carry it out without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
          # share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
          # plane, and the rows here resolve that one instance. It takes no configuration,
          # keys every fold by Session, and owns the context-meter projection units the
          # browser reads for every session — behind a realm those units would come and go
          # with whichever presets happen to be mounted. What a preset chooses is whether
          # its agent compacts at all, which is `compaction-basic` below.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so every row
          # that reaches it shares one entry-local realm here, and a consumer left
          # outside would resolve a host registry this preset does not populate.
          #
          # `tool-subagent-report` is host-plane for the same reason as the registry,
          # not because a preset may not want it: it registers a CONTINUABLE SETUP on
          # that singleton rather than a tool this agent calls, and the setup list is
          # not scope-aware — one copy per mounted preset means every child gets
          # `report` registered once per live session, which throws on the second.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork

              # Production dsh does not install these optional providers. Install the
              # matching Bundle in this Profile and restart the Host, then copy this
              # preset and remove `disabled` from the matching tool row. Host availability
              # alone grants no tool.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session. `fetch` is true because every shipped
          # composition mounts the http fetch provider (`dsh-base` composes
          # `dsh-web-fetch-http` with `fetchProvider: http`, and no bundle disables it):
          # the persona's source rule requires each factual assertion to carry a source
          # the reader can check, and `web_search` returns summaries — only `web_fetch`
          # opens the cited page. The provider accepts only public HTTP(S) destinations,
          # resolves and validates every destination, and pins every connection, so the
          # tool cannot be pointed at a private address; a deployment that strips the
          # provider from its own host composition must set `fetch: false` again, or
          # `web_fetch` fails every call with WEB_PROVIDER_UNAVAILABLE.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
