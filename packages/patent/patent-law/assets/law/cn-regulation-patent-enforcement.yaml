    text: '为深入推进依法行政,规范专利行政执法行为,保护专利权人和社会公众的合法权益,维护社会主义市场经济秩序,根据《中华人⺠共和国专利法》、《中华人⺠共和国专利法实施细则》以及其他有关法律法规,制定本办法。'
