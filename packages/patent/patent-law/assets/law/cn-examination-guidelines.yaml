  - path: 第二部分第二章3.3.2
    topics: [从属权利要求, 引用]
    text: |-
      根据专利法实施细则第二十五条第一款的规定，发明或者实用新型的从属权利要求应当包括引用部分和限定部分，按照下列规定撰写：
      （1）引用部分：写明引用的权利要求的编号及其主题名称；
      （2）限定部分：写明发明或者实用新型附加的技术特征。
      从属权利要求只能引用在前的权利要求。引用两项以上权利要求的多项从属权利要求只能以择一方式引用在前的权利要求，并不得作为被另一项多项从属权利要求引用的基础，即在后的多项从属权利要求不得引用在前的多项从属权利要求。
      从属权利要求的引用部分应当写明引用的权利要求的编号，其后应当重述引用的权利要求的主题名称。例如，一项从属权利要求的引用部分应当写成：“根据权利要求1 所述的金属纤维拉拔装置，……”。
      多项从属权利要求是指引用两项以上权利要求的从属权利要求，多项从属权利要求的引用方式，包括引用在前的独立权利要求和从属权利要求，以及引用在前的几项从属权利要求。
      当从属权利要求是多项从属权利要求时，其引用的权利要求的编号应当用“或”或者其他与“或”同义的择一引用方式表达。例如，从属权利要求的引用部分写成下列方式：“根据权利要求1 或2 所述的……”；“根据权利要求2、4、6 或8所述的……”；或者“根据权利要求4 至9 中任一权利要求所述的……”。
      一项引用两项以上权利要求的多项从属权利要求不得作为另一项多项从属权利要求的引用基础。例如，权利要求3 为“根据权利要求1 或2 所述的摄像机调焦装置，……”，如果多项从属权利要求4 写成“根据权利要求1、2 或3 所述的摄像机调焦装置，……”，则是不允许的，因为被引用的权利要求3 是一项多项从属权利要求。
      从属权利要求的限定部分可以对在前的权利要求（独立权利要求或者从属权利要求）中的技术特征进行限定。在前的独立权利要求采用两部分撰写方式的，其后的从属权利要求不仅可以进一步限定该独立权利要求特征部分中的特征，也可以进一步限定前序部分中的特征。
      直接或间接从属于某一项独立权利要求的所有从属权利要求都应当写在该独立权利要求之后，另一项独立权利要求之前。
