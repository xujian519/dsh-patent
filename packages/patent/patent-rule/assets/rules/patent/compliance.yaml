# 专利域合规规则（宪法规则资产）
# 由宪法规则引擎加载（src/rule/），规则驱动输出门禁与工具拦截。
# 规则格式: id/name/domain/phase/severity/action/legalBasis/check

version: "1.0"

rules:
  # ---------------------------------------------------------------------------
  # 风险结论免责声明：命中即追加"不构成正式法律意见"提示（warn）
  # ---------------------------------------------------------------------------
  patent_risk_disclaimer:
    id: PAT-RISK-001
    name: 专利风险结论免责声明
    domain: patent
    phase: 输出
    severity: major
    action: warn
    legalBasis: 执业规范：AI 输出不构成正式法律意见，应由专利代理人/律师确认
    basisKind: practice-note
    check:
      type: keyword_blocklist
      # 否定语境（"不构成侵权"/"避免侵权"）不误报
      negationContext: true
      # 引文豁免：条款词是审查意见/法条的高频被引词，答复书逐字引述通知书或法条时
      # 命中的是引文措辞（"请求宣告无效"），不是本模型给出的风险结论。未闭合引号不豁免。
      quoteImmune: true
      # 只收风险结论的完整措辞：裸「侵权/无效/驳回/专利性」是案件主题词，
      # 几乎每份侵权意见/无效请求都会出现，按裸词触发会把免责提示变成全文噪声。
      keywords:
        - "构成侵权"
        - "侵权成立"
        - "侵权风险"
        - "宣告无效"
        - "无效风险"
        - "驳回风险"
        - "将被驳回"
        - "应当驳回"
        - "不授权"
        - "具备专利性"
        - "不具备专利性"
        - "自由实施风险"
        - "可以自由实施"
        - "新颖性结论"
        - "创造性结论"

  # ---------------------------------------------------------------------------
  # 结论性表述人工审批：命中即挂起，需人工审批后入库（review）
  # ---------------------------------------------------------------------------
  patent_approval_review:
    id: PAT-APPROVAL-001
    name: 专利结论人工审批
    domain: patent
    phase: 输出
    severity: critical
    action: review
    legalBasis: 质量门禁：结论性/侵权性/有效性判断需人工确认
    basisKind: practice-note
    check:
      type: keyword_blocklist
      # 「不应给出最终建议」不是结论；引文里的条款词也不是本模型的主张。
      negationContext: true
      quoteImmune: true
      keywords:
        - "专利结论"
        - "侵权判断"
        - "有效性结论"
        - "最终建议"

  # ---------------------------------------------------------------------------
  # 回避绝对化表述（warn）
  # P-A07 条款
  # ---------------------------------------------------------------------------
  patent_absolute_phrases:
    id: PAT-ABS-001
    name: 回避绝对化表述
    domain: patent
    phase: 输出
    severity: minor
    action: warn
    legalBasis: 审查规范：回避绝对化断言（绝对可以/一定能够/必然导致等），改用限定性表述
    basisKind: practice-note
    check:
      type: keyword_blocklist
      # 否定语境（"不一定"/"绝非绝对"）不误报
      negationContext: true
      # 引文豁免：答复书逐字引述审查意见（如通知书的「需要一定的时间」）时，命中的是
      # 审查员的措辞而非本模型的绝对化断言——2026-09-30 案件实测（26.3 答复把审查员的
      # 「一定」判成本模型违规）。未闭合引号不豁免（宁可误报，不静默放行红线）。
      quoteImmune: true
      # 只收绝对化断言的完整措辞：裸「一定/绝对/必然」在「一定的弹性」
      # 「绝对新颖性」「反对绝对化表述」里是正常术语或否定对象，误报远高于命中。
      keywords:
        - "绝对可以"
        - "绝对可行"
        - "绝对能"
        - "绝对是"
        - "绝对优于"
        - "绝对领先"
        - "一定能够"
        - "一定会"
        - "一定是"
        - "一定属于"
        - "一定具有"
        - "百分百"
        - "毫无疑问"
        - "必然导致"
        - "必然会"
        - "必然能够"

  # ---------------------------------------------------------------------------
  # 法条引用范围核验 R1：条号上限读随包索引，资产不再写死条数（warn）。
  # ---------------------------------------------------------------------------
  patent_citation_range:
    id: PAT-CITE-001
    name: 法条引用范围核验
    domain: patent
    phase: 输出
    severity: major
    action: warn
    legalBasis: 引用核验 R1：条号不得超出随包索引的有效范围
    basisKind: practice-note
    check:
      type: citation_analysis
      statutes:
        专利法: {}
        专利法实施细则: {}
