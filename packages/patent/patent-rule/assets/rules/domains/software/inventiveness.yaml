# 软件/AI 领域规则包 — 客体（专利法 25.1.2）答辩论证完整性
# 依据：《专利审查指南》第二部分第一章 4.2、第二部分第九章 2（技术三要素）。
# 适用前提（premise）即语境锚点：不在讨论客体/技术三要素的文本不评估，
# 否则该规则会在任何提到「技术效果」的说明书或答复上命中 2/3。

version: "1.0"

rules:
  # ---------------------------------------------------------------------------
  # 客体答辩三要素（指南二部九章 6.1.1）
  # 主张方案属于可专利客体时，须同时说明所解决的技术问题、采用的技术手段与
  # 达到的技术效果；缺任一要素，答辩理由不完整（审查员会直接回到 25.1.2）。
  # 锚点命中后要求 3/3：2/3 = 0.67 < 0.75，即缺一要素就报。
  # ---------------------------------------------------------------------------
  software_subject_matter_argument:
    id: SOFT-INV-001
    name: 客体答辩三要素论证完整性
    domain: software
    description: 主张方案属于可专利客体时，须同时给出技术问题、技术手段与技术效果
    phase: 论证
    severity: minor
    action: warn
    legalBasis: 《专利审查指南》第二部分第一章 4.2、第二部分第九章 2：涉及算法或商业规则的方案须同时解决技术问题、采用技术手段、达到技术效果
    basisKind: guideline
    premise:
      - 客体
      - 智力活动
      - 技术三要素
      - 可专利
    check:
      type: structural_analysis
      requiresAll:
        - element: 技术问题
          description: 方案所解决的技术问题
          patterns:
            - 技术问题
        - element: 技术手段
          description: 所采用的技术手段
          patterns:
            - 技术手段
        - element: 技术效果
          description: 所达到的技术效果
          patterns:
            - 技术效果
      minConfidence: 0.75
