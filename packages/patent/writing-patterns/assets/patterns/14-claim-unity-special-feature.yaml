id: "wp-claim-unity-special-feature"
name: "单一性检查——标出特定技术特征，核对各类独权是否共享"
category: "claim_drafting"
summary: "一件申请中的多项独立权利要求必须属于一个总的发明构思，即共享相同或相应的特定技术特征；撰写时先标出每项独权的特定技术特征，再核对产品、方法、用途独权是否共享。"
context: "适用于一件申请包含产品、方法、用途或装置多项独权时的定稿检查。"
keywords: ["单一性", "特定技术特征", "总的发明构思", "分案", "独立权利要求"]
source_ref: "专利法第31条第1款；审查指南第二部分第六章"
quality: 0.86
version: 1
steps:
  - order: 1
    name: "标出特定技术特征"
    instruction: "对每项独立权利要求，指出其作为整体对现有技术作出贡献的技术特征；这些特征才是判断单一性的依据，不是主题名称或共同的应用场景。"
  - order: 2
    name: "两两比对"
    instruction: "比较各独权的特定技术特征是否相同或相应；产品权要与方法权要的对应关系应写成相同技术特征，而不是「用于制造该产品」一句带过。"
  - order: 3
    name: "不共享时处理"
    instruction: "不能共享时，优先把共同构思补入各项独权；确实无法合并的，按分案处理，并在说明书发明内容中写明共同的发明构思。"
  - order: 4
    name: "记录理由"
    instruction: "把每项独权的特定技术特征与比对结论写入审查记录，便于答复单一性审查意见时直接引用。"
examples:
  - context: "产品与方法并存"
    text: "产品独权的特定技术特征是「螺旋通道的螺距与截面比」，方法独权应写成使用同一螺距与截面比进行加热，而不是仅写「使用上述储罐」。"
dos:
  - rule: "以特定技术特征判断单一性，不以主题名称或应用领域判断"
  - rule: "分案前先确认共同构思已在原始说明书公开"
donts:
  - rule: "不要把「同一台设备的不同用途」当然视为一个发明构思"
  - rule: "不要用功能上的泛泛关联代替相同或相应的技术特征"
