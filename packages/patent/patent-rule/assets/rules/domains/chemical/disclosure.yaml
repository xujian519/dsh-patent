# 化学领域规则包 — 生物材料保藏信息完整性
# 依据：《专利法》第二十六条第三款、《专利审查指南》第二部分第十章。
# 适用前提（premise）即语境锚点：文本没有出现保藏字样或保藏机构编号时不评估，
# 否则任何生物医药文本都会因为「没写保藏日期」被误报。
# 四要素要求 4/4（3/4 = 0.75 会通过 0.75 的阈值，故阈值取 0.9）。

version: "1.0"

rules:
  # ---------------------------------------------------------------------------
  # 生物材料保藏信息四要素
  # 说明书与请求书须一致记载：保藏单位、保藏日期、保藏编号、分类命名。
  # 只写「已保藏」或只给编号，都不足以让公众获得该材料。
  # ---------------------------------------------------------------------------
  chemical_biological_deposit:
    id: CHEM-DIS-001
    name: 生物材料保藏信息完整性
    domain: chemical
    description: 涉及生物材料保藏时，须同时记载保藏单位、保藏日期、保藏编号与分类命名
    phase: 撰写
    severity: major
    action: warn
    legalBasis: 《专利法》第二十六条第三款、《专利审查指南》第二部分第十章：保藏信息应写明保藏单位、地址、日期、编号及分类命名
    basisKind: statute
    premise:
      - 保藏
      - CCTCC
      - CGMCC
      - ATCC
      - DSM
    check:
      type: structural_analysis
      requiresAll:
        - element: 保藏单位
          description: 保藏机构的名称与地址
          patterns:
            - 保藏单位
            - 中国典型培养物保藏中心
            - 中国微生物菌种保藏管理委员会
            - 美国典型培养物保藏中心
        - element: 保藏日期
          description: 交存日期
          patterns:
            - 保藏日期
            - 交存日期
        - element: 保藏编号
          description: 保藏机构给出的登记编号
          patterns:
            - 保藏编号
            - CCTCC
            - CGMCC
            - ATCC
            - DSM
        - element: 分类命名
          description: 生物材料的分类命名（拉丁学名）
          patterns:
            - 分类命名
            - 拉丁学名
            - 分类学名称
      minConfidence: 0.9
