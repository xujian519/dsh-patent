id: "wp-claim-functional-limitation"
name: "功能性限定——说明书中给出足够实施方式"
category: "claim_drafting"
summary: "功能性限定会被理解为覆盖所有能实现该功能的方式；只有在结构、参数或方法特征难以限定，且说明书给出足够实施方式时才能使用，否则应改为具体特征。"
context: "适用于机械、电学与软件案中拟用功能或效果限定技术特征的场合。"
keywords: ["功能性限定", "26.4", "实施方式", "以说明书为依据"]
source_ref: "专利法第26条第4款；审查指南第二部分第二章3.2.1"
quality: 0.88
version: 1
steps:
  - order: 1
    name: "先判断能否用具体特征"
    instruction: "优先用结构、参数、步骤或连接关系限定；只有在这些特征无法清楚表达，且功能限定更恰当时才保留功能性限定。"
  - order: 2
    name: "列出实现方式"
    instruction: "在说明书中写出实现该功能的至少一种具体结构或步骤，并说明其输入输出与作用关系；不要只写「能够实现上述功能」。"
  - order: 3
    name: "检查替代方式"
    instruction: "确认本领域技术人员能想到的其他实现方式也能达到同一效果；若不能，缩小功能限定的范围或改为具体实施方式。"
  - order: 4
    name: "排除纯功能权要"
    instruction: "整项权利要求只有功能或效果描述时，必须补入实现该功能的必要技术特征，否则不予保留。"
examples:
  - context: "软件案"
    text: "「用于对数据进行预处理的模块」应改为「用于按预设字段顺序过滤输入数据并输出结构化记录的模块」，并在说明书写明过滤规则。"
dos:
  - rule: "功能性限定与说明书中的至少一种具体实现一一对应"
  - rule: "写清功能实现的输入、输出与判断条件"
donts:
  - rule: "不要用「能够实现……的所有方式」扩大保护范围"
  - rule: "不要把仅在实施例中出现的特定结构直接写成功能上位"
