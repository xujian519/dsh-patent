    sections:
      - path: 第二部分第一章4.4
        topics: [动物和植物品种]
        text: |-
          动物和植物是有生命的物体。根据专利法第二十五条第一款第（四）项的规定，动物和植物品种不能被授予专利权。专利法所称的动物不包括人，所述动物是指不能自己合成，而只能靠摄取自然的碳水化合物及蛋白质来维系其生命的生物。专利法所称的植物品种，是指经过人工选育或者发现并经过改良，形态特征和生物学特性一致，遗传性状相对稳定的植物群体。动物和植物品种可以通过专利法以外的其他法律法规保护，例如，植物新品种可以通过《植物新品种保护条例》给予保护。
          根据专利法第二十五条第二款的规定，对动物和植物品种的生产方法，可以授予专利权。但这里所说的生产方法是指非生物学的方法，不包括生产动物和植物主要是生物学的方法。
          一种方法是否属于“主要是生物学的方法”，取决于在该方法中人的技术介入程度。如果人的技术介入对该方法所要达到的目的或者效果起了主要的控制作用或者决定性作用，则这种方法不属于“主要是生物学的方法”。例如，采用辐照饲养法生产高产牛奶的乳牛的方法；改进饲养方法生产瘦肉型猪的方法等属于可被授予发明专利权的客体。
          所谓微生物发明是指利用各种细菌、真菌、病毒等微生物去生产一种化学物质（如抗生素）或者分解一种物质等的发明。微生物和微生物方法可以获得专利保护。关于微生物发明专利申请的审查，适用本部分第十章的有关规定。
        sourceDoc: '《专利审查指南》2026 年修订版（2026-01-01 施行）——2025-11-13 国家知识产权局令第84号《专利审查指南》修改对照表（第二部分第一章4.4，按新栏增删标记转录）'
        verifiedOn: 2026-10-17

      - path: 第四部分第三章2.1
        topics: [一事不再理]
        text: |-
          对已作出审查决定的无效宣告案件涉及的专利权，以相同或者实质相同的理由和证据再次提出无效宣告请求的，不予受理和审理。
          如果再次提出的无效宣告请求的理由（简称无效宣告理由）或者证据因时限等原因未被在先的无效宣告请求审查决定所考虑，则该请求不属于上述不予受理和审理的情形。
        sourceDoc: '《专利审查指南》2026 年修订版（2026-01-01 施行）——2025-11-13 国家知识产权局令第84号《专利审查指南》修改对照表（第四部分第三章2.1，按新栏增删标记转录）'
        verifiedOn: 2026-10-17

      - path: 第四部分第三章3.3
        topics: [无效宣告, 审查范围, 理由, 证据]
        text: |-
          （1）无效宣告请求书中应当明确无效宣告请求范围，未明确的，复审和无效审理部应当通知请求人在指定期限内补正；期满未补正的，无效宣告请求视为未提出。
          （2）无效宣告理由仅限于专利法实施细则第六十九条第二款规定的理由，并且应当以专利法及其实施细则中有关的条、款、项作为独立的理由提出。无效宣告理由不属于专利法实施细则第六十九条第二款规定的理由的，不予受理。
          （3）在复审和无效审理部就一项专利权已作出无效宣告请求审查决定后，又以相同或者实质相同的理由和证据提出无效宣告请求的，不予受理，但所述理由或者证据因时限等原因未被所述决定考虑的情形除外。
          （4）以授予专利权的外观设计与他人在申请日以前已经取得的合法权利相冲突为理由请求宣告外观设计专利权无效，但是未提交证明权利冲突的证据的，不予受理。
          （5）请求人应当具体说明无效宣告理由，提交有证据的，应当结合提交的所有证据具体说明。对于发明或者实用新型专利需要进行技术方案对比的，应当具体描述涉案专利和对比文件中相关的技术方案，并进行比较分析；对于外观设计专利需要进行对比的，应当具体描述涉案专利和对比文件中相关的图片或者照片表示的产品外观设计，并进行比较分析。例如，请求人针对专利法第二十二条第三款的无效宣告理由提交多篇对比文件的，应当指明与请求宣告无效的专利最接近的对比文件以及单独对比还是结合对比的对比方式，具体描述涉案专利和对比文件的技术方案，并进行比较分析。如果是结合对比，存在两种或者两种以上结合方式的，应当首先将最主要的结合方式进行比较分析。未明确最主要结合方式的，则默认第一组对比文件的结合方式为最主要结合方式。对于不同的独立权利要求，可以分别指明最接近的对比文件。
          请求人未具体说明无效宣告理由的，或者提交有证据但未结合提交的所有证据具体说明无效宣告理由的，或者未指明每项理由所依据的证据的，其无效宣告请求不予受理。
        sourceDoc: '《专利审查指南》2026 年修订版（2026-01-01 施行）——2025-11-13 国家知识产权局令第84号《专利审查指南》修改对照表（第四部分第三章3.3，按新栏增删标记转录）'
        verifiedOn: 2026-10-17

sections:
