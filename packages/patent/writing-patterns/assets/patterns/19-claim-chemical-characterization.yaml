id: "wp-claim-chemical-characterization"
name: "化合物与高分子表征——四选一优先化学名与化学式"
category: "claim_drafting"
summary: "化合物先用 IUPAC 化学名与结构式表征，参数或制备方法只在无法用前两者时兜底；高分子还要写重复单元、分子量与分子量分布，禁用商标、代号与相对词。"
context: "适用于化合物、中间体与高分子产品权利要求的撰写与定稿。"
keywords: ["化学", "化合物", "高分子", "表征", "分子量", "Markush"]
source_ref: "专利法第26条第4款；审查指南第二部分第十章"
quality: 0.9
version: 1
steps:
  - order: 1
    name: "按优先级选表征方式"
    instruction: "已知结构优先写 IUPAC 化学名与结构式；结构未知或复杂时才用熔点、IR、NMR、UV、元素分析、比旋光度等物理化学参数；前三种都无法表征时才用「可由方法 Y 获得的化合物 X」。"
  - order: 2
    name: "补结构与性能参数"
    instruction: "参数表征的化合物要给出测量方法与条件，并证明该参数能与现有技术区别；用制备方法定义产品时，说明该方法赋予产品的特定性能。"
  - order: 3
    name: "高分子写重复单元与分子量"
    instruction: "写清重复单元与聚合度范围，给出数均/重均分子量与分子量分布；范围限定要有端点与代表点实施例，催化剂体系与聚合条件要能重复。"
  - order: 4
    name: "清理禁用表征"
    instruction: "删除商标、商品名、试验代号、行业行话、非化学名的外文，以及厚、薄、高温、高压、很宽、优选、约等无基准的相对词。"
examples:
  - context: "化合物产品权要"
    text: "一种式（I）所示的化合物，其中 R1 选自氢、C1–C6 烷基；所述化合物的 1H NMR 数据与熔点范围见说明书表 1，测量条件为 25 ℃、CDCl3。"
dos:
  - rule: "每种表征方式都给出可复现的测量方法或制备条件"
  - rule: "高分子同时写重复单元、分子量与分子量分布"
donts:
  - rule: "不要用商品名或试验代号代替化学名称"
  - rule: "不要用「高温」「很宽」等没有基准的相对词限定参数"
