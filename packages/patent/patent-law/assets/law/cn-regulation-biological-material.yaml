  - article: 1
    topics: [为了规范用于专利程序的生物材料的保藏和提供样品的]
    text: '为了规范用于专利程序的生物材料的保藏和提供样品的程序,根据《中华人⺠共和国专利法》和《中华人⺠共和国专利法实施细则》(以下简称专利法实施细则),制定本办法。'
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 2
    topics: [生物材料保藏单位负责保藏用于专利程序的生物材料以]
    text: '生物材料保藏单位负责保藏用于专利程序的生物材料以及向有权获得样品的单位或者个人提供所保藏的生物材料样品。'
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 3
    topics: [在中国没有经常居所或者营业所的外国人、外国企业或]
    text: '在中国没有经常居所或者营业所的外国人、外国企业或者外国其他组织根据本办法办理相关事务的,应当委托依法设立的专利代理机构办理。'
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 4
    topics: [专利申请人依照专利法实施细则第二十四条提交生物材]
    text: |-
      专利申请人依照专利法实施细则第二十四条提交生物材料保藏时,应当向保藏单位提交该生物材料,并附具保藏请求书写明下列事项:
      (一) 请求保藏的生物材料是用于专利程序的目的,并保证在本办法第九条规定的保藏期间内不撤回该保藏;
      (二) 专利申请人的姓名或者名称和地址;
      (三) 详细叙述该生物材料的培养、保藏和进行存活性检验所需的条件;保藏两种以上生物材料的混合培养物时,应当说明其组分以及至少一种能检查各个组分存在的方法;
      (四) 专利申请人给予该生物材料的识别符号,以及对该生物材料的分类命名或者科学描述;
      (五) 写明生物材料具有或者可能具有危及健康或者环境的特性,或者写明专利申请人不知道该生物材料具有此种特性。
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 5
    topics: [保藏单位对请求保藏的生物材料的生物特性不承担复核]
    text: '保藏单位对请求保藏的生物材料的生物特性不承担复核的义务。专利申请人要求对该生物材料的生物特性和分类命名进行复核检验的,应当在提交保藏生物材料时与保藏单位另行签订合同。'
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 6
    topics: ['保藏单位收到生物材料和保藏请求书后,应当向专利申']
    text: |-
      保藏单位收到生物材料和保藏请求书后,应当向专利申请人出具经保藏单位盖章和负责人签字的书面保藏证明。保藏证明应当包括下列各项:
      (一) 保藏单位的名称和地址;
      (二) 专利申请人的姓名或者名称和地址;
      (三) 收到生物材料的日期;
      (四) 专利申请人给予该生物材料的识别符号,以及对该生物材料的分类命名或者科学描述;
      (五) 保藏单位给予的保藏编号。
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 7
    topics: ['有下列情形之一的,保藏单位对生物材料不予保藏,并']
    text: |-
      有下列情形之一的,保藏单位对生物材料不予保藏,并应当通知专利申请人:
      (一)该生物材料不属于保藏单位接受保藏的生物材料种类;
      (二)该生物材料的性质特殊,保藏单位的技术条件无法进行保藏;
      (三)保藏单位在收到保藏请求时,有其他理由无法接受该生物材料。
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 8
    topics: [保藏单位收到生物材料以及保藏请求后应当及时进行存]
    text: |-
      保藏单位收到生物材料以及保藏请求后应当及时进行存活性检验,并向专利申请人出具经保藏单位盖章和负责人签字的书面存活证明。存活证明应当记载该生物材料是否存活,并应当包括下列各项:
      (一)保藏单位的名称和地址;
      (二)专利申请人的姓名或者名称和地址;
      (三)收到生物材料的日期;
      (四)保藏单位给予的保藏编号;
      (五)存活性检验的日期。
      在保藏期间内,应专利申请人或者专利权人随时提出的请求,保藏单位应当对该生物材料进行存活性检验并向其出具经保藏单位盖章和负责人签字的书面存活证明。
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 9
    topics: ['用于专利程序的生物材料的保藏期限至少30年,自保']
    text: '用于专利程序的生物材料的保藏期限至少30年,自保藏单位收到生物材料之日起计算。保藏单位在保藏期限届满前收到提供生物材料样品请求的,自请求日起至少应当再保藏5年。在保藏期间内,保藏单位应当采取一切必要的措施保持其保藏的生物材料存活和不受污染。'
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 10
    topics: ['涉及保藏的生物材料的专利申请公布前,保藏单位对其']
    text: '涉及保藏的生物材料的专利申请公布前,保藏单位对其保藏的生物材料以及相关信息负有保密责任,不得向任何第三方提供该生物材料的样品和信息。'
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 11
    topics: ['生物材料在保藏期间内发生死亡或者污染等情况的,保']
    text: '生物材料在保藏期间内发生死亡或者污染等情况的,保藏单位应当及时通知专利申请人或者专利权人。专利申请人或者专利权人在收到上述通知之日起4个月内重新提交与原保藏的生物材料相同的生物材料的,保藏单位予以继续保藏。'
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 12
    topics: ['在保藏期间内,应保藏生物材料的专利申请人或者专利']
    text: |-
      在保藏期间内,应保藏生物材料的专利申请人或者专利权人或者经其允许的任何单位或者个人的请求,保藏单位应当向其提供该生物材料的样品。
      专利申请权或者专利权发生转让的,请求提供生物材料样品的权利以及允许他人获得生物材料样品的权利一并转让。
      专利申请权或者专利权发生转让的,受让人应当及时通知保藏单位该专利申请权或者专利权的转让情况。
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 13
    topics: [《国际承认用于专利程序的微生物保藏布达佩斯条约》]
    text: '《国际承认用于专利程序的微生物保藏布达佩斯条约》缔约方专利局正在审查的专利申请或者已经授予的专利权涉及保藏单位所保藏的生物材料,该专利局为其专利程序的目的要求保藏单位提供该生物材料样品的,保藏单位应当向其提供。'
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 14
    topics: [国家知识产权局收到请求人依照专利法实施细则第二十]
    text: |-
      国家知识产权局收到请求人依照专利法实施细则第二十五条提出的请求后,应当核实下列事项:
      (一)涉及该保藏生物材料的专利申请已经向国家知识产权局提交,并且该申请的主题包括该生物材料或者其利用;
      (二)所述专利申请已经公布或者授权;
      (三)请求人已经按照专利法实施细则第二十五条的规定作出保证。
      国家知识产权局应当将该请求和有关文件的副本转送专利申请人或者专利权人,要求其在指定期限内就是否同意向请求人提供样品提出意⻅。专利申请人或者专利权人不同意向请求人提供样品的,应当说明理由并提交必要的证据;逾期不提出意⻅的,视为同意向请求人提供样品。
      国家知识产权局应当综合考虑核实的情况以及专利申请人或者专利权人提出的意⻅,确定是否向请求人出具其有权获得生物材料样品的证明。
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 15
    topics: ['除本办法第十二条和第十三条规定的情形外,请求提供']
    text: '除本办法第十二条和第十三条规定的情形外,请求提供生物材料样品的单位或者个人向保藏单位提交提供样品请求书以及国家知识产权局根据本办法第十四条所出具的证明的,保藏单位应当向其提供生物材料样品。'
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 16
    topics: ['保藏单位依照本办法提供生物材料样品,获得生物材料']
    text: '保藏单位依照本办法提供生物材料样品,获得生物材料样品的人使用生物材料样品的,还应当遵守国家有关生物安全、出入境管理等法律法规的规定。'
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 17
    topics: [保藏单位依照本办法向专利申请人或者专利权人之外的]
    text: '保藏单位依照本办法向专利申请人或者专利权人之外的其他单位或者个人提供生物材料样品的,应当及时通知专利申请人或者专利权人。'
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 18
    topics: ['自本办法第九条规定的保藏期限届满之日起1年内,专']
    text: '自本办法第九条规定的保藏期限届满之日起1年内,专利申请人或者专利权人可以取回所保藏的生物材料或者与保藏单位协商处置该生物材料。专利申请人或者专利权人在该期限内不取回也不进行处置的,保藏单位有权处置该生物材料。'
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 19
    topics: [保藏单位确定的接受保藏的生物材料种类以及收费标准]
    text: '保藏单位确定的接受保藏的生物材料种类以及收费标准应当予以公布,并报国家知识产权局备案。'
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 20
    topics: [本办法自2015年3月1日起施行]
    text: '本办法自2015年3月1日起施行。1985年3月12日中华人⺠共和国专利局公告第八号发布的《中国微生物菌种保藏管理委员会普通微生物中心用于专利程序的微生物保藏办法》和《中国典型培养物中心用于专利程序的微生物保藏办法》同时废止。'
    sourceDoc: '用于专利程序的生物材料保藏办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14
