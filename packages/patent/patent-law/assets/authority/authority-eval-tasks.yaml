# 权威性评测任务 — 阶段 4 的三十个基准。
#
# 六类案型各五个。每个任务写明应当引用的条文，以及不得成立的错误口径。
# 计分不调用模型：patent-law 的引用交给 verifyCitation，民事诉讼法交给
# legal-law 的 verifyLegalCitation，位阶按 authority-ranks.yaml 的顺序取先。
# 阶段 0 没有这套任务，已知引用错误按计划记为 5 处。
version: "1.0"
verifiedOn: "2026-11-14"
phase0:
  goldenTasks: 0
  knownCitationErrors: 5

tasks:
  - id: drafting-01
    caseType: drafting
    title: 说明书应当清楚完整
    answer: "说明书应当对发明或者实用新型作出清楚、完整的说明，以所属技术领域的技术人员能够实现为准（专利法第26条第3款）。"
    forbidden:
      - 说明书可以省略实施方式
    probes:
      - raw: 专利法第26条第3款
        article: 26
        paragraph: 3
        proposition: 说明书应当对发明或者实用新型作出清楚、完整的说明
        role: required
        expect: valid

  - id: drafting-02
    caseType: drafting
    title: 权利要求应当以说明书为依据
    answer: "权利要求书应当以说明书为依据，清楚、简要地限定要求专利保护的范围（专利法第26条第4款）。"
    forbidden:
      - 权利要求可以超出说明书记载的范围
    probes:
      - raw: 专利法第26条第4款
        article: 26
        paragraph: 4
        proposition: 权利要求书应当以说明书为依据
        role: required
        expect: valid

  - id: drafting-03
    caseType: drafting
    title: 修改不得超出原申请记载的范围
    answer: "对发明和实用新型专利申请文件的修改不得超出原说明书和权利要求书记载的范围（专利法第33条）。"
    forbidden:
      - 修改可以加入原说明书没有记载的技术方案
    probes:
      - raw: 专利法第33条
        article: 33
        proposition: 对发明和实用新型专利申请文件的修改不得超出原说明书和权利要求书记载的范围
        role: required
        expect: valid

  - id: drafting-04
    caseType: drafting
    title: 清楚完整并不允许省略实施方式
    answer: "清楚、完整的说明要求见专利法第26条第3款，该款没有允许不写实施方式。"
    forbidden:
      - 说明书可以省略实施方式
    probes:
      - raw: 专利法第26条第3款
        article: 26
        paragraph: 3
        proposition: 说明书应当对发明或者实用新型作出清楚、完整的说明
        role: required
        expect: valid
      - raw: 专利法第26条第3款
        article: 26
        paragraph: 3
        proposition: 说明书可以省略实施方式
        role: refusal
        expect: mismatch

  - id: drafting-05
    caseType: drafting
    title: 撰写口径冲突时以专利法为准
    answer: "说明书的清楚完整要求见专利法第26条第3款。请求书中发明人的填写口径见专利审查指南第一部分第一章4.1.2。两处不一致时以专利法为准。"
    forbidden:
      - 审查指南可以改变专利法第26条的要求
    probes:
      - raw: 专利法第26条第3款
        article: 26
        paragraph: 3
        proposition: 说明书应当对发明或者实用新型作出清楚、完整的说明
        role: required
        expect: valid
    rank:
      rule: guideline-never-overrides-statute
      expectWinner: patent-law
      claims:
        - raw: 专利法第26条第3款
          article: 26
          paragraph: 3
          proposition: 说明书应当对发明或者实用新型作出清楚、完整的说明
        - raw: 专利审查指南第一部分第一章4.1.2
          path: 第一部分第一章4.1.2
          proposition: 发明人是指对发明创造的实质性特点作出创造性贡献的人

  - id: prosecution-01
    caseType: prosecution-response
    title: 答复新颖性使用专利法第22条第2款
    answer: "新颖性是指该发明或者实用新型不属于现有技术（专利法第22条第2款）。"
    forbidden:
      - 本国公开才破坏新颖性
    probes:
      - raw: 专利法第22条第2款
        article: 22
        paragraph: 2
        proposition: 新颖性，是指该发明或者实用新型不属于现有技术
        role: required
        expect: valid

  - id: prosecution-02
    caseType: prosecution-response
    title: 答复创造性使用专利法第22条第3款
    answer: "发明的创造性是指与现有技术相比具有突出的实质性特点和显著的进步（专利法第22条第3款）。"
    forbidden:
      - 实用新型也必须具有突出的实质性特点
    probes:
      - raw: 专利法第22条第3款
        article: 22
        paragraph: 3
        proposition: 该发明具有突出的实质性特点和显著的进步
        role: required
        expect: valid

  - id: prosecution-03
    caseType: prosecution-response
    title: 答复中的修改仍受专利法第33条约束
    answer: "审查意见答复中对发明专利申请文件的修改不得超出原说明书和权利要求书记载的范围（专利法第33条）。期限开始的当日不计算在期限内（专利法实施细则第5条）。"
    forbidden:
      - 答复修改不受原说明书范围约束
    probes:
      - raw: 专利法第33条
        article: 33
        proposition: 对发明和实用新型专利申请文件的修改不得超出原说明书和权利要求书记载的范围
        role: required
        expect: valid
      - raw: 专利法实施细则第5条
        article: 5
        proposition: 期限开始的当日不计算在期限内
        role: required
        expect: valid

  - id: prosecution-04
    caseType: prosecution-response
    title: 细则第7条不是送达期限
    answer: "邮寄送达自文件发出之日起满15日推定收到，依据是专利法实施细则第4条第4款。专利法实施细则第7条只规定涉及国防利益需要保密的申请，不产生送达日。"
    forbidden:
      - 细则第7条规定送达期限
    probes:
      - raw: 专利法实施细则第4条第4款
        article: 4
        paragraph: 4
        proposition: 自文件发出之日起满15日，推定为当事人收到文件之日
        role: required
        expect: valid
      - raw: 专利法实施细则第7条
        article: 7
        proposition: 专利申请涉及国防利益需要保密的
        role: required
        expect: valid
      - raw: 专利法实施细则第7条
        article: 7
        proposition: 自文件发出之日起满15日
        role: refusal
        expect: mismatch

  - id: prosecution-05
    caseType: prosecution-response
    title: 答复口径冲突时以专利法为准
    answer: "新颖性的法定含义见专利法第22条第2款。发明人填写口径见专利审查指南第一部分第一章4.1.2。两处不一致时以专利法为准。"
    forbidden:
      - 审查指南可以改写新颖性的法定含义
    probes:
      - raw: 专利法第22条第2款
        article: 22
        paragraph: 2
        proposition: 新颖性，是指该发明或者实用新型不属于现有技术
        role: required
        expect: valid
    rank:
      rule: guideline-never-overrides-statute
      expectWinner: patent-law
      claims:
        - raw: 专利法第22条第2款
          article: 22
          paragraph: 2
          proposition: 新颖性，是指该发明或者实用新型不属于现有技术
        - raw: 专利审查指南第一部分第一章4.1.2
          path: 第一部分第一章4.1.2
          proposition: 发明人是指对发明创造的实质性特点作出创造性贡献的人

  - id: reexamination-01
    caseType: reexamination
    title: 复审请求期限是三个月
    answer: "专利申请人对驳回申请的决定不服的，可以自收到通知之日起三个月内请求复审（专利法第41条第1款）。"
    forbidden:
      - 复审请求期限是十五日
    probes:
      - raw: 专利法第41条第1款
        article: 41
        paragraph: 1
        proposition: 可以自收到通知之日起三个月内向国务院专利行政部门请求复审
        role: required
        expect: valid

  - id: reexamination-02
    caseType: reexamination
    title: 复审应当提交复审请求书
    answer: "依照专利法第41条请求复审的，应当提交复审请求书，说明理由（专利法实施细则第65条第1款）。"
    forbidden:
      - 复审可以只交意见陈述不交请求书
    probes:
      - raw: 专利法实施细则第65条第1款
        article: 65
        paragraph: 1
        proposition: 应当提交复审请求书，说明理由
        role: required
        expect: valid

  - id: reexamination-03
    caseType: reexamination
    title: 对复审决定不服可以向法院起诉
    answer: "专利申请人对复审决定不服的，可以自收到通知之日起三个月内向人民法院起诉（专利法第41条第2款）。"
    forbidden:
      - 复审决定不能向法院起诉
    probes:
      - raw: 专利法第41条第2款
        article: 41
        paragraph: 2
        proposition: 可以自收到通知之日起三个月内向人民法院起诉
        role: required
        expect: valid

  - id: reexamination-04
    caseType: reexamination
    title: 细则第41条是撤回而不是复审
    answer: "申请人撤回专利申请的，应当提出声明（专利法实施细则第41条）。复审请求的依据是专利法第41条第1款，不是细则第41条。"
    forbidden:
      - 细则第41条规定复审
    probes:
      - raw: 专利法实施细则第41条
        article: 41
        proposition: 申请人撤回专利申请的
        role: required
        expect: valid
      - raw: 专利法实施细则第41条
        article: 41
        proposition: 可以请求专利复审委员会复审
        role: refusal
        expect: mismatch

  - id: reexamination-05
    caseType: reexamination
    title: 复审口径冲突时以专利法为准
    answer: "复审请求期限见专利法第41条第1款。发明人填写口径见专利审查指南第一部分第一章4.1.2。两处不一致时以专利法为准。"
    forbidden:
      - 审查指南可以改写三个月的复审期限
    probes:
      - raw: 专利法第41条第1款
        article: 41
        paragraph: 1
        proposition: 可以自收到通知之日起三个月内向国务院专利行政部门请求复审
        role: required
        expect: valid
    rank:
      rule: guideline-never-overrides-statute
      expectWinner: patent-law
      claims:
        - raw: 专利法第41条第1款
          article: 41
          paragraph: 1
          proposition: 可以自收到通知之日起三个月内向国务院专利行政部门请求复审
        - raw: 专利审查指南第一部分第一章4.1.2
          path: 第一部分第一章4.1.2
          proposition: 发明人是指对发明创造的实质性特点作出创造性贡献的人

  - id: invalidation-01
    caseType: invalidation
    title: 授权公告后可以请求宣告无效
    answer: "自公告授予专利权之日起，任何单位或者个人认为授予不符合规定的，可以请求宣告该专利权无效（专利法第45条）。"
    forbidden:
      - 专利权授予后不能请求无效
    probes:
      - raw: 专利法第45条
        article: 45
        proposition: 可以请求国务院专利行政部门宣告该专利权无效
        role: required
        expect: valid

  - id: invalidation-02
    caseType: invalidation
    title: 无效请求应当提交请求书和证据
    answer: "请求宣告专利权无效的，应当提交专利权无效宣告请求书和必要的证据（专利法实施细则第69条第1款）。"
    forbidden:
      - 无效请求不必说明理由
    probes:
      - raw: 专利法实施细则第69条第1款
        article: 69
        paragraph: 1
        proposition: 应当向国务院专利行政部门提交专利权无效宣告请求书
        role: required
        expect: valid

  - id: invalidation-03
    caseType: invalidation
    title: 无效可以依据新颖性
    answer: "无效理由可以包括授予专利权的发明不具备新颖性（专利法第22条第2款）。一件发明专利申请应当限于一项发明（专利法第31条第1款）。"
    forbidden:
      - 新颖性不能作为无效理由
    probes:
      - raw: 专利法第22条第2款
        article: 22
        paragraph: 2
        proposition: 新颖性，是指该发明或者实用新型不属于现有技术
        role: required
        expect: valid
      - raw: 专利法第31条第1款
        article: 31
        paragraph: 1
        proposition: 一件发明或者实用新型专利申请应当限于一项发明或者实用新型
        role: required
        expect: valid

  - id: invalidation-04
    caseType: invalidation
    title: 不存在的条号必须拒答
    answer: "发明专利权的期限为二十年，依据是专利法第42条第1款。超出现行专利法条数的条号不能用来说明这个期限。"
    forbidden:
      - 专利法第99条规定发明专利权的期限为二十年
    probes:
      - raw: 专利法第42条第1款
        article: 42
        paragraph: 1
        proposition: 发明专利权的期限为二十年
        role: required
        expect: valid
      - raw: 专利法第99条
        article: 99
        proposition: 发明专利权的期限为二十年
        role: refusal
        expect: out-of-range

  - id: invalidation-05
    caseType: invalidation
    title: 无效口径冲突时以专利法为准
    answer: "请求宣告无效的依据见专利法第45条。发明人填写口径见专利审查指南第一部分第一章4.1.2。两处不一致时以专利法为准。"
    forbidden:
      - 审查指南可以取消无效请求
    probes:
      - raw: 专利法第45条
        article: 45
        proposition: 可以请求国务院专利行政部门宣告该专利权无效
        role: required
        expect: valid
    rank:
      rule: guideline-never-overrides-statute
      expectWinner: patent-law
      claims:
        - raw: 专利法第45条
          article: 45
          proposition: 可以请求国务院专利行政部门宣告该专利权无效
        - raw: 专利审查指南第一部分第一章4.1.2
          path: 第一部分第一章4.1.2
          proposition: 发明人是指对发明创造的实质性特点作出创造性贡献的人

  - id: infringement-01
    caseType: infringement
    title: 保护范围以权利要求为准
    answer: "发明或者实用新型专利权的保护范围以其权利要求的内容为准（专利法第64条第1款）。"
    forbidden:
      - 专利法第59条
    probes:
      - raw: 专利法第64条第1款
        article: 64
        paragraph: 1
        proposition: 发明或者实用新型专利权的保护范围以其权利要求的内容为准
        role: required
        expect: valid
      - raw: 专利法第59条
        article: 59
        proposition: 保护范围以其权利要求的内容为准
        role: refusal
        expect: mismatch

  - id: infringement-02
    caseType: infringement
    title: 全面覆盖包括相同或者等同的技术特征
    answer: "被诉侵权技术方案包含与权利要求记载的全部技术特征相同或者等同的技术特征的，落入保护范围（最高人民法院关于审理侵犯专利权纠纷案件应用法律若干问题的解释第7条第2款）。"
    forbidden:
      - 等同特征一律不落入保护范围
    probes:
      - raw: 最高人民法院关于审理侵犯专利权纠纷案件应用法律若干问题的解释第7条第2款
        article: 7
        paragraph: 2
        proposition: 被诉侵权技术方案包含与权利要求记载的全部技术特征相同或者等同的技术特征的
        role: required
        expect: valid

  - id: infringement-03
    caseType: infringement
    title: 授权程序中放弃的技术方案不能再纳入保护范围
    answer: "专利申请人在授权或者无效程序中放弃的技术方案，不能再纳入保护范围（最高人民法院关于审理侵犯专利权纠纷案件应用法律若干问题的解释第6条）。现有技术抗辩见专利法第67条。"
    forbidden:
      - 已经放弃的技术方案仍然可以主张保护
    probes:
      - raw: 最高人民法院关于审理侵犯专利权纠纷案件应用法律若干问题的解释第6条
        article: 6
        proposition: 通过对权利要求、说明书的修改或者意见陈述而放弃的技术方案
        role: required
        expect: valid
      - raw: 专利法第67条
        article: 67
        proposition: 属于现有技术或者现有设计的，不构成侵犯专利权
        role: required
        expect: valid

  - id: infringement-04
    caseType: infringement
    title: 证据种类用民事诉讼法第66条
    answer: "法定证据种类见民事诉讼法第66条，开头即写明证据包括当事人的陈述、书证和物证。2017年编号的第63条不再是该规定。"
    forbidden:
