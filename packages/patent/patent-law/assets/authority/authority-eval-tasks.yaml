        article: 64
        paragraph: 1
        proposition: 发明或者实用新型专利权的保护范围以其权利要求的内容为准
        role: required
        expect: valid
    rank:
      rule: guideline-never-overrides-statute
      expectWinner: patent-law
      claims:
        - raw: 专利法第64条第1款
          article: 64
          paragraph: 1
          proposition: 发明或者实用新型专利权的保护范围以其权利要求的内容为准
        - raw: 专利审查指南第一部分第一章4.1.2
          path: 第一部分第一章4.1.2
          proposition: 发明人是指对发明创造的实质性特点作出创造性贡献的人

  - id: search-01
    caseType: search-analysis
    title: 检索判断新颖性
    answer: "新颖性是指该发明或者实用新型不属于现有技术，也没有抵触申请（专利法第22条第2款）。"
    forbidden:
      - 申请日以后公开的技术破坏新颖性
    probes:
      - raw: 专利法第22条第2款
        article: 22
        paragraph: 2
        proposition: 新颖性，是指该发明或者实用新型不属于现有技术
        role: required
        expect: valid

  - id: search-02
    caseType: search-analysis
    title: 检索判断创造性
    answer: "发明的创造性要求突出的实质性特点和显著的进步（专利法第22条第3款）。"
    forbidden:
      - 创造性只比较本国公开的技术
    probes:
      - raw: 专利法第22条第3款
        article: 22
        paragraph: 3
        proposition: 该发明具有突出的实质性特点和显著的进步
        role: required
        expect: valid

  - id: search-03
