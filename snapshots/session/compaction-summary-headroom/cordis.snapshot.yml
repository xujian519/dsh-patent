# The summary output cap inherits the 1,565-token headroom. A 1,000-token
# request output reservation lowers the proactive trigger to 6,017 tokens —
# midway between this tree's history (6,151) and its condensed replacement
# (5,883); the headroom is recalibrated for this tree's tool-schema budget,
# as compaction-output-reserve records.


- id: agent-instructions
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    headroomTokens: 1565
    retainTokens: 20

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 8622
                defaultMaxTokens: 1000
    - id: compaction-working-directory
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/compaction-working-directory.ts'

# Fixed-budget compaction scenario: keep the recorded tool set, whose token counts the thresholds were tuned to.
- id: tool-fs
  config:
    applyPatch: false
