  - path: 第二部分第四章3.2.1.1
    topics: [最接近的现有技术, 区别特征, 技术启示, 三步法]
    text: |-
      判断要求保护的发明相对于现有技术是否显而易见，通常可按照以下三个步骤进行。
      （1）确定最接近的现有技术
      最接近的现有技术，是指现有技术中与要求保护的发明最密切相关的一个技术方案，它是判断发明是否具有突出的实质性特点的基础。最接近的现有技术，例如可以是，与要求保护的发明技术领域相同，所要解决的技术问题、技术效果或者用途最接近和／或公开了发明的技术特征最多的现有技术，或者虽然与要求保护的发明技术领域不同，但能够实现发明的功能，并且公开发明的技术特征最多的现有技术。应当注意的是，在确定最接近的现有技术时，应首先考虑技术领域相同或者相近的现有技术，其中，要优先考虑与发明要解决的技术问题相关联的现有技术。
      （2）确定发明的区别特征和发明实际解决的技术问题
      在审查中应当客观分析并确定发明实际解决的技术问题。为此，首先应当分析要求保护的发明与最接近的现有技术相比有哪些区别特征，然后根据该区别特征在要求保护的发明中所能达到的技术效果确定发明实际解决的技术问题。从这个意义上说，发明实际解决的技术问题，是指为获得更好的技术效果而需对最接近的现有技术进行改进的技术任务。
      审查过程中，由于审查员所认定的最接近的现有技术可能不同于申请人在说明书中所描述的现有技术，因此，基于最接近的现有技术重新确定的该发明实际解决的技术问题，可能不同于说明书中所描述的技术问题；在这种情况下，应当根据审查员所认定的最接近的现有技术重新确定发明实际解决的技术问题。
      重新确定的技术问题可能要依据每项发明的具体情况而定。作为一个原则，发明的任何技术效果都可以作为重新确定技术问题的基础，只要本领域的技术人员从该申请说明书中所记载的内容能够得知该技术效果即可。对于功能上彼此相互支持、存在相互作用关系的技术特征，应整体上考虑所述技术特征和它们之间的关系在要求保护的发明中所达到的技术效果。特殊情况下，当发明的所有技术效果与最接近的现有技术均相当时，重新确定的技术问题是提供一种不同于最接近的现有技术的可供选择的技术方案。
      重新确定的技术问题应当与区别特征在发明中所能达到的技术效果相匹配，不应当被确定为区别特征本身，也不应当包含对区别特征的指引或者暗示。
      【例如】
      要求保护的发明是一种消费电子设备，包括对用户进行账户授权的生物认证单元，该认证单元基于指纹和选自掌纹、虹膜、眼底、面部特征中的至少一种认证方式的组合。说明书记载，通过至少两种认证可以使用户账户更加安全。最接近的现有技术公开了一种消费电子设备，仅基于指纹信息进行身份认证。两者的区别在于发明通过至少两种生物特征进行身份认证，根据该区别特征在要求保护的发明中所能达到的技术效果，可以确定发明实际解决的技术问题是如何提高消费电子设备的用户账户安全性。不能将发明实际解决的技术问题确定为“如何增加掌纹等至少一种生物认证方式”或者“如何通过增加认证方式实现消费电子设备的安全性”。
      （3）判断要求保护的发明对本领域的技术人员来说是否显而易见
      在该步骤中，要从最接近的现有技术和发明实际解决的技术问题出发，判断要求保护的发明对本领域的技术人员来说是否显而易见。判断过程中，要确定的是现有技术整体上是否存在某种技术启示，即现有技术中是否给出将上述区别特征应用到该最接近的现有技术以解决其存在的技术问题（即发明实际解决的技术问题）的启示，这种启示会使本领域的技术人员在面对所述技术问题时，有动机改进该最接近的现有技术并获得要求保护的发明。如果现有技术存在这种技术启示，则发明是显而易见的，不具有突出的实质性特点。
      下述情况，通常认为现有技术中存在上述技术启示：
      （i）所述区别特征为公知常识，例如，本领域中解决该重新确定的技术问题的惯用手段，或教科书或者技术词典、技术手册等工具书中披露的解决该重新确定的技术问题的技术手段。
      【例如】
      要求保护的发明是一种用铝制造的建筑构件，其要解决的技术问题是减轻建筑构件的重量。一份对比文件公开了相同的建筑构件，同时说明建筑构件是轻质材料，但未提及使用铝材。而在建筑标准中，已明确指出铝作为一种轻质材料，可作为建筑构件。该要求保护的发明明显应用了铝材轻质的公知性质。因此可认为现有技术中存在上述技术启示。
      （ii）所述区别特征为与最接近的现有技术相关的技术手段，例如，同一份对比文件其他部分披露的技术手段，该技术手段在该其他部分所起的作用与该区别特征在要求保护的发明中为解决该重新确定的技术问题所起的作用相同。
      【例如】
      要求保护的发明是一种氦气检漏装置，其包括：检测真空箱是否有整体泄漏的整体泄漏检测装置；对泄漏氦气进行回收的回收装置；和用于检测具体漏点的氦质谱检漏仪，所述氦质谱检漏仪包括有一个真空吸枪。
      对比文件1 的某一部分公开了一种全自动氦气检漏系统，该系统包括：检测真空箱是否有整体泄漏的整体泄漏检测装置和对泄漏的氦气进行回收的回收装置。该对比文件1 的另一部分公开了一种具有真空吸枪的氦气漏点检测装置，其中指明该漏点检测装置可以是检测具体漏点的氦质谱检漏仪，此处记载的氦质谱检漏仪与要求保护的发明中的氦质谱检漏仪的作用相同。根据对比文件1 中另一部分的教导，本领域的技术人员能容易地将对比文件1 中的两种技术方案结合成发明的技术方案。因此可认为现有技术中存在上述技术启示。
      （iii）所述区别特征为另一份对比文件中披露的相关技术手段，该技术手段在该对比文件中所起的作用与该区别特征在要求保护的发明中为解决该重新确定的技术问题所起的作用相同。
      【例如】
      要求保护的发明是设置有排水凹槽的石墨盘式制动器，所述凹槽用以排除为清洗制动器表面而使用的水。发明要解决的技术问题是如何清除制动器表面上因摩擦产生的妨碍制动的石墨屑。对比文件1 记载了一种石墨盘式制动器。对比文件2公开了在金属盘式制动器上设有用于冲洗其表面上附着的灰尘而使用的排水凹槽。
      要求保护的发明与对比文件1 的区别在于发明在石墨盘式制动器表面上设置了凹槽，而该区别特征已被对比文件2 所披露。由于对比文件1 所述的石墨盘式制动器会因为摩擦而在制动器表面产生磨屑，从而妨碍制动。对比文件2 所述的金属盘式制动器会因表面上附着灰尘而妨碍制动，为了解决妨碍制动的技术问题，前者必须清除磨屑，后者必须清除灰尘，这是性质相同的技术问题。为了解决石墨盘式制动器的制动问题，本领域的技术人员按照对比文件2 的启示，容易想到用水冲洗，从而在石墨盘式制动器上设置凹槽，把冲洗磨屑的水从凹槽中排出。由于对比文件2 中凹槽的作用与发明要求保护的技术方案中凹槽的作用相同，因此本领域的技术人员有动机将对比文件1 和对比文件2 相结合，从而得到发明所述的技术方案。因此可认为现有技术中存在上述技术启示。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
