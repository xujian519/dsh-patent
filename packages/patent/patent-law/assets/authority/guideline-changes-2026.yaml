  - path: 第二部分第一章4.4
    title: 动物和植物品种
    kind: amended
    oldColumnText: |-
      动物和植物是有生命的物体。根据专利法第二十五条第
      一款第（四）项的规定，动物和植物品种不能被授予专利权。
      专利法所称的动物不包括人，所述动物是指不能自己合成，
      而只能靠摄取自然的碳水化合物及蛋白质来维系其生命的生
      物。专利法所称的植物，是指可以借助光合作用，以水、二
      氧化碳和无机盐等无机物合成碳水化合物、蛋白质来维系生
      存，并通常不发生移动的生物。动物和植物品种可以通过专
      利法以外的其他法律法规保护，例如，植物新品种可以通过
      《植物新品种保护条例》给予保护。
    newColumnText: |-
      动物和植物是有生命的物体。根据专利法第二十五条第
      一款第（四）项的规定，动物和植物品种不能被授予专利权。
      专利法所称的动物不包括人，所述动物是指不能自己合成，
      而只能靠摄取自然的碳水化合物及蛋白质来维系其生命的生
      物。专利法所称的植物品种，是指经过人工选育或者发现并
      经过改良，形态特征和生物学特性一致，遗传性状相对稳定
      的植物群体
      。动物和植物品种可以通过专利法以外的其他法
      律法规保护，例如，植物新品种可以通过《植物新品种保护
      条例》给予保护。

  - path: 第二部分第三章6.2.2
    title: 对一件专利申请和一项专利权的处理
    kind: amended
    oldColumnText: |-
      但是，对于同一申请人同日（仅指申请日）对同样的
      发明创造既申请实用新型又申请发明专利的，在先获得的
      实用新型专利权尚未终止，并且申请人在申请时分别作出
      说明的，除通过修改发明专利申请外，还可以通过放弃实
      用新型专利权避免重复授权。因此，在对上述发明专利申
      请进行审查的过程中，如果该发明专利申请符合授予专利
      权的其他条件，应当通知申请人进行选择或者修改，申请
      人选择放弃已经授予的实用新型专利权的，应当在答复审
      查意见通知书时附交放弃实用新型专利权的书面声明。此
      时，对那件符合授权条件、尚未授权的发明专利申请，应
      当发出授权通知书，并将放弃上述实用新型专利权的书面
      声明转至有关审查部门，由专利局予以登记和公告，公告
      上注明上述实用新型专利权自公告授予发明专利权之日起
      终止。
    newColumnText: |-
      对于同一申请人同日（仅指申请日）对同样的
      发明创造既申请实用新型又申请发明专利的，根据专利法
      实施细则第四十七条的规定，应当在申请时分别说明对同
      样的发明创造已申请了另一专利；未作说明的，依照专利
      法第九条第一款关于同样的发明创造只能授予一项专利权
      的规定处理；作出说明的，发明专利申请经审查没有发现
      驳回理由，应当通知申请人在规定期限内声明放弃实用新
      型专利权。申请人声明放弃的，应当作出授予发明专利权
      的决定，并在公告授予发明专利权时一并公告申请人放弃
      实用新型专利权声明。申请人不同意放弃的，应当驳回该
      发明专利申请；申请人期满未答复的，视为撤回该发明专
      利申请。
      申请人放弃已经授予的实用新型专利权的，应当
      在答复审查意见通知书时附交放弃实用新型专利权的书面
      声明。此时，对那件符合授权条件、尚未授权的发明专利
      申请，应当发出授权通知书，并将放弃上述实用新型专利
      权的书面声明转至有关审查部门，由专利局予以登记和公
      告，公告上注明上述实用新型专利权自公告授予发明专利
      权之日起终止。

  - path: 第二部分第九章6.1
    title: 审查基准
    kind: amended
    oldColumnText: |-
      审查应当针对要求保护的解决方案，即权利要求所限定
      的解决方案进行。在审查中，不应当简单割裂技术特征与算
      法特征或商业规则和方法特征等，而应将权利要求记载的所
      有内容作为一个整体，对其中涉及的技术手段、解决的技术
      问题和获得的技术效果进行分析。
    newColumnText: |-
      审查应当针对要求保护的解决方案，即权利要求所限定
      的解决方案进行，必要时应当针对说明书的内容进行审查。
      在审查中，不应当简单割裂技术特征与算法特征或商业规则
      和方法特征等，而应将权利要求记载的所有内容作为一个整
      体，对其中涉及的技术手段、解决的技术问题和获得的技术
      效果进行分析。

  - path: 第二部分第九章6.2
    title: 审查示例
    kind: amended
    oldColumnText: |-
      以下，根据上述审查基准，给出包含算法特征或商业规
      则和方法特征的发明专利申请的审查示例。
      （1）属于专利法第二十五条第一款第（二）项范围之内
      的包含算法特征或商业规则和方法特征的发明专利申请，不属
      于专利保护的客体。
      【例1】
      一种建立数学模型的方法
      （2）为了解决技术问题而利用技术手段并获得技术效果
      的包含算法特征或商业规则和方法特征的发明专利申请，属
      于专利法第二条第二款规定的技术方案，因而属于专利保护
      的客体。
      【例2】
      一种卷积神经网络模型的训练方法
      【例3】
      一种共享单车的使用方法
      【例4】
      一种区块链节点间通信方法及装置
      【例5】
      一种深度神经网络模型的训练方法
      【例6】
      一种电子券使用倾向度的分析方法
      【例7】
      一种知识图谱推理方法
      （3）未解决技术问题，或者未利用技术手段，或者未获
      得技术效果的包含算法特征或商业规则和方法特征的发明专
      利申请，不属于专利法第二条第二款规定的技术方案，因而
      不属于专利保护的客体。
      【例8】
      一种消费返利的方法
      【例9】
      一种基于用电特征的经济景气指数分析方法
      【例10】
      一种金融产品的价格预测方法
      （4）在进行创造性审查时，应当考虑与技术特征在功能
      上彼此相互支持、存在相互作用关系的算法特征或商业规则
      和方法特征对技术方案作出的贡献。
      【例11】
      一种基于多传感器信息仿人机器人跌倒状态检测方法
      【例12】
      基于合作协同进化和多种群遗传算法的多机器人路径规
      划系统
      【例13】
      一种物流配送方法
      【例14】
      一种动态观点演变的可视化方法
      【例15】
      一种用于适配神经网络参数的方法
    newColumnText: |-
      以下，根据上述审查基准，给出包含算法特征或商业规
      则和方法特征的发明专利申请的审查示例。
      （1）包含算法特征或商业规则和方法特征的发明专利申
      请，如果违反了法律、社会公德或者妨害了公共利益，不能
      被授予专利权。
      【例1】
      一种基于大数据的商场内床垫销售辅助系统
      申请内容概述
      发明专利申请的解决方案是一种基于大数据的商场内床
      垫销售辅助系统，其通过摄像模块和人脸识别模块完成顾客
      面部特征信息的采集并得到顾客的身份识别信息，对收集到
      的信息进行数据分析，评估顾客对床垫的真实偏好，帮助商
      家精准营销。
      申请的权利要求
      一种基于大数据的商场内床垫销售辅助系统，包括床垫
      展示设备和管理中心，其特征在于：
      所述床垫展示设备包括控制模块和信息采集模块，用于
      展示和辅助销售床垫产品并收集顾客数据；所述控制模块用
      于与管理中心进行数据交互；所述信息采集模块包括摄像模
      块和人脸识别模块，用于采集顾客的面部特征信息，利用关
      键点检测算法调整面部姿态以获得归一化人脸图像，将归一
      化人脸图像通过人脸检测算法定位待识别的人脸区域，并结
      合主成分分析法提取人脸区域内的人脸特征，进而得到顾客
      的身份识别信息；
      所述管理中心包括管理服务器和分析辅助系统；所述管
      理服务器对多个床垫展示设备进行管理；所述分析辅助系统
      根据顾客的身份识别信息，利用床垫展示设备收集的数据分
      析得到顾客的真实偏好，并向管理中心反馈分析结果。
      分析及结论
      《中华人民共和国个人信息保护法》相关条款规定，在
      公共场所安装图像采集、个人身份识别设备，应当为维护公
      共安全所必需，遵守国家有关规定，并设置显著的提示标识。
      所收集的个人图像、身份识别信息只能用于维护公共安全的
      目的，不得用于其他目的；取得个人单独同意的除外。
      从该发明创造请求保护的解决方案可知，将图像采集和
      人脸识别手段用于商场等经营场所进行床垫的精准营销，不
      属于维护公共安全所必需。此外，为了获取和分析顾客对床
      垫的真实偏好，对顾客的面部信息进行采集并获取其身份识
      别信息显然是在顾客未察觉的情况下进行的，申请中也未表
      明数据获取或者信息采集合法、合规。因此，该发明创造与
      法律相违背，根据专利法第五条第一款的规定，不能被授予
      专利权。
      【例2】
      一种无人驾驶车辆应急决策模型的建立方法
      申请内容概述
      发明专利申请的解决方案是一种无人驾驶车辆应急决策
      模型的建立方法，以行人的性别和年龄作为障碍物数据，通
      过训练出的决策模型来确定无法避让障碍物情况下的被保护
      对象和被撞对象。
      申请的权利要求
      一种无人驾驶车辆应急决策模型的建立方法，其特征在
      于，包括：
      获取无人驾驶车辆的历史环境数据和历史障碍物数据，
      所述历史环境数据包括车辆的行驶速度、与所在车道上障碍
      物的距离、与相邻车道上障碍物的距离、所在车道上障碍物
      的运动速度和运动方向、相邻车道上障碍物的运动速度和运
      动方向；所述历史障碍物数据包括行人的性别和年龄；
      对所述历史环境数据和历史障碍物数据进行特征提取，
      作为决策模型的输入数据，将无法避让障碍物时车辆的历史
      行驶轨迹作为决策模型的输出数据，根据历史数据训练决策
      模型，所述决策模型为深度学习模型；
      获取实时环境数据和实时障碍物数据，当无人驾驶车辆
      遇到无法避让障碍物的情况时，利用训练后的决策模型确定
      无人驾驶车辆的行驶轨迹。
      分析及结论
      该发明创造涉及一种无人驾驶车辆应急决策模型的建立
      方法。人的生命具有同等的价值和尊严，无论其年龄和性别
      如何，无人驾驶车辆的应急决策模型在无法避让的事故中，
      如果基于行人的性别和年龄进行被保护对象和被撞对象的选
      择，这与公众对于生命面前人人平等的伦理道德观念相违背。
      此外，这种决策方式会强化社会中存在的性别和年龄偏见，
      还会引发公众对公共出行安全性的担忧，破坏公众对科技和
      社会秩序的信任。因此，该发明创造含有违反社会公德的内
      容，根据专利法第五条第一款的规定，不能被授予专利权。
      （2）属于专利法第二十五条第一款第（二）项范围
      之内的包含算法特征或商业规则和方法特征的发明专利申请，
      不属于专利保护的客体。
      【例3】
      一种建立数学模型的方法
      （3）为了解决技术问题而利用技术手段并获得技术
      效果的包含算法特征或商业规则和方法特征的发明专利申
      请，属于专利法第二条第二款规定的技术方案，因而属于专
      利保护的客体。
      【例4】
      一种卷积神经网络模型的训练方法
      【例5】
      一种共享单车的使用方法
      【例6】
      一种区块链节点间通信方法及装置
      【例7】
