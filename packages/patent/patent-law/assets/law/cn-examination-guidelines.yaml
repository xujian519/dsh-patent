  - path: 第二部分第一章4.3
    topics: [疾病的诊断和治疗]
    text: |-
      疾病的诊断和治疗方法，是指以有生命的人体或者动物体为直接实施对象，进行识别、确定或消除病因或病灶的过程。
      出于人道主义的考虑和社会伦理的原因，医生在诊断和治疗过程中应当有选择各种方法和条件的自由。另外，这类方法直接以有生命的人体或动物体为实施对象，无法在产业上利用，不属于专利法意义上的发明创造。因此疾病的诊断和治疗方法不能被授予专利权。
      但是，用于实施疾病诊断和治疗方法的仪器或装置，以及在疾病诊断和治疗方法中使用的物质或材料属于可被授予专利权的客体。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第一章4.4
    topics: [动物和植物品种]
    text: |-
      动物和植物是有生命的物体。根据专利法第二十五条第一款第（四）项的规定，动物和植物品种不能被授予专利权。专利法所称的动物不包括人，所述动物是指不能自己合成，而只能靠摄取自然的碳水化合物及蛋白质来维系其生命的生物。专利法所称的植物，是指可以借助光合作用，以水、二氧化碳和无机盐等无机物合成碳水化合物、蛋白质来维系生存，并通常不发生移动的生物。动物和植物品种可以通过专利法以外的其他法律法规保护，例如，植物新品种可以通过《植物新品种保护条例》给予保护。
      根据专利法第二十五条第二款的规定，对动物和植物品种的生产方法，可以授予专利权。但这里所说的生产方法是指非生物学的方法，不包括生产动物和植物主要是生物学的方法。
      一种方法是否属于“主要是生物学的方法”，取决于在该方法中人的技术介入程度。如果人的技术介入对该方法所要达到的目的或者效果起了主要的控制作用或者决定性作用，则这种方法不属于“主要是生物学的方法”。例如，采用辐照饲养法生产高产牛奶的乳牛的方法；改进饲养方法生产瘦肉型猪的方法等属于可被授予发明专利权的客体。
      所谓微生物发明是指利用各种细菌、真菌、病毒等微生物去生产一种化学物质（如抗生素）或者分解一种物质等的发明。微生物和微生物方法可以获得专利保护。关于微生物发明专利申请的审查，适用本部分第十章的有关规定。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）；该节已被 2026 年版《专利审查指南》（2026-01-01 施行）修改，本节文本是修改前文本'
    verifiedOn: 2026-11-08

  - path: 第二部分第二章
    topics: [说明书, 权利要求书]

  - path: 第二部分第二章2.1
    topics: [说明书, 充分公开]
    text: |-
      专利法第二十六条第三款规定，说明书应当对发明或者实用新型作出清楚、完整的说明，以所属技术领域的技术人员能够实现为准。
      说明书对发明或者实用新型作出的清楚、完整的说明，应当达到所属技术领域的技术人员能够实现的程度。也就是说，说明书应当满足充分公开发明或者实用新型的要求。
      关于“所属技术领域的技术人员”的含义，适用本部分第四章第2.4 节的规定。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第二章2.1.1
    topics: [说明书, 清楚]
    text: |-
      说明书的内容应当清楚，具体应满足下述要求：
      （1）主题明确。说明书应当从现有技术出发，明确地反映出发明或者实用新型想要做什么和如何去做，使所属技术领域的技术人员能够确切地理解该发明或者实用新型要求保护的主题。换句话说，说明书应当写明发明或者实用新型所要解决的技术问题以及解决其技术问题采用的技术方案，并对照现有技术写明发明或者实用新型的有益效果。上述技术问题、技术方案和有益效果应当相互适应，不得出现相互矛盾或不相关联的情形。
      （2）表述准确。说明书应当使用发明或者实用新型所属技术领域的技术术语。说明书的表述应当准确地表达发明或者实用新型的技术内容，不得含糊不清或者模棱两可，以致所属技术领域的技术人员不能清楚、正确地理解该发明或者实用新型。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第二章2.1.3
    topics: [充分公开, 能够实现]
    text: |-
      所属技术领域的技术人员能够实现，是指所属技术领域的技术人员按照说明书记载的内容，就能够实现该发明或者实用新型的技术方案，解决其技术问题，并且产生预期的技术效果。
      说明书应当清楚地记载发明或者实用新型的技术方案，详细地描述实现发明或者实用新型的具体实施方式，完整地公开对于理解和实现发明或者实用新型必不可少的技术内容，达到所属技术领域的技术人员能够实现该发明或者实用新型的程度。审查员如果有合理的理由质疑发明或者实用新型没有达到充分公开的要求，则应当要求申请人予以澄清。
      以下各种情况由于缺乏解决技术问题的技术手段而被认为无法实现：
      （1）说明书中只给出任务和/或设想，或者只表明一种愿望和/或结果，而未给出任何使所属技术领域的技术人员能够实施的技术手段；
      （2）说明书中给出了技术手段，但对所属技术领域的技术人员来说，该手段是含糊不清的，根据说明书记载的内容无法具体实施；
      （3）说明书中给出了技术手段，但所属技术领域的技术人员采用该手段并不能解决发明或者实用新型所要解决的技术问题；
      （4）申请的主题为由多个技术手段构成的技术方案，对于其中一个技术手段，所属技术领域的技术人员按照说明书记载的内容并不能实现；
      （5）说明书中给出了具体的技术方案，但未给出实验证据，而该方案又必须依赖实验结果加以证实才能成立。例如，对于已知化合物的新用途发明，通常情况下，需要在说明书中给出实验证据来证实其所述的用途以及效果，否则将无法达到能够实现的要求。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第二章2.2.2
    topics: [说明书, 技术领域]
    text: |-
      发明或者实用新型的技术领域应当是要求保护的发明或者实用新型技术方案所属或者直接应用的具体技术领域，而不是上位的或者相邻的技术领域，也不是发明或者实用新型本身。该具体的技术领域往往与发明或者实用新型在国际专利分类表中可能分入的最低位置有关。例如，一项关于挖掘机悬臂的发明，其改进之处是将背景技术中的长方形悬臂截面改为椭圆形截面。其所属技术领域可以写成“本发明涉及一种挖掘机，特别是涉及一种挖掘机悬臂”（具体的技术领域），而不宜写成“本发明涉及一种建筑机械”（上位的技术领域），也不宜写成“本发明涉及挖掘机悬臂的椭圆形截面”或者“本发明涉及一种截面为椭圆形的挖掘机悬臂”（发明本身）。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第二章2.2.3
    topics: [背景技术]
    text: |-
      发明或者实用新型说明书的背景技术部分应当写明对发明或者实用新型的理解、检索、审查有用的背景技术，并且尽可能引证反映这些背景技术的文件。尤其要引证包含发明或者实用新型权利要求书中的独立权利要求前序部分技术特征的现有技术文件，即引证与发明或者实用新型专利申请最接近的现有技术文件。说明书中引证的文件可以是专利文件，也可以是非专利文件，例如期刊、杂志、手册和书籍等。引证专利文件的，至少要写明专利文件的国别、公开号（或申请号），最好包括公开日期（或申请日期）；引证非专利文件的，要写明这些文件的标题和详细出处。
      此外，在说明书背景技术部分中，还要客观地指出背景技术中存在的问题和缺点，但是，仅限于涉及由发明或者实用新型的技术方案所解决的问题和缺点。在可能的情况下，说明存在这种问题和缺点的原因以及解决这些问题时曾经遇到的困难。
      引证文件还应当满足以下要求：
      （1）引证文件应当是公开出版物，除纸件形式外，还包括电子出版物等形式。
      （2）所引证的非专利文件的公开日应当在本申请的申请日之前；所引证的专利文件的公开日不能晚于本申请的公开日。
      （3）引证外国专利或非专利文件的，应当以所引证文件公布或发表时的原文所使用的文字写明引证文件的出处以及相关信息，必要时给出中文译文，并将译文放置在括号内。
      如果引证文件满足上述要求，则认为本申请说明书中记载了所引证文件中的内容。但是这样的引证方式是否达到充分公开发明或者实用新型的要求，参见本章第2.2.6 节。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第二章2.2.4
    topics: [发明内容]
    text: |-
      本部分应当清楚、客观地写明以下内容：
      （1）要解决的技术问题
      发明或者实用新型所要解决的技术问题，是指发明或者实用新型要解决的现有技术中存在的技术问题。发明或者实用新型专利申请记载的技术方案应当能够解决这些技术问题。
      发明或者实用新型所要解决的技术问题应当按照下列要求撰写：
      （i）针对现有技术中存在的缺陷或不足；
      （ii）用正面的、尽可能简洁的语言客观而有根据地反映发明或者实用新型要解决的技术问题，也可以进一步说明其技术效果。
      对发明或者实用新型所要解决的技术问题的描述不得采用广告式宣传用语。
      一件专利申请的说明书可以列出发明或者实用新型所要解决的一个或者多个技术问题，但是同时应当在说明书中描述解决这些技术问题的技术方案。当一件申请包含多项发明或者实用新型时，说明书中列出的多个要解决的技术问题应当都与一个总的发明构思相关。
      （2）技术方案
      一件发明或者实用新型专利申请的核心是其在说明书中记载的技术方案。
      专利法实施细则第二十条第一款第（三）项所说的写明发明或者实用新型解决其技术问题所采用的技术方案是指清楚、完整地描述发明或者实用新型解决其技术问题所采取的技术方案的技术特征。在技术方案这一部分，至少应反映包含全部必要技术特征的独立权利要求的技术方案，还可以给出包含其他附加技术特征的进一步改进的技术方案。
      说明书中记载的这些技术方案应当与权利要求所限定的相应技术方案的表述相一致。
      一般情况下，说明书技术方案部分首先应当写明独立权利要求的技术方案，其用语应当与独立权利要求的用语相应或者相同，以发明或者实用新型必要技术特征总和的形式阐明其实质，必要时，说明必要技术特征总和与发明或者实用新型效果之间的关系。
      然后，可以通过对该发明或者实用新型的附加技术特征的描述，反映对其作进一步改进的从属权利要求的技术方案。
      如果一件申请中有几项发明或者几项实用新型，应当说明每项发明或者实用新型的技术方案。
      （3）有益效果
      说明书应当清楚、客观地写明发明或者实用新型与现有技术相比所具有的有益效果。
      有益效果是指由构成发明或者实用新型的技术特征直接带来的，或者是由所述的技术特征必然产生的技术效果。
      有益效果是确定发明是否具有“显著的进步”，实用新型是否具有“进步”的重要依据。
      通常，有益效果可以由产率、质量、精度和效率的提高，能耗、原材料、工序的节省，加工、操作、控制、使用的简便，环境污染的治理或者根治，以及有用性能的出现等方面反映出来。
      有益效果可以通过对发明或者实用新型结构特点的分析和理论说明相结合，或者通过列出实验数据的方式予以说明，不得只断言发明或者实用新型具有有益的效果。
      但是，无论用哪种方式说明有益效果，都应当与现有技术进行比较，指出发明或者实用新型与现有技术的区别。
      机械、电气领域中的发明或者实用新型的有益效果，在某些情况下，可以结合发明或者实用新型的结构特征和作用方式进行说明。但是，化学领域中的发明，在大多数情况下，不适于用这种方式说明发明的有益效果，而是借助于实验数据来说明。
      对于目前尚无可取的测量方法而不得不依赖于人的感官判断的，例如味道、气味等，可以采用统计方法表示的实验结果来说明有益效果。
      在引用实验数据说明有益效果时，应当给出必要的实验条件和方法。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第二章2.2.5
    topics: [附图说明]
    text: |-
      说明书有附图的，应当写明各幅附图的图名，并且对图示的内容作简要说明。在零部件较多的情况下，允许用列表的方式对附图中具体零部件名称列表说明。
      附图不止一幅的，应当对所有附图作出图面说明。
      例如，一件发明名称为“燃煤锅炉节能装置”的专利申请，其说明书包括四幅附图，这些附图的图面说明如下：
      图1 是燃煤锅炉节能装置的主视图；
      图2 是图1 所示节能装置的侧视图；
      图3 是图2 中的A 向视图；
      图4 是沿图1 中B－B 线的剖视图。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第二章2.2.6
    topics: [具体实施方式]
    text: |-
      实现发明或者实用新型的优选的具体实施方式是说明书的重要组成部分，它对于充分公开、理解和实现发明或者实用新型，支持和解释权利要求都是极为重要的。因此，说明书应当详细描述申请人认为实现发明或者实用新型的优选的具体实施方式。在适当情况下，应当举例说明；有附图的，应当对照附图进行说明。
      优选的具体实施方式应当体现申请中解决技术问题所采用的技术方案，并应当对权利要求的技术特征给予详细说明，以支持权利要求。
      对优选的具体实施方式的描述应当详细，使发明或者实用新型所属技术领域的技术人员能够实现该发明或者实用新型。
      实施例是对发明或者实用新型的优选的具体实施方式的举例说明。实施例的数量应当根据发明或者实用新型的性质、所属技术领域、现有技术状况以及要求保护的范围来确定。
      当一个实施例足以支持权利要求所概括的技术方案时，说明书中可以只给出一个实施例。当权利要求（尤其是独立权利要求）覆盖的保护范围较宽，其概括不能从一个实施例中找到依据时，应当给出至少两个不同实施例，以支持要求保护的范围。当权利要求相对于背景技术的改进涉及数值范围时，通常应给出两端值附近（最好是两端值）的实施例，当数值范围较宽时，还应当给出至少一个中间值的实施例。
      在发明或者实用新型技术方案比较简单的情况下，如果说明书涉及技术方案的部分已经就发明或者实用新型专利申请所要求保护的主题作出了清楚、完整的说明，说明书就不必在涉及具体实施方式部分再作重复说明。
      对于产品的发明或者实用新型，实施方式或者实施例应当描述产品的机械构成、电路构成或者化学成分，说明组成产品的各部分之间的相互关系。对于可动作的产品，只描述其构成不能使所属技术领域的技术人员理解和实现发明或者实用新型时，还应当说明其动作过程或者操作步骤。
      对于方法的发明，应当写明其步骤，包括可以用不同的参数或者参数范围表示的工艺条件。
      在具体实施方式部分，对最接近的现有技术或者发明或实用新型与最接近的现有技术共有的技术特征，一般来说可以不作详细的描述，但对发明或者实用新型区别于现有技术的技术特征以及从属权利要求中的附加技术特征应当足够详细地描述，以所属技术领域的技术人员能够实现该技术方案为准。应当注意的是，为了方便专利审查，也为了帮助公众更直接地理解发明或者实用新型，对于那些就满足专利法第二十六条第三款的要求而言必不可少的内容，不能采用引证其他文件的方式撰写，而应当将其具体内容写入说明书。
      对照附图描述发明或者实用新型的优选的具体实施方式时，使用的附图标记或者符号应当与附图中所示的一致，并放在相应的技术名称的后面，不加括号。例如，对涉及电路连接的说明，可以写成“电阻3 通过三极管4 的集电极与电容5 相连接”，不得写成“3 通过4 与5 连接”。
