id: "wp-spec-biotech-deposit-sequence"
name: "生物材料保藏与序列表——申请日前保藏、三处一致、ST.26 提交"
category: "disclosure"
summary: "公众不能得到的生物材料必须在申请日前保藏，并在说明书、权利要求书与请求书中一致记载保藏单位、日期、编号与分类命名；涉及核苷酸或氨基酸序列时按 ST.26 提交独立序列表。"
context: "适用于微生物、载体、转化体、杂交瘤、抗体与基因序列相关申请。"
keywords: ["化学", "生物材料", "保藏", "CCTCC", "CGMCC", "ST.26", "序列表"]
source_ref: "专利法第26条第3款；审查指南第二部分第十章"
quality: 0.89
version: 1
steps:
  - order: 1
    name: "判断是否需要保藏"
    instruction: "自行筛选的微生物、自行构建的载体或转化体等公众不能得到的材料必须保藏；已有公开保藏单位或商业来源的，写明来源与获取方式。"
  - order: 2
    name: "在申请日前完成保藏"
    instruction: "最迟在申请日当天向布达佩斯条约认可的保藏单位交存，取得保藏编号；申请日之后补保藏不能挽救公开不充分。"
  - order: 3
    name: "三处一致记载四要素"
    instruction: "说明书、权利要求书与请求书都写明保藏单位名称与地址、保藏日期、保藏编号与分类命名（拉丁学名），三处文字必须一致。"
  - order: 4
    name: "按 ST.26 提交序列表"
    instruction: "涉及核苷酸或氨基酸序列时，在申请日提交 ST.26 标准的 XML 序列表，作为说明书的一部分；权项中的 SEQ ID NO 与序列表逐条对应。"
examples:
  - context: "菌株与序列表"
    text: "大肠杆菌 Escherichia coli X-1 已于 2024-01-01 保藏于中国典型培养物保藏中心（CCTCC），保藏编号 CCTCC NO: C2024123；编码基因的核苷酸序列如 SEQ ID NO:1 所示，序列表按 ST.26 提交。"
dos:
  - rule: "保藏四要素在三处文本中完全一致"
  - rule: "权项引用的每个 SEQ ID NO 都在 ST.26 序列表中存在"
donts:
  - rule: "不要只在说明书提「已保藏」而不写单位、日期与编号"
  - rule: "不要用旧版 ST.25 文本格式替代 ST.26 XML"
