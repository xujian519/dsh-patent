# 规则族、程序计算、文书模板与工作流 manifest 的条文对照。
#
# 计划里的两条条号按现行索引改指：
# - 细则第41条是撤回专利申请，复审请求在专利法第41条与细则第65条，无效请求在细则第69条。
# - 细则第7条是保密专利，不产生送达或期限。
#
# 运行时不读本文件。scripts/verify-patent-rule-alignment.ts 对照索引、随包规则和用例核验它。

families:
  - id: drafting
    label: 撰写
    links:
      - provision: { law: 专利法, article: 26, paragraph: 3, proposition: 清楚、完整的说明 }
        rule: { kind: packaged, id: CON-201 }
        test: { file: packages/patent/patent-rule/tests/rule-parity.spec.ts, title: 映射的资产 id 全部存在；partial 必须有资产，none 必须为空 }
      - provision: { law: 专利法, article: 26, paragraph: 4, proposition: 清楚、简要地限定要求专利保护的范围 }
        rule: { kind: packaged, id: CON-301 }
        test: { file: packages/patent/patent-rule/tests/rule-parity.spec.ts, title: 映射的资产 id 全部存在；partial 必须有资产，none 必须为空 }
      - provision: { law: 专利法, article: 33, proposition: 不得超出原说明书和权利要求书记载的范围 }
        rule: { kind: packaged, id: CON-501 }
        test: { file: packages/patent/patent-rule/tests/rule-parity.spec.ts, title: 映射的资产 id 全部存在；partial 必须有资产，none 必须为空 }
  - id: subject-matter
    label: 客体
    links:
      - provision: { law: 专利法, article: 2, paragraph: 2, proposition: 对产品、方法或者其改进所提出的新的技术方案 }
        rule: { kind: packaged, id: CON-101 }
        test: { file: packages/patent/patent-rule/tests/rule-engine.spec.ts, title: structural_analysis flags missing elements below minConfidence }
      - provision: { law: 专利法, article: 2, paragraph: 3, proposition: 对产品的形状、构造或者其结合所提出的适于实用的新的技术方案 }
        rule: { kind: packaged, id: LAW-UM-SUBJECT-001 }
        test: { file: packages/patent/patent-rule/tests/rule-parity.spec.ts, title: 映射的资产 id 全部存在；partial 必须有资产，none 必须为空 }
      - provision: { law: 专利法, article: 25, paragraph: 1, item: 2, proposition: 智力活动的规则和方法 }
        rule: { kind: packaged, id: EX-SEL-001 }
        test: { file: packages/patent/patent-rule/tests/guideline-citations.spec.ts, title: cites the section the 2023 revision holds each subject in }
  - id: novelty-inventiveness
    label: 新颖性与创造性
    links:
      - provision: { law: 专利法, article: 22, paragraph: 2, proposition: 不属于现有技术 }
        rule: { kind: packaged, id: PR-OA-004 }
        test: { file: packages/patent/patent-rule/tests/patent-full-rule-set.spec.ts, title: 前提评审落地：只讨论 26.3 的答复不触发无关主题的完整性规则 }
      - provision: { law: 专利法, article: 22, paragraph: 3, proposition: 突出的实质性特点和显著的进步 }
        rule: { kind: packaged, id: EX-INV-001 }
        test: { file: packages/patent/patent-rule/tests/patent-full-rule-set.spec.ts, title: 前提是主题词表而非全局静音：答复一旦讨论创造性，创造性族的完整性检查回归 }
  - id: unity-division
    label: 单一性与分案
    links:
      - provision: { law: 专利法, article: 31, paragraph: 1, proposition: 应当限于一项发明或者实用新型 }
        rule: { kind: source, file: packages/patent/patent-tools/src/tool/spec-claim-coverage.ts, anchor: 专利法第31条第1款 }
        test: { file: packages/patent/patent-tools/tests/validate-specification.spec.ts, title: 技术主题无关的独立权利要求 → error，未通过 }
      - provision: { law: 专利法, article: 31, paragraph: 2, proposition: 一件外观设计专利申请应当限于一项外观设计 }
        rule: { kind: source, file: packages/patent/patent-core/src/claim-coverage/unity.ts, anchor: 专利法第31条第2款的外观设计合案不在本判定中 }
        test: { file: packages/patent/patent-core/tests/claim-coverage/unity.spec.ts, title: 外观设计合案（专利法第31条第2款）不在本判定中 }
      - provision: { law: 专利法实施细则, article: 48, paragraph: 1, proposition: 可以向国务院专利行政部门提出分案申请 }
        rule: { kind: packaged, id: EX-PRC-002 }
        test: { file: packages/patent/patent-rule/tests/guideline-citations.spec.ts, title: cites the section the 2023 revision holds each subject in }
  - id: reexamination-invalidation
    label: 复审与无效
    links:
      - provision: { law: 专利法, article: 41, paragraph: 1, proposition: 可以自收到通知之日起三个月内向国务院专利行政部门请求复审 }
        rule: { kind: packaged, id: P-PRC-004 }
        test: { file: packages/patent/patent-rule/tests/guideline-citations.spec.ts, title: cites the section the 2023 revision holds each subject in }
      - provision: { law: 专利法实施细则, article: 65, paragraph: 1, proposition: 应当提交复审请求书，说明理由 }
        rule: { kind: packaged, id: P-PRC-004 }
        test: { file: packages/patent/patent-rule/tests/guideline-citations.spec.ts, title: cites the section the 2023 revision holds each subject in }
      - provision: { law: 专利法实施细则, article: 69, paragraph: 1, proposition: 应当向国务院专利行政部门提交专利权无效宣告请求书和必要的证据一式两份 }
        rule: { kind: packaged, id: EVI-001 }
        test: { file: packages/patent/patent-core/tests/evidence-engine.spec.ts, title: loadRules：加载证据规则资产后权重生效且规则可查 }
  - id: design
    label: 外观设计
    links:
      - provision: { law: 专利法, article: 23, paragraph: 1, proposition: 不属于现有设计 }
        rule: { kind: source, file: packages/patent/patent-core/src/notice/grounds.ts, anchor: "article: '专利法第23条第1款'" }
        test: { file: packages/patent/patent-core/tests/notice/grounds.spec.ts, title: 三条理由逐条识别 }
      - provision: { law: 专利法, article: 23, paragraph: 2, proposition: 应当具有明显区别 }
        rule: { kind: source, file: packages/patent/patent-core/src/notice/grounds.ts, anchor: "article: '专利法第23条第2款'" }
        test: { file: packages/patent/patent-core/tests/notice/grounds.spec.ts, title: 三条理由逐条识别 }
      - provision: { law: 专利法, article: 23, paragraph: 3, proposition: 不得与他人在申请日以前已经取得的合法权利相冲突 }
        rule: { kind: source, file: packages/patent/patent-core/src/notice/grounds.ts, anchor: "article: '专利法第23条第3款'" }
        test: { file: packages/patent/patent-core/tests/notice/grounds.spec.ts, title: 三条理由逐条识别 }
  - id: term-compensation
    label: 期限补偿
    links:
      - provision: { law: 专利法, article: 42, paragraph: 1, proposition: 发明专利权的期限为二十年 }
        rule: { kind: source, file: packages/patent/patent-deadline/src/statutes-data.ts, anchor: "case 'invention': return 20" }
        test: { file: packages/patent/patent-deadline/tests/statutes.spec.ts, title: computes the periods that run from the filing date }
      - provision: { law: 专利法, article: 42, paragraph: 2, proposition: 就发明专利在授权过程中的不合理延迟给予专利权期限补偿 }
        rule: { kind: source, file: packages/patent/patent-deadline/src/deadline-entries.ts, anchor: 专利法第42条第2款、专利法实施细则第77条 }
        test: { file: packages/patent/patent-deadline/tests/statutes.spec.ts, title: computes the term-compensation request from the grant publication date }
      - provision: { law: 专利法, article: 42, paragraph: 3, proposition: 补偿期限不超过五年 }
        rule: { kind: source, file: packages/patent/patent-deadline/src/statutes-data.ts, anchor: MAX_TERM_COMPENSATION_YEARS = 5 }
        test: { file: packages/patent/patent-deadline/tests/statutes.spec.ts, title: rejects compensation and paid-through values outside their domain }
  - id: service-periods
    label: 送达与期限
    links:
      - provision: { law: 专利法实施细则, article: 4, paragraph: 4, proposition: 自文件发出之日起满15日 }
        rule: { kind: source, file: packages/patent/patent-deadline/src/delivery.ts, anchor: "addCalendarDays(request.dispatchDate, 15)" }
        test: { file: packages/patent/patent-deadline/tests/delivery.spec.ts, title: adds 15 days for postal delivery }
      - provision: { law: 专利法实施细则, article: 5, proposition: 开始的当日不计算在期限内 }
        rule: { kind: source, file: packages/patent/patent-deadline/src/period.ts, anchor: The start day itself is not counted }
        test: { file: packages/patent/patent-deadline/tests/period.spec.ts, title: "ends a day period N days after the start, not counting the start day" }
      - provision: { law: 专利法实施细则, article: 6, paragraph: 1, proposition: 自障碍消除之日起2个月内且自期限届满之日起2年内 }
        rule: { kind: source, file: packages/patent/patent-deadline/src/report.ts, anchor: 自障碍消除之日起2个月内 }
        test: { file: packages/patent/patent-deadline/tests/report.spec.ts, title: states the recovery and extension rules once an entry is overdue }
      - provision: { law: 专利法实施细则, article: 7, paragraph: 1, proposition: 涉及国防利益需要保密的，由国防专利机构受理并进行审查 }
        rule: { kind: source, file: packages/patent/patent-law/assets/law/cn-examination-guidelines.yaml, anchor: 根据专利法实施细则第七条第一款的规定 }
        test: { file: scripts/verify-patent-rule-alignment.spec.ts, title: 细则第7条是保密专利，期限引擎不把它当作期限 }
  - id: fees
    label: 费用
    links:
      - provision: { law: 专利法实施细则, article: 110, paragraph: 1, proposition: 应当缴纳下列费用 }
