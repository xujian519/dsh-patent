    text: '已经生效的给予强制许可的决定和终止强制许可的决定,以及强制许可自动终止的,应当在专利登记簿上登记并在专利公报上公告。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

