id: "wp-claim-composition-closed-form"
name: "组合物组分与含量——闭式表达并把上限收敛到 100%"
category: "claim_drafting"
summary: "组合物权要的基本表达是「组分 + 含量」；能穷举时用闭式并写明合计 100%，不能穷举时用开式或半开半闭，同时用对比例证明组合效果。"
context: "适用于粘合剂、洗涤剂、润滑油、农药、食品与药品等组合物权利要求及说明书。"
keywords: ["化学", "组合物", "组分", "含量", "百分含量", "对比例"]
source_ref: "专利法第26条第4款；审查指南第二部分第十章"
quality: 0.88
version: 1
steps:
  - order: 1
    name: "选择闭式或开式"
    instruction: "组分可穷举时用「组分 A：X%-Y%；组分 B：Z%-W%」闭式；含有不必穷举的辅料时用开式或半开半闭，把主组分写成范围、辅组分写「药学上可接受的载体」。"
  - order: 2
    name: "校验含量合计"
    instruction: "闭式组合物逐项相加，确保各组分上限合计不超过 100%；无法全部穷举时用「余量」「补足至 100%」限定平衡组分。"
  - order: 3
    name: "公开组分来源与制备"
    instruction: "天然原料写产地或代表性组成；混合顺序、温度与设备只要影响性能就必须公开，性能参数要给出可测定的方法与条件。"
  - order: 4
    name: "补单组分对比例"
    instruction: "主张协同或复配增效时，给出单组分对照与不含该组分的空白对照，在同一测试条件下比较，避免只有组合物的单点数据。"
examples:
  - context: "闭式组合物权要"
    text: "一种农药组合物，以组合物总重量计，包含：活性成分 A 10%-30%；分散剂 B 2%-8%；余量为载体；对比例 1 为不含 B 的 A 单剂，同一田间试验下防效下降 25%。"
dos:
  - rule: "闭式组合物的各组分上限合计不超过 100%"
  - rule: "协同效果有单组分对比例与同一测试条件"
donts:
  - rule: "不要写互相重叠且合计超过 100% 的含量范围"
  - rule: "不要用「高粘度」「强粘合力」等无法客观测定的性能限定"
