id: "wp-claim-markush-equivalents"
name: "化学通式与马库什——并列下位都能达到同一效果"
category: "claim_drafting"
summary: "通式或马库什权要的每个并列下位都必须是可实施的替代方案；说明书要为各并列下位给出制备例或效果数据，达不到同一效果的下位应删除或缩小。"
context: "适用于化合物、组合物、高分子与药物用途案的通式权要定稿。"
keywords: ["化学", "马库什", "通式", "并列下位", "26.4"]
source_ref: "专利法第26条第4款；审查指南第二部分第十章"
quality: 0.88
version: 1
steps:
  - order: 1
    name: "拆分通式变量"
    instruction: "列出通式中每个可变基团及其并列选项，标出哪些选项是核心结构、哪些只是优选替换。"
  - order: 2
    name: "为并列下位找实施例"
    instruction: "每个并列下位至少对应一个制备例或效果数据；只给一个代表例而将其余下位概括进来时，说明为何能合理预测同一效果。"
  - order: 3
    name: "删除或缩小不达标下位"
    instruction: "有理由怀疑某下位不能解决同一技术问题或达不到同一效果时，从权要删除该下位，或把它移入从权并补效果数据。"
  - order: 4
    name: "检查马库什单一性"
    instruction: "马库什结构中的并列选择应属于同一发明构思；不同核心结构可能构成多个发明，需要分案或删除。"
examples:
  - context: "通式权要"
    text: "通式中 R1 为 C1-C4 烷基；说明书分别给出甲基、乙基、丙基、丁基四个制备例及同一效果数据，删除无法制备的叔丁基。"
dos:
  - rule: "每个并列下位都有制备例、效果数据或可预测的合理依据"
  - rule: "通式变量的定义与实施例中的具体基团一一对应"
donts:
  - rule: "不要用「包括但不限于」无限扩张并列下位"
  - rule: "不要把只有一种实施方式的通式直接概括为马库什"
