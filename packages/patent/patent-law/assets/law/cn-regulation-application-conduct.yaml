    verifiedOn: 2026-11-14

  - article: 6
    topics: [各地人⺠政府管理专利工作的部⻔应当引导公众和专利]
    text: |-
      各地人⺠政府管理专利工作的部⻔应当引导公众和专利代理机构依法提交专利申请。
      专利代办处发现非正常申请专利行为的,应当及时报告国家知识产权局。
