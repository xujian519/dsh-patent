# 本文件由 XiaoNuo Agent 的 patent-examination-rules.yaml 转换而来，现按本仓库直接维护：改动直接改本文件。
# 转换脚本 scripts/port-nuo-rules.ts 与转换前的原始文件 assets/patent-rules/patent-examination-rules.yaml 均不在本仓库，
# 内容的唯一事实源是本文件。
# 转换语义: pattern_analysis(期望模式)→structural_analysis 单 element；severity warning→major；info→minor
version: "1.0"
rules:
  - id: EX-SEL-001
    name: 不授权—智力活动的规则和方法
    domain: patent_general
    phase: post_execution
    severity: critical
    action: block
    legalBasis: 专利法第25条第1款第(二)项；审查指南第二部分第一章4.2
    basisKind: statute
    check:
      type: structural_analysis
      requiresAll:
        - element: 期望模式
          description: 不授权—智力活动的规则和方法
          patterns:
            - 智力活动
            - 规则和方法
            - 组织
            - 比赛
            - 游戏规则
      minConfidence: 1
  - id: EX-SEL-002
    name: 不授权—疾病诊断和治疗方法
