id: "wp-claim-software-trio"
name: "软件三件套——方法、装置与存储介质共享同一发明构思"
category: "claim_drafting"
summary: "计算机程序发明可写成方法、装置、存储介质或程序产品；各主题必须由同一发明构思支持，装置权要的模块与流程步骤对应，存储介质与程序产品写明载体与程序内容。"
context: "适用于软件、算法与人工智能案需要布置方法、装置、介质三套权利要求时。"
keywords: ["软件专利", "装置权利要求", "存储介质", "程序模块", "计算机程序"]
source_ref: "专利法第26条第4款；审查指南第二部分第九章5.2"
quality: 0.90
version: 1
steps:
  - order: 1
    name: "方法权要写清步骤链"
    instruction: "按执行顺序写各步骤，明确每步的输入、处理与输出；避免只写功能目标，不写如何完成。"
  - order: 2
    name: "装置权要写模块关系"
    instruction: "装置权要的每个程序模块与方法步骤一一对应，并写明模块之间的数据连接；不要只罗列模块名称。"
    example: "一种数据识别装置，包括：采集模块，用于获取原始数据；特征提取模块，用于……；输出模块，用于根据特征提取模块的输出……。"
  - order: 3
    name: "介质与程序产品写载体"
    instruction: "存储介质权要写明存储的计算机程序及其被处理器执行时实现的步骤；程序产品写明程序指令与承载介质。"
  - order: 4
    name: "核对同一构思"
    instruction: "三套权要共享同一必要技术特征与技术效果；说明书流程图与装置结构图分别支撑方法与装置主题。"
examples:
  - context: "三套权要"
    text: "方法权要：S1 采集、S2 提取、S3 输出；装置权要：采集模块、提取模块、输出模块；存储介质：存储实现 S1-S3 的程序。"
dos:
  - rule: "模块划分与流程图步骤一一对应，模块间关系可追踪"
  - rule: "三套主题使用同一套技术术语"
donts:
  - rule: "不要用「处理器执行上述方法」代替装置权要的必要技术特征"
  - rule: "不要把三套主题写成互不关联的三个方案"
