    note: 右栏新增「根据专利法第五条第一款的审查」，原 6.1.1 起编号后移
    newColumnText: |-
      对于包含算法特征或商业规则和方法特征的发明专利申
      请，如果其中的数据采集、标签管理、规则设置、推荐决策
      等含有违反法律、社会公德或者妨害公共利益的内容，则根
      据专利法第五条第一款的规定，不能被授予专利权。
  - path: 第二部分第九章6.3.3
    title: 审查示例
    note: 右栏新增审查示例
    newColumnText: |-
      【例20】
      一种用于生成人脸特征的方法
      申请内容概述
      发明专利申请通过将设有空间变换网络的第一卷积神经
      网络所生成的特征区域图像集合，对各第二卷积神经网络实
      现信息共享，据此可以减少内存资源占用，同时提高人脸图
      像生成结果的准确度。
      申请的权利要求
      一种用于生成人脸特征的方法，包括：
      获取待识别人脸图像；
      将所述待识别人脸图像输入第一卷积神经网络生成所述
      待识别人脸图像的特征区域图像集合，其中，所述第一卷积
      神经网络用于从人脸图像中提取特征区域图像；
      将所述特征区域图像集合中的每个特征区域图像输入对
      应的第二卷积神经网络生成该特征区域图像的区域人脸特
      征，其中，所述第二卷积神经网络用于提取对应的特征区域
      图像的区域人脸特征；
      根据所述特征区域图像集合中的各特征区域图像的区域
      人脸特征生成所述待识别人脸图像的人脸特征集合；
      其中，所述第一卷积神经网络中还设置有空间变换网络，
      用于确定人脸图像的特征区域；以及
      将所述待识别人脸图像输入第一卷积神经网络，生成所
      述待识别人脸图像的特征区域图像集合，包括：将所述待识
      别人脸图像输入所述空间变换网络，确定所述待识别人脸图
      像的特征区域；将所述待识别人脸图像输入所述第一卷积神
      经网络，根据确定的特征区域，生成所述待识别人脸图像的
      特征区域图像集合。
      说明书相关段落
      本申请实施例提供的用于生成人脸特征的方法，首先通
      过将获取的待识别人脸图像输入第一卷积神经网络，可以生
      成待识别人脸图像的特征区域图像集合。第一卷积神经网络
      可以用于从人脸图像中提取特征区域图像。然后，可以将特
      征区域图像集合中的每个特征区域图像输入对应的第二卷积
      神经网络，从而生成该特征区域图像的区域人脸特征。第二
      卷积神经网络可以用于提取对应的特征区域图像的区域人脸
      特征。之后，根据特征区域图像集合中的各特征区域图像的
      区域人脸特征，可以生成待识别人脸图像的人脸特征集合。
      也就是说，第一卷积神经网络所生成的特征区域图像集合，
      对于各第二卷积神经网络可以实现信息共享。这样可以减少
      数据量，从而降低内存资源的占用，同时有助于提高生成效
      率。
      为了提高生成结果的准确度，第一卷积神经网络中还可
      以设置有空间变换网络，用于确定人脸图像的特征区域。此
      时，电子设备可以将待识别人脸图像输入空间变换网络，以
      确定待识别人脸图像的特征区域。这样，第一卷积神经网络
      对输入的待识别人脸图像，可以根据空间变换网络确定出的
      特征区域，提取特征层上与特征区域匹配的图像，以生成待
      识别人脸图像的特征区域图像集合。空间变换网络在第一卷
      积神经网络中的具体设置位置在本申请中并不限制。空间变
      换网络可以通过不断地学习来确定不同人脸图像的不同特征
      的特征区域。
      分析及结论
      发明专利申请请求保护一种用于生成人脸特征的方法，
      为了提高人脸图像生成结果的准确度，第一卷积神经网络中
      可以设置有空间变换网络，用于确定人脸图像的特征区域，
      但是说明书中并未记载该空间变换网络在第一卷积神经网络
      中的具体设置位置。
      所属技术领域的技术人员知晓，空间变换网络作为一个
      整体，可以插入到第一卷积神经网络中的任意位置，形成卷
      积神经网络嵌套的结构，例如该空间变换网络可以作为第一
      卷积神经网络的第一层，也可以作为第一卷积神经网络的中
      间层，上述位置并不影响其识别图像的特征区域的能力。通
      过训练，空间变换网络能够确定不同人脸图像的不同特征所
      在特征区域。由此，空间变换网络不仅可以指导第一卷积神
      经网络进行特征区域切割，还可以对输入数据进行简单的空
      间变换，以便提高第一卷积神经网络的处理效果。据此，发
      明专利申请所采用的模型的层级清楚，各层级之间的输入/
      输出及其之间的关系清楚，其中，卷积神经网络和空间变换
      网络都是公知的算法，所属技术领域的技术人员根据上述记
      载能够构建相应的模型架构。因此，发明专利申请请求保护
      的解决方案在说明书中已被充分公开，符合专利法第二十六
      条第三款的规定。
      【例21】
      一种基于生物信息预测癌症的方法
      申请内容概述
      发明专利申请提供了一种基于生物信息预测癌症的方
      法，通过训练好的恶性肿瘤增强筛查模型，将血常规、血生
      化检测指标和人脸图像特征共同作为筛查模型的输入，得到
      恶性肿瘤患病预测值，由此解决提升恶性肿瘤预测准确性的
      技术问题。
      申请的权利要求
      一种基于生物信息预测癌症的方法，其特征在于，包括：
      获取待筛查者的血常规化验单、血生化化验单，识别血
      常规、血生化化验单中的检测指标、年龄、性别；
      获取待筛查者正面的素颜人脸图像，提取人脸图像特征；
      基于恶性肿瘤增强筛查模型，预测出相应待筛查者中恶
      性肿瘤患病预测值；
      其中，恶性肿瘤增强筛查模型的训练过程为：构建大规
      模人群样本集合，样本中包含同一人的血常规、血生化和人
      脸图像；利用血常规、血生化和人脸图像特征建立学习样本；
      利用学习样本训练机器学习算法模型，得到恶性肿瘤增强筛
      查模型。
      说明书相关段落
      目前采用肿瘤标志物识别恶性肿瘤时，肿瘤标志物的标
      准在大于阈值的情况下，并不能确定为恶性肿瘤，在小于阈
      值的情况下，也不能排除恶性肿瘤，根据肿瘤标志物预测癌
      症，其准确性不高。本申请利用血常规、血生化检测指标、
      人脸图像来提高多种恶性肿瘤的识别准确性。本申请在利用
      血项化验数据的同时，参考人脸图像所反映出的待筛查者的
      健康状况，可以更加准确的预测恶性肿瘤的患病概率，其中
      恶性肿瘤增强筛查模型计算特征的选取，可以利用血常规数
      据和血生化的部分指标或者全部指标。
      分析及结论
      发明专利申请要解决的技术问题是如何提高恶性肿瘤预
      测的准确性，为解决上述技术问题，该解决方案利用训练好
      的恶性肿瘤增强筛查模型，将血常规、血生化检测指标和人
      脸图像特征共同作为筛查模型的输入，以期得到恶性肿瘤患
      病预测值。然而，血常规和血生化这两种常见的生化检测项
      目各包含了几十个检测指标。但是，说明书中并未记载具体
      哪些指标是与肿瘤预测准确度相关的关键指标，或者是参考
      了所有指标、对各指标赋予不同权重进行预测，所属技术领
      域的技术人员也无法确定哪些指标能够用于判断恶性肿瘤。
      同时，基于目前的科学研究，除了面部皮肤癌等少数几种肿
      瘤外，人脸特征与罹患恶性肿瘤之间是否存在关联尚不确定，
      说明书中也未记载或者证明“判断的依据因素”与“判断的结
      果”两者之间的因果关系。此外，说明书中也没有提供任何验
      证数据证明采用该解决方案识别多种恶性肿瘤的准确率比采
      用肿瘤标志物识别的准确率更高，或者明显高于随机判断恶
      性肿瘤患病概率的准确率水平。所属技术领域的技术人员仅
      根据说明书公开的内容，无法确定本申请的解决方案可以解
      决其要解决的技术问题。因此，发明专利申请请求保护的技
      术方案在说明书中未被充分公开，说明书不符合专利法第二
      十六条第三款的规定。
  - path: 第二部分第九章7
    title: 包含比特流的发明专利申请审查相关规定
    note: 右栏新增「包含比特流的发明专利申请审查相关规定」一章
    newColumnText: |-
      在流媒体、通信系统、计算机系统等应用领域中，各种
      类型的数据一般以比特流的形式生成、存储、传输等。本节
      旨在根据专利法及其实施细则的规定，对包含比特流的发明
      专利申请保护客体的审查以及说明书和权利要求书的撰写作
      出具体规定。
  - path: 第二部分第九章7.1
    title: 保护客体的审查
    note: 右栏新增本章第 7.1 节
    newColumnText: null
  - path: 第二部分第九章7.1.1
    title: 根据专利法第二十五条第一款第（二）项的审查
    note: 右栏新增第 7.1.1 节
    newColumnText: |-
      如果一项权利要求的主题仅仅涉及一种单纯的比特流，
      则该权利要求属于专利法第二十五条第一款第（二）项规定
      的智力活动的规则和方法，不属于专利保护的客体。例如，“一
      种比特流，其特征在于，包括语法元素A、语法元素B、……”。
      如果一项权利要求，除其主题名称之外、对其进行限定
      的全部内容仅仅涉及单纯的比特流，则该权利要求属于专利
      法第二十五条第一款第（二）项规定的智力活动的规则和方
      法，不属于专利保护的客体。例如，“一种生成比特流的方法，
      其特征在于，该比特流包括语法元素A、语法元素B、……”。
  - path: 第二部分第九章7.1.2
    title: 根据专利法第二条第二款的审查
    note: 右栏新增第 7.1.2 节
    newColumnText: |-
      在数字视频编解码的技术领域，通常视频数据通过视频
      编码方法生成比特流，比特流通过视频解码方法生成视频数
      据。如果一种生成比特流的特定视频编码方法属于专利法第
      二条第二款所述的技术方案，则由该特定视频编码方法所限
      定的、存储或者传输该比特流的方法以及存储该比特流的计
      算机可读存储介质，能够实现存储或者传输资源的优化配置
      等，因此，由该特定视频编码方法所限定的存储或者传输方
      法以及计算机可读存储介质属于专利法第二条第二款所述的
      技术方案，属于专利保护的客体。
  - path: 第二部分第九章7.2
    title: 说明书及权利要求书的撰写
    note: 右栏新增本章第 7.2 节
    newColumnText: null
  - path: 第二部分第九章7.2.1
    title: 说明书的撰写
    note: 右栏新增第 7.2.1 节
    newColumnText: |-
      包含由特定视频编码方法生成的比特流的发明专利申请
      的说明书，应当对该特定视频编码方法作出清楚、完整的说
      明，以所属技术领域的技术人员能够实现为准。保护主题涉
      及存储或者传输该比特流的方法以及存储该比特流的计算机
      可读存储介质的，说明书还应当作出相应的说明以支持权利
      要求。
  - path: 第二部分第九章7.2.2
    title: 权利要求书的撰写
    note: 右栏新增第 7.2.2 节
    newColumnText: |-
      包含由特定视频编码方法生成的比特流的发明专利申请
      可以撰写成存储方法、传输方法和计算机可读存储介质权利
      要求。这类权利要求一般应当以生成该比特流的特定视频编
      码方法权利要求为基础，通过引用该特定视频编码方法权利
      要求、或者包括该特定视频编码方法全部特征的方式撰写。
      【例1】
      一件涉及视频编解码技术的发明专利申请，可以按下述
      方式撰写权利要求。
      1.一种视频编码方法，其特征在于，包括以下步骤：
      帧划分步骤，……
      ……
      熵编码步骤，……
      2.一种视频编码装置，其特征在于，包括以下单元：
      帧划分单元，……
      ……
      熵编码单元，……
      3.一种视频解码方法，其特征在于，包括以下步骤：
      熵解码步骤，……
      ……
      帧输出步骤，……
      4.一种视频解码装置，其特征在于，包括以下单元：
      熵解码单元，……
      ……
      帧输出单元，……
      5.一种存储比特流的方法，其特征在于，执行权利要求1
      所述视频编码方法生成比特流；以及存储所述比特流。
      6.一种传输比特流的方法，其特征在于，执行权利要求1
      所述视频编码方法生成比特流；以及传输所述比特流。
      7.一种计算机可读存储介质，其上存储有计算机程序/指
      令和比特流，其特征在于，该计算机程序/指令被处理器执行
      时实现权利要求1 所述视频编码方法生成所述比特流。
  - path: 第四部分第三章4.6.4
    title: 修改文本的提交
    note: 右栏新增「修改文本的提交」
    newColumnText: |-
      专利权人修改权利要求书的，应当提交全文替换页和修
      改对照表。
      专利权人在同一无效宣告请求的审理程序中提交的多个
      修改文本均符合本章第4.6.3 节规定的，以最后一次提交的修
      改文本为准，其余修改文本不作为审查基础。
  - path: 第五部分第七章8.3
    title: 快速审查
    note: 右栏新增「快速审查」，原 8.3 起编号后移
    newColumnText: |-
      对于经国家级知识产权保护中心或者快速维权中心预审
      合格后提交的专利申请，符合快速审查相关规定的，可以快
      速审查。

changePoints:
  - path: 第一部分第一章4.1.2
    title: 发明人
    kind: amended
    oldColumnText: |-
      专利法实施细则第十四条规定，发明人是指对发明创造
      的实质性特点作出创造性贡献的人。在专利局的审查程序中，
      审查员对请求书中填写的发明人是否符合该规定不作审查。
      发明人应当是个人，请求书中不得填写单位或者集体，
      以及人工智能名称，例如不得写成“××课题组”或者“人工智能
      ××”等。……
    newColumnText: |-
      专利法实施细则第十四条规定，发明人是指对发明创造
      的实质性特点作出创造性贡献的人。不得填写虚假的发明人。
      在专利审查程序中，审查员对请求书中填写的发明人是
      否符合该规定一般不作审查，但有证据表明请求书中填写的
      发明人不符合该规定的除外。
      发明人应当是个人（即自然人），请求书中应当填写所有
      发明人的身份信息，并确保信息真实。请求书中不得填写单
      位或者集体，以及人工智能名称，例如不得写成“××课题组”
      或者“人工智能××”等。……

  - path: 第一部分第一章4.1.6
    title: 专利代理机构、专利代理师
    kind: amended
    oldColumnText: |-
      专利代理机构的名称应当使用其在国家知识产权局登记
      的全称，并且要与加盖在申请文件中的专利代理机构公章上
      的名称一致，不得使用简称或者缩写。请求书中还应当填写
      国家知识产权局给予该专利代理机构的机构代码。
    newColumnText: |-
      专利代理机构的名称应当使用其在国家知识产权局登记
      的全称，并且要与加盖在申请文件中的专利代理机构公章上
      的名称一致，不得使用简称或者缩写。请求书中还应当填写
      国家知识产权局给予该专利代理机构的机构代码。专利代理
      机构应当对请求书中填写的申请人身份信息和联系方式进行
      核实。
      专利代理机构或者专利代理师以自己的名义申请专利或
      者请求宣告专利权无效的，依照《专利代理条例》处理。

