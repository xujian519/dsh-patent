  - path: 第二部分第二章3.2.1
    topics: [权利要求, 以说明书为依据]
    text: |-
      权利要求书应当以说明书为依据，是指权利要求应当得到说明书的支持。权利要求书中的每一项权利要求所要求保护的技术方案应当是所属技术领域的技术人员能够从说明书充分公开的内容中得到或概括得出的技术方案，并且不得超出说明书公开的范围。
      权利要求通常由说明书记载的一个或者多个实施方式或实施例概括而成。权利要求的概括应当不超出说明书公开的范围。如果所属技术领域的技术人员可以合理预测说明书给出的实施方式的所有等同替代方式或明显变型方式都具备相同的性能或用途，则应当允许申请人将权利要求的保护范围概括至覆盖其所有的等同替代或明显变型的方式。对于权利要求概括得是否恰当，审查员应当参照与之相关的现有技术进行判断。开拓性发明可以比改进性发明有更宽的概括范围。
      对于用上位概念概括或用并列选择方式概括的权利要求，应当审查这种概括是否得到说明书的支持。如果权利要求的概括包含申请人推测的内容，而其效果又难于预先确定和评价，应当认为这种概括超出了说明书公开的范围。如果权利要求的概括使所属技术领域的技术人员有充分理由怀疑该上位概括或并列概括所包含的一种或多种下位概念或选择方式不能解决发明或者实用新型所要解决的技术问题，并达到相同的技术效果，则应当认为该权利要求没有得到说明书的支持。对于这些情况，审查员应当根据专利法第二十六条第四款的规定，以权利要求得不到说明书的支持为理由，要求申请人修改权利要求。
      例如，对于“用高频电能影响物质的方法”这样一个概括较宽的权利要求，如果说明书中只给出一个“用高频电能从气体中除尘”的实施方式，对高频电能影响其他物质的方法未作说明，而且所属技术领域的技术人员也难以预先确定或评价高频电能影响其他物质的效果，则该权利要求被认为未得到说明书的支持。
      再如，对于“控制冷冻时间和冷冻程度来处理植物种子的方法”这样一个概括较宽的权利要求，如果说明书中仅记载了适用于处理一种植物种子的方法，未涉及其他种类植物种子的处理方法，由于不同植物种子的低温耐受力等生理特性差别较大，所属技术领域的技术人员难以预期处理其他种类植物种子的效果，则该权利要求也被认为未得到说明书的支持。除非说明书中还指出了这种植物种子和其他植物种子的一般关系，或者记载了足够多的实施例，使所属技术领域的技术人员能够明了如何使用这种方法处理植物种子，才可以认为该权利要求得到了说明书的支持。
      对于一个概括较宽又与整类产品或者整类机械有关的权利要求，如果说明书中有较好的支持，并且也没有充分理由怀疑发明或者实用新型在权利要求范围内不可以实施，那么，即使这个权利要求范围较宽也是可以接受的。但是当说明书中给出的信息不充分，所属技术领域的技术人员用常规的实验或者分析方法不足以把说明书记载的内容扩展到权利要求所述的保护范围时，审查员应当要求申请人作出解释，说明所属技术领域的技术人员在说明书给出信息的基础上，能够容易地将发明或者实用新型扩展到权利要求的保护范围；否则，应当要求申请人限制权利要求。例如，对于“一种处理合成树脂成型物来改变其性质的方法”的权利要求，如果说明书中只涉及热塑性树脂的实施例，而且申请人又不能证明该方法也适用于热固性树脂，那么申请人就应当把权利要求限制在热塑性树脂的范围内。
      通常，对产品权利要求来说，应当尽量避免使用功能或者效果特征来限定发明。只有在某一技术特征无法用结构特征来限定，或者技术特征用结构特征限定不如用功能或效果特征来限定更为恰当，而且该功能或者效果能通过说明书中规定的实验或者操作或者所属技术领域的惯用手段直接和肯定地验证的情况下，使用功能或者效果特征来限定发明才可能是允许的。
      对于权利要求中所包含的功能性限定的技术特征，应当理解为覆盖了所有能够实现所述功能的实施方式。对于含有功能性限定的特征的权利要求，应当审查该功能性限定是否得到说明书的支持。如果权利要求中限定的功能是以说明书实施例中记载的特定方式完成的，并且所属技术领域的技术人员不能明了此功能还可以采用说明书中未提到的其他替代方式来完成，或者所属技术领域的技术人员有充分理由怀疑该功能性限定所包含的一种或几种方式不能解决发明或者实用新型所要解决的技术问题，并达到相同的技术效果，则权利要求中不得采用覆盖了上述其他替代方式或者不能解决发明或实用新型技术问题的方式的功能性限定。
      此外，如果说明书中仅以含糊的方式描述了其他替代方式也可能适用，但对所属技术领域的技术人员来说，并不清楚这些替代方式是什么或者怎样应用这些替代方式，则权利要求中的功能性限定也是不允许的。另外，纯功能性的权利要求得不到说明书的支持，因而也是不允许的。
      在判断权利要求是否得到说明书的支持时，应当考虑说明书的全部内容，而不是仅限于具体实施方式部分的内容。如果说明书的其他部分也记载了有关具体实施方式或实施例的内容，从说明书的全部内容来看，能说明权利要求的概括是适当的，则应当认为权利要求得到了说明书的支持。
      对于包括独立权利要求和从属权利要求或者不同类型权利要求的权利要求书，需要逐一判断各项权利要求是否都得到了说明书的支持。独立权利要求得到说明书支持并不意味着从属权利要求也必然得到支持；方法权利要求得到说明书支持也并不意味着产品权利要求必然得到支持。
      当要求保护的技术方案的部分或全部内容在原始申请的权利要求书中已经记载而在说明书中没有记载时，允许申请人将其补入说明书。但是权利要求的技术方案在说明书中存在一致性的表述，并不意味着权利要求必然得到说明书的支持。只有当所属技术领域的技术人员能够从说明书充分公开的内容中得到或概括得出该项权利要求所要求保护的技术方案时，记载该技术方案的权利要求才被认为得到了说明书的支持。
