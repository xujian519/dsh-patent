    caseType: infringement
    title: 侵权口径冲突时指南只作参考
    answer: "保护范围见专利法第64条第1款。发明人填写口径见专利审查指南第一部分第一章4.1.2。侵权判定中指南只作参考，不能改写专利法第64条。"
    forbidden:
