id: "wp-embodiment-enablement-matrix"
name: "26.3 实施例矩阵——每个独权特征至少一条可实施实施例"
category: "embodiment"
summary: "把独权的每个必要技术特征逐项映射到说明书中的实施例与具体参数，形成可核查的矩阵；任一行缺少可实施内容，说明书就不满足充分公开。"
context: "适用于说明书具体实施方式定稿前，以及 26.3 审查意见答复时的自查。"
keywords: ["26.3", "充分公开", "实施例矩阵", "可实施", "参数"]
source_ref: "专利法第26条第3款；审查指南第二部分第二章2.1"
quality: 0.88
version: 1
steps:
  - order: 1
    name: "拆出独权特征清单"
    instruction: "按独权的技术特征逐项编号，功能性限定与上位概括单独标记，作为矩阵的行。"
  - order: 2
    name: "为每行填实施例位置"
    instruction: "写明该特征在具体实施方式的哪一段、以什么结构或参数实现；只写「可以采用本领域常规手段」不算填行。"
    example: "F2 螺旋形加热通道：实施例1 第[0018]段，螺距 30-45mm，通道截面 8mm×8mm。"
  - order: 3
    name: "补齐参数与效果"
    instruction: "涉及数值范围时写出端点与至少一个中值；涉及效果时给出可重复的测量条件与数据。范围外至少给一个对比例，说明临界性。"
  - order: 4
    name: "处理空行"
    instruction: "矩阵中仍为空的行，要么在说明书补实施例，要么把该特征从独权删除或缩小；不得保留无实施例支撑的概括。"
examples:
  - context: "软件案"
    text: "F1 输入模块、F2 特征提取模块、F3 输出模块分别对应实施例1 的步骤 S101-S103，并写明各模块的输入输出关联。"
dos:
  - rule: "矩阵行与独权特征一一对应，空行即视为未完成"
  - rule: "参数写到本领域技术人员能照做的程度，并给出测量条件"
donts:
  - rule: "不要用「本领域技术人员知晓」跳过关键参数"
  - rule: "不要把效果数据写成无法复现的定性描述"
