  - path: 第四部分第二章
    topics: [复审, 修改]

  - path: 第四部分第二章4.1
    topics: [复审, 驳回理由, 证据]
    text: |-
      在复审程序中，合议组一般仅针对驳回决定所依据的理由和证据进行审查。
      除驳回决定所依据的理由和证据外，合议组发现申请中存在下列缺陷的，可以对与之相关的理由及其证据进行审查：
      （1）不符合专利法实施细则第十一条的规定。
      （2）足以用在驳回决定作出前已告知过申请人的其他理由及其证据予以驳回的缺陷。
      （3）与驳回决定所指出缺陷性质相同的缺陷。
      例如，驳回决定指出权利要求1 因存在含义不确定的用语导致保护范围不清楚。当其他权利要求同样因存在此类用语而导致保护范围不清楚时，合议组在复审程序中一并指出上述缺陷。
      又如，驳回决定指出权利要求1 相对于对比文件1 和公知常识不具备创造性。当从属权利要求2-6 进一步限定的附加技术特征也属于公知常识，且权利要求1-6 均不具备创造性时，合议组一并指出权利要求1-6 相对于对比文件1 和公知常识不符合专利法第二十二条第三款的规定。
      （4）驳回决定未指出的其他明显实质性缺陷。
      例如，驳回决定指出权利要求1 不具备创造性。当该权利要求请求保护的明显是永动机时，合议组指出该权利要求不符合专利法第二十二条第四款的规定。
      又如，驳回决定指出权利要求1 对技术方案的某处限定导致其工作原理不清楚，不符合专利法第二十六条第四款的规定。当上述问题的根源在于说明书缺乏解决技术问题的技术手段时，合议组指出本申请不符合专利法第二十六条第三款的规定。
      再如，驳回决定指出权利要求1 不具备创造性。当权利要求1 保护范围不清楚影响到创造性审查对区别特征的准确认定时，合议组指出权利要求1 不符合专利法第二十六条第四款的规定。
      除上述情形（1）至（4）外，对于与驳回决定指出缺陷相关的证据，合议组可以适度调整其使用方式，例如，在驳回决定依据的证据基础上变更最接近的现有技术或缺省其中的某份证据。
      在合议审查中，合议组可以引入所属技术领域的公知常识，或者补入相应的技术辞典、技术手册、教科书等所属技术领域中的公知常识性证据。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第四部分第二章4.2
    topics: [复审, 修改, 驳回决定指出的缺陷]
    text: |-
      在提出复审请求、答复复审通知书（包括复审请求口头审理通知书）或者参加口头审理时，复审请求人可以对申请文件进行修改。但是，所作修改应当符合专利法第三十三条和专利法实施细则第六十六条的规定。
      根据专利法实施细则第六十六条的规定，复审请求人对申请文件的修改应当仅限于消除驳回决定或者合议组指出的缺陷。下列情形通常不符合上述规定：
      （1）修改后的权利要求相对于驳回决定针对的权利要求扩大了保护范围。
      （2）将与驳回决定针对的权利要求所限定的技术方案缺乏单一性的技术方案作为修改后的权利要求。
      （3）改变权利要求的类型或者增加权利要求。
      （4）针对驳回决定指出的缺陷未涉及的权利要求或者说明书进行修改。但修改明显文字错误，或者修改与驳回决定所指出缺陷性质相同的缺陷的情形除外。
      在复审程序中，复审请求人提交的申请文件不符合专利法实施细则第六十六条规定的，合议组一般不予接受，并应当在复审通知书中说明该修改文本不能被接受的理由，同时对之前可接受的文本进行审查。如果修改文本中的部分内容符合专利法实施细则第六十六条的规定，合议组可以对该部分内容提出审查意见，并告知复审请求人应当对该文本中不符合专利法实施细则第六十六条规定的部分进行修改，并提交符合规定的文本，否则合议组将以之前可接受的文本为基础进行审查。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第四部分第三章2.1
    topics: [一事不再理]
    text: |-
      对已作出审查决定的无效宣告案件涉及的专利权，以同样的理由和证据再次提出无效宣告请求的，不予受理和审理。
      如果再次提出的无效宣告请求的理由（简称无效宣告理由）或者证据因时限等原因未被在先的无效宣告请求审查决定所考虑，则该请求不属于上述不予受理和审理的情形。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）；该节已被 2026 年版《专利审查指南》（2026-01-01 施行）修改，本节文本是修改前文本'
    verifiedOn: 2026-11-08

  - path: 第四部分第三章3.3
    topics: [无效宣告, 审查范围, 理由, 证据]
    text: |-
      （1）无效宣告请求书中应当明确无效宣告请求范围，未明确的，复审和无效审理部应当通知请求人在指定期限内补正；期满未补正的，无效宣告请求视为未提出。
      （2）无效宣告理由仅限于专利法实施细则第六十九条第二款规定的理由，并且应当以专利法及其实施细则中有关的条、款、项作为独立的理由提出。无效宣告理由不属于专利法实施细则第六十九条第二款规定的理由的，不予受理。
      （3）在复审和无效审理部就一项专利权已作出无效宣告请求审查决定后，又以同样的理由和证据提出无效宣告请求的，不予受理，但所述理由或者证据因时限等原因未被所述决定考虑的情形除外。
      （4）以授予专利权的外观设计与他人在申请日以前已经取得的合法权利相冲突为理由请求宣告外观设计专利权无效，但是未提交证明权利冲突的证据的，不予受理。
      （5）请求人应当具体说明无效宣告理由，提交有证据的，应当结合提交的所有证据具体说明。对于发明或者实用新型专利需要进行技术方案对比的，应当具体描述涉案专利和对比文件中相关的技术方案，并进行比较分析；对于外观设计专利需要进行对比的，应当具体描述涉案专利和对比文件中相关的图片或者照片表示的产品外观设计，并进行比较分析。例如，请求人针对专利法第二十二条第三款的无效宣告理由提交多篇对比文件的，应当指明与请求宣告无效的专利最接近的对比文件以及单独对比还是结合对比的对比方式，具体描述涉案专利和对比文件的技术方案，并进行比较分析。如果是结合对比，存在两种或者两种以上结合方式的，应当首先将最主要的结合方式进行比较分析。未明确最主要结合方式的，则默认第一组对比文件的结合方式为最主要结合方式。对于不同的独立权利要求，可以分别指明最接近的对比文件。
      请求人未具体说明无效宣告理由的，或者提交有证据但未结合提交的所有证据具体说明无效宣告理由的，或者未指明每项理由所依据的证据的，其无效宣告请求不予受理。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）；该节已被 2026 年版《专利审查指南》（2026-01-01 施行）修改，本节文本是修改前文本'
    verifiedOn: 2026-11-08

  - path: 第四部分第三章4.1
    topics: [无效宣告, 审查范围]
    text: |-
      在无效宣告程序中，合议组通常仅针对当事人提出的无效宣告请求的范围、理由和提交的证据进行审查，必要时可以对专利权存在其他明显违反专利法及其实施细则有关规定的情形进行审查，但不承担全面审查专利有效性的义务。
      请求人在提出无效宣告请求时没有具体说明的无效宣告理由以及没有用于具体说明相关无效宣告理由的证据，且在提出无效宣告请求之日起一个月内也未补充具体说明的，合议组不予考虑。
      请求人增加无效宣告理由不符合本章第4.2 节或者补充证据不符合本章第4.3 节规定的，专利权人提交或者补充证据不符合本章第4.3 节规定的，合议组不予考虑。
      合议组在下列情形可以依职权进行审查：
      （1）专利权的取得明显违背诚实信用原则的，合议组可以引入专利法实施细则第十一条的无效宣告理由进行审查。
      （2）请求人提出的无效宣告理由明显与其提交的证据不相对应的，合议组可以告知其有关法律规定的含义，允许其变更或者依职权变更为相对应的无效宣告理由。例如，请求人提交的证据为同一专利权人在专利申请日前申请并在专利申请日后公开的中国发明专利文件，而无效宣告理由为不符合专利法第九条第一款的，合议组可以告知请求人专利法第九条第一款和第二十二条第二款的含义，允许其将无效宣告理由变更为该专利不符合专利法第二十二条第二款，或者依职权将无效宣告理由变更为该专利不符合专利法第二十二条第二款。
      （3）专利权存在请求人未提及的明显不属于专利保护客体的缺陷，合议组可以引入相关的无效宣告理由进行审查。
      （4）专利权存在请求人未提及的缺陷而导致无法针对请求人提出的无效宣告理由进行审查的，合议组可以依职权针对专利权的上述缺陷引入相关无效宣告理由并进行审查。例如，无效宣告理由为独立权利要求1 不具备创造性，但该权利要求因不清楚而无法确定其保护范围，从而不存在审查创造性的基础的情形下，合议组可以引入涉及专利法第二十六条第四款的无效宣告理由并进行审查。
      （5）请求人请求宣告权利要求之间存在引用关系的某些权利要求无效，而未以同样的理由请求宣告其他权利要求无效，不引入该无效宣告理由将会得出不合理的审查结论的，合议组可以依职权引入该无效宣告理由对其他权利要求进行审查。例如，请求人以权利要求1 不具备新颖性、从属权利要求2 不具备创造性为由请求宣告专利权无效，如果合议组认定权利要求1 具备新颖性，而从属权利要求2 不具备创造性，则可以依职权对权利要求1 的创造性进行审查。
      （6）请求人以权利要求之间存在引用关系的某些权利要求存在缺陷为由请求宣告其无效，而未指出其他权利要求也存在相同性质的缺陷，合议组可以引入与该缺陷相对应的无效宣告理由对其他权利要求进行审查。例如，请求人以权利要求1 增加了技术特征而导致其不符合专利法第三十三条的规定为由请求宣告权利要求1 无效，而未指出从属权利要求2 也存在同样的缺陷，合议组可以引入专利法第三十三条的无效宣告理由对从属权利要求2 进行审查。
      （7）请求人以不符合专利法第三十三条或者专利法实施细则第四十九条第一款的规定为由请求宣告专利权无效，且对修改超出原申请文件记载范围的事实进行了具体的分析和说明，但未提交原申请文件的，合议组可以引入该专利的原申请文件作为证据。
      （8）合议组可以依职权认定技术手段是否为公知常识，并可以引入技术词典、技术手册、教科书等所属技术领域中的公知常识性证据。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第四部分第三章4.3.2
    topics: [专利权人举证, 答复期限, 公知常识性证据]
    text: |-
      专利权人应当在指定的答复期限内提交证据，但对于技术词典、技术手册和教科书等所属技术领域中的公知常识性证据或者用于完善证据法定形式的公证文书、原件等证据，可以在口头审理辩论终结前补充。
      专利权人提交或者补充证据的，应当在上述期限内对提交或者补充的证据具体说明。
      专利权人提交的证据是外文的，提交其中文译文的期限适用该证据的举证期限。
      专利权人提交或者补充证据不符合上述期限规定或者未在上述期限内对所提交或者补充的证据具体说明的，合议组不予考虑。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第四部分第三章4.3.3
    topics: [延期举证]
    text: |-
      对于有证据表明因无法克服的困难在本章第4.3.1 节和第4.3.2 节所述期限内不能提交的证据，当事人可以在所述期限内书面请求延期提交。不允许延期提交明显不公平的，应当允许延期提交。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第四部分第三章4.4
    topics: [无效宣告, 审查方式]
    text: |-
      在无效宣告程序中，合议组根据案件的具体情况，可以采取口头审理、书面审理或者口头审理与书面审理相结合的方式进行审查。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第四部分第三章4.4.1
    topics: [文件的转送, 答复期限, 一式两份]
    text: |-
      合议组根据案件审查需要将有关文件转送有关当事人。需要指定答复期限的，该指定答复期限一般为一个月。当事人期满未答复的，视为当事人已得知转送文件中所涉及的事实、理由和证据，并且未提出反对意见。
      当事人提交的意见陈述书及其附件应当一式两份。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第四部分第三章4.6.1
    topics: [修改原则, 权利要求书]
    text: |-
      发明或者实用新型专利文件的修改仅限于权利要求书，且应当针对无效宣告理由或者合议组指出的缺陷进行修改，其原则是：
      （1）不得改变原权利要求的主题名称。
      （2）与授权的权利要求相比，不得扩大原专利的保护范围。
      （3）不得超出原说明书和权利要求书记载的范围。
      （4）一般不得增加未包含在授权的权利要求书中的技术特征。
      外观设计专利的专利权人不得修改其专利文件。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第四部分第三章4.6.2
    topics: [修改方式, 删除, 进一步限定]
    text: |-
      在满足上述修改原则的前提下，修改权利要求书的具体方式一般限于权利要求的删除、技术方案的删除、权利要求的进一步限定、明显错误的修正。
      权利要求的删除是指从权利要求书中去掉某项或者某些项权利要求，例如独立权利要求或者从属权利要求。
      技术方案的删除是指从同一权利要求中并列的两种以上技术方案中删除一种或者一种以上技术方案。
      权利要求的进一步限定是指在权利要求中补入其他权利要求中记载的一个或者多个技术特征，以缩小保护范围。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第四部分第三章4.6.3
    topics: [修改方式的限制, 答复期限]
    text: |-
      在审查决定作出之前，专利权人可以删除权利要求或者权利要求中包括的技术方案。
      仅在下列三种情形的答复期限内，专利权人可以以删除以外的方式修改权利要求书：
      （1）针对无效宣告请求书。
      （2）针对请求人增加的无效宣告理由或者补充的证据。
      （3）针对合议组引入的请求人未提及的无效宣告理由或者证据。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第四部分第八章
    topics: [无效宣告, 证据]

  - path: 第四部分第八章2.2.1
    topics: [外文证据, 中文译文]
    text: |-
      当事人提交外文证据的，应当提交中文译文，未在举证期限内提交中文译文的，该外文证据视为未提交。
      当事人应当以书面方式提交中文译文，未以书面方式提交中文译文的，该中文译文视为未提交。
      当事人可以仅提交外文证据的部分中文译文。该外文证据中没有提交中文译文的部分，不作为证据使用。但当事人应合议组的要求补充提交该外文证据其他部分的中文译文的除外。
      对方当事人对中文译文内容有异议的，应当在指定的期限内对有异议的部分提交中文译文。没有提交中文译文的，视为无异议。
      对中文译文出现异议时，双方当事人就异议部分达成一致意见的，以双方最终认可的中文译文为准。双方当事人未能就异议部分达成一致意见的，必要时，复审和无效审理部可以委托翻译。双方当事人就委托翻译达成协议的，复审和无效审理部可以委托双方当事人认可的翻译单位进行全文、所使用部分或者有异议部分的翻译。双方当事人就委托翻译达不成协议的，复审和无效审理部可以指定专业翻译单位进行翻译，所需翻译费用由双方当事人各承担50%；拒绝指定或者支付翻译费用的，视为其承认对方当事人提交的中文译文正确。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第四部分第八章4.3.3
    topics: [公知常识]
    text: |-
      主张某技术手段是本领域公知常识的当事人，对其主张承担举证责任。该当事人未能举证证明或者未能充分说明该技术手段是本领域公知常识，并且对方当事人不予认可的，合议组对该技术手段是本领域公知常识的主张不予支持。
      当事人可以通过教科书或者技术词典、技术手册等工具书记载的技术内容来证明某项技术手段是本领域的公知常识。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第四部分第八章5.1
    topics: [互联网证据, 公开时间]
    text: |-
      公众能够浏览互联网信息的最早时间为该互联网信息的公开时间，一般以互联网信息的发布时间为准。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第五部分第一章4.2
    topics: [标准表格, 规格]
    text: |-
      说明书、说明书附图、权利要求书、说明书摘要、摘要附图、图片或者照片、简要说明与其他表格用纸的规格均应为297毫米×210 毫米（A4）。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第五部分第六章2.3.1
    topics: [送达日, 电子送达, 推定送达]
    text: |-
      通过邮寄、直接送交的通知和决定，自发文日起满十五日推定为当事人收到通知和决定之日。对于通过邮寄的通知和决定，当事人提供证据能够证明实际收到文件的日期的，以实际收到日为准。
      通过电子形式送达的通知和决定，以进入当事人认可的电子系统的日期为送达日。进入当事人认可的电子系统的日期与通知书和决定的发文日不一致时，除当事人能提供证据外，该通知书和决定的发文日推定为送达日。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第五部分第七章
    topics: [期限, 权利恢复, 中止]

  - path: 第五部分第七章2.1
    topics: [期限, 起算日]
    text: |-
      （1）自申请日、优先权日、授权公告日等固定日期起计算
      大部分法定期限是自申请日、优先权日、授权公告日等固定日期起计算的。例如，专利法第四十二条规定的专利权的期限均自申请日起计算。专利法第二十九条第一款规定要求外国优先权的发明或者实用新型专利申请应当在十二个月内提出，该期限的起算日为在外国第一次提出专利申请之日（优先权日）。
      （2）自通知和决定的送达日起计算
      全部指定期限和部分法定期限自通知和决定的送达日起计算。送达日的相关规定参见本部分第六章第2.3 节。例如，审查员根据专利法第三十七条的规定指定申请人陈述意见或者修改其申请的期限（指定期限）是自审查意见通知书送达申请人之日起计算；专利法实施细则第六十条第一款规定的申请人办理登记手续的期限（法定期限）是自授予专利权通知书送达申请人之日起计算。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第五部分第七章2.3
    topics: [期限, 计算, 顺延]
    text: |-
      期限开始的当日不计算在期限内，自下一日开始计算。期限以年或者月计算的，以其最后一月的相应日（与起算日相对应的日期）为期限届满日；该月无相应日的，以该月最后一日为期限届满日。例如，一件发明专利申请的申请日为1998 年6月1 日，其实质审查请求期限的届满日应当是2001 年6 月1日。又如，专利局于2008 年6 月6 日通过邮寄发出审查意见通知书，指定期限两个月，其推定送达日是2008 年6 月21 日（遇休假日不顺延），则期限届满日应当是2008 年8 月21 日。再如，专利局通过指定的特定电子系统于2022 年12 月31 日发出的通知书，其推定送达日是2022 年12 月31 日，如果该通知书的指定期限为两个月，则期限届满日应当是2023 年2月28 日。
      期限届满日是法定休假日或者移用周休息日的，以法定休假日或者移用周休息日后的第一个工作日为期限届满日，该第一个工作日为周休息日的，期限届满日顺延至星期一。法定休假日包括国务院发布的《全国年节及纪念日放假办法》第二条规定的全体公民放假的节日和《国务院关于职工工作时间的规定》第七条第一款规定的周休息日。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第五部分第七章4.2
    topics: [期限, 延长, 批准]
    text: |-
      延长期限请求由作出相应通知和决定的部门或者流程管理部门进行审批。
      延长的期限不足一个月的，以一个月计算。延长的期限不得超过两个月。对同一通知或者决定中指定的期限一般只允许延长一次。
      延长期限请求不符合规定的，审查员应当发出延长期限审批通知书，并说明不予延长期限的理由；符合规定的，审查员应当发出延长期限审批通知书，在计算机系统中更改该期限的届满日，继续监视该期限。
      国家出现紧急状态或者非常情况时，专利局可以依法延长专利法实施细则规定的期限和专利局指定的期限或者简化当事人应当履行的相关手续，并以公告等形式告知当事人。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08
