  - path: 第五部分第二章1
    title: 费用缴纳的期限
    kind: amended
    oldColumnText: |-
      申请附加费是指申请文件的说明书（包括附图、序列表）
      页数超过30 页或者权利要求超过10 项时需要缴纳的费用，
      该项费用的数额以页数或者项数计算。
    newColumnText: |-
