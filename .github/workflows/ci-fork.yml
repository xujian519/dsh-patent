name: CI (fork free)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

# The fork's lanes run only under this account's repository. The guard names
# the owner rather than the repository: a rename under the same owner would
# otherwise skip every job and leave the required checks unreported.
jobs:
  node-checks:
    if: github.repository_owner == 'xujian519'
    runs-on: ubuntu-latest
    name: node 24 / lint + typecheck + test + docs
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Duplication
        run: pnpm run duplication

      - name: Patent OAS gold gate
        # The gate refuses to pass while the repository carries no recorded
        # baseline, so only a lane that runs it separates a passing regression
        # layer from an absent one. It reads the checked-in gold standard,
        # problem-space DAG, thresholds, and baseline: no key, no build.
        run: pnpm run verify-patent-oas-gold

      - name: Issue management policy
        # The suite asserts this fork's issue and pull-request templates and the
        # structure of the upstream workflows it archives under
        # `workflows-disabled/`; no other lane ran it, so its failures stayed
        # invisible. It pins the repository identity its expected REST paths
        # name itself, because a step's `env:` cannot carry a `GITHUB_*` name.
        # Keyless and unbuilt.
        run: pnpm run test:issue-management

      # Upstream runs these four leaves from `check:ci:static`, which no fork
      # workflow calls, so they reached no lane at all. Each is keyless and reads
      # no built artifact; the required lane carries them like the gates above.
      - name: Self-evolve eval decision
        run: pnpm run verify-self-evolve-eval

      - name: IPC standards source
        # Without the local source library this checks the cards' source paths and
        # reports the payload check as unexecuted.
        run: pnpm run verify-ipc-standards-source

      - name: Package metadata
        run: pnpm run verify-package-meta

      - name: Weighted approval policy
        run: pnpm run test:approval-policy

      - name: Build the native system addon
        # Session V3 persistence flocks the JSONL log through the
        # node-addon-system host addon; the durable-session lanes refuse to
        # start without the built binary, and the fork's vitest invocation
        # bypasses the root `test` script that upstream builds through.
        run: pnpm run build:native-system

      - name: Prepare bubblewrap
        # The workflow lanes pin the Session file policy through real sandbox
        # confinement, and the Linux chain prefers `bwrap` over Landlock
        # (packages/sandbox/sandbox-local). The hosted image restricts
        # unprivileged user namespaces, so upstream's coverage lane provisions
        # the sandbox from the shared script before running tests; this job
        # owns that step instead of inheriting it from another runner.
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Prepare Graphviz and a CJK font
        # The real-render smoke suites skip themselves when their binary is
        # missing, so the AST → SVG chain shipped no CI signal at all: the hosted
        # image carries neither `dot` nor a CJK face, and the suite read green
        # through 5 skips. Installing both makes it run. Every CI Linux lane that
        # runs the suite needs its own copy — this one and node-coverage — and
        # `figure-graphviz-ci-signal.spec.ts` fails wherever `dot` is absent, so
        # a lane that drops the install turns red instead of silent.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz fonts-noto-cjk fontconfig

      - name: Unit tests
        # The free 2-core runner executes the native systemd containment path
        # (probe + scope launch + settle chains) far slower than upstream's
        # pools; upstream's slow lanes raise the same budget via
        # DSH_COVERAGE_TEST_TIMEOUT_MS. A genuine hang still fails at 30s.
        # The JSON report beside the human one feeds the skip gate below.
        # `pnpm test`, not `pnpm exec vitest`: apps/desktop's flock loader rebuilds
        # native/system whenever its host-addon probe fails, and that fallback reads
        # npm_execpath, which only a pnpm script sets. The probe is false on every
        # Linux runner — prebuilds.json declares a static-musl tool and a musl
        # variant that `--host-addon-only` never builds — so the fallback must run.
        # No `--` before the flags. pnpm appends its own separator along with the
        # arguments, so `pnpm test -- --testTimeout=30000` reaches Vitest as
        # `vitest run -- --testTimeout=30000`: the `--` turns every flag into a file
        # filter, the run silently keeps the default 5000ms budget, and the JSON
        # report the skip gate reads is never written.
        run: pnpm test --testTimeout=30000 --hookTimeout=30000 --reporter=default --reporter=json --outputFile=vitest-report.json

      - name: Reject new test skips
        # A skip reads green in the log, so a path this lane can never run — the
        # FreeCAD STEP → TechDraw chain has no non-interactive install — looked
        # covered. The recorded per-platform budget turns a new or widened skip red.
        run: pnpm run verify-test-skips

      - name: Documentation checks
        run: pnpm run test:docs

      - name: Module graph freshness
        # `test:docs` reads documentation format and references but does not
        # regenerate the package graph, so a package addition left
        # `docs/module-graph*.md` stale without failing this lane. The check is
        # keyless and reads workspace manifests only.
        run: pnpm run verify-module-graph

      - name: Client domain layering
        # The gate lived only in `check:all`, which no fork lane runs, so every
        # cross-domain import stayed unreported. It reads client sources and the
        # recorded baseline only: no key, no build.
        run: pnpm run verify-client-domain-graph

  node-cad-render:
    # The FreeCAD and Inkscape smoke suites skip themselves when their executable
    # is missing, so the STEP → TechDraw and SVG → path chains shipped no CI
    # signal: a skipped suite reads green. This lane provisions both renderers
    # and then requires every case to run — `figure-cad-ci-signal.spec.ts` fails
    # if an install disappears, and the skip gate fails if a suite starts
    # skipping again.
    if: github.repository_owner == 'xujian519'
    runs-on: ubuntu-latest
    name: node 24 / CAD real render
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare FreeCAD and Inkscape
        # Ubuntu's FreeCAD package predates the 1.1 API the renderer uses, so the
        # script extracts the pinned AppImage instead of mounting it.
        run: bash scripts/prepare-ci-cad.sh

      - name: Real CAD render suites
        # DSH_CAD_CI_SIGNAL scopes `figure-cad-ci-signal.spec.ts` to this lane;
        # the unit and coverage lanes install neither renderer and stay green.
        env:
          DSH_CAD_CI_SIGNAL: '1'
        run: >-
          pnpm exec vitest run
          packages/patent/patent-tools/tests/figure-freecad-real-render.spec.ts
          packages/patent/patent-tools/tests/figure-inkscape-real-render.spec.ts
          packages/patent/patent-tools/tests/figure-cad-ci-signal.spec.ts
          --reporter=default --reporter=json --outputFile=cad-report.json

      - name: Reject skipped CAD suites
        run: pnpm run verify-test-skips --report cad-report.json --require-zero

  node-built-suites:
    # The unit lane deliberately runs an unbuilt tree, so every suite that needs a
    # `pnpm run build` product self-skipped: the published entry paths (built bin,
    # built lib, packed tarball, bundle split) shipped no signal on any PR. This
    # lane builds first and runs exactly the suites `scripts/built-artifact-suites.ts`
    # discovers, printing each one's executed pass count and a ::warning:: for a
    # suite that still ran nothing. `scripts/ci-workflow.spec.ts` asserts this job
    # builds before it runs them and that the unit and coverage lanes stay unbuilt.
    if: github.repository_owner == 'xujian519'
    runs-on: ubuntu-latest
    name: node 24 / built artifacts
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the native system addon
        # The built CLI suites launch the shipped profile, which flocks its log
        # through the node-addon-system host addon.
        run: pnpm run build:native-system

      - name: Build
        run: pnpm run build

      - name: Prepare bubblewrap
        # The built CLI and packed-install suites reach the real sandbox
        # confinement path, which the hosted image cannot provision by itself.
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Run the built-artifact unit and expected-output suites
        run: pnpm run test:built -- --family spec,expected

      - name: Run the built-artifact e2e suites
        # These belong to the real-API e2e config, which the fork does not run.
        # Running them here gives the built entry paths a first signal while the
        # defects only this lane can see (apps/cli/tests/built-bin.e2e.ts reports
        # a pinned dependency on stderr and a headless profile that still carries
        # host layers) stay non-blocking until they are fixed.
        continue-on-error: true
        run: pnpm run test:built -- --family e2e

  node-snapshots:
    # The recorded-session lane replays committed transcripts through shipped
    # profiles and compares the assembled request headers, system prompts, and
    # persisted logs. No lane invoked it, so its pinned expectations drifted to
    # 83 failing cases of 190 before they were refreshed. PR-only, as upstream's
    # artifacts lane is: a pull request gates its own merge.
    if: github.event_name == 'pull_request' && github.repository_owner == 'xujian519'
    runs-on: ubuntu-latest
    name: node 24 / snapshots
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bubblewrap
        # Scenario profiles reach the real sandbox confinement path, and the
        # Linux chain prefers `bwrap` over Landlock; the hosted image restricts
        # unprivileged user namespaces.
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Build
        # The lane boots the shipped profiles from `lib/`, and `pnpm run build`
        # also builds the native system addon the Session log flocks through.
        run: pnpm run build

      - name: Recorded-session snapshots
        # Both filters are load-bearing. `snapshots` keeps the lane off
        # `apps/web/tests/**/*.snapshot.ts`, which `DSH_EXAMPLE_MODE=lib` would
        # otherwise collect and whose browser goldens and Playwright provisioning
        # belong to the Web lane; the corpus policy file sits under `scripts/`, so
        # a `snapshots` filter alone would drop the ownership, pin, and
        # redaction checks that read the same tree.
        env:
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:snapshot snapshots scripts/session-snapshot-corpus.corpus.ts

  node-web-snapshots:
    # The assembled Web drivers boot the real host and the shipped client
    # bundles, then compare ARIA goldens. `node-snapshots` filters its lane off
    # these files by name because they need a browser and a built
    # `apps/web/dist`, so nothing ran them at all, and `minimal-preset`'s
    # golden had drifted three tabs behind the bundle that renders them — the
    # fork's own `ui-patent-teams` and `ui-document-studio` tabs, mounted by
    # `packages/bundle/web-app/cordis.patch.yml`.
    #
    # The `snapshot` filter selects the four assembled drivers and nothing
    # else. The lane's remaining 158 files stay out: 67 of them fail on master
    # (103 cases) against goldens that predate the same added client plugins,
    # so gating a merge on them would only move that red into CI. Lifting them
    # is its own repair, registered in docs/TECH_DEBT.md.
    if: github.event_name == 'pull_request' && github.repository_owner == 'xujian519'
    runs-on: ubuntu-latest
    name: node 24 / web snapshots
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the driver browser
        # `--with-deps` owns the shared libraries a hosted image does not ship.
        # Only the drivers that open a browser do so: Chromium, never WebKit.
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Prepare bubblewrap
        # `minimal-preset` executes the `bash` tool through the same
        # confinement chain the snapshot lane reaches; the Linux chain prefers
        # `bwrap` over Landlock, and the hosted image restricts unprivileged
        # user namespaces.
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Build
        # The drivers serve the shipped client bundles from `apps/web/dist`,
        # which `build:web` writes inside this aggregate.
        run: pnpm run build

      - name: Assembled Web snapshots
        # Replay compares the committed goldens; CI never runs in `record` or
        # `refresh` mode, so a stale golden fails here instead of silently
        # rewriting itself on the runner and then passing.
        env:
          DSH_SNAPSHOT: 'replay'
        run: pnpm run test:web:built snapshot

  node-hygiene:
    if: github.repository_owner == 'xujian519'
    runs-on: ubuntu-latest
    name: node 24 / hygiene
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # This job owns its build. The hygiene aggregate's publint,
        # built-package-invariants, and node-next-types gates read emitted
        # lib/ artifacts, so without one they inspect an empty publication
        # view and pass vacuously. A separate job keeps the unbuilt-tree
        # precondition the unit lane runs under, which the lib-consuming
        # suites (webworker-packer image-loadable, client ui-trajectory
        # client-bundle) depend on to self-skip.
        run: pnpm run build

      - name: Hygiene gates
        # Upstream CI never runs this aggregate; it is the local developer
        # gate. A manifest `files` field out of step with the constraints
        # table therefore reaches master unnoticed, because the node-checks
        # lane covers lint, typecheck, and tests but none of these.
        run: pnpm run hygiene

  node-coverage:
    if: github.event_name == 'pull_request' && github.repository_owner == 'xujian519'
    runs-on: ubuntu-latest
    name: node 24 / coverage
    timeout-minutes: 180
    env:
      # Four partitions, as upstream uses. With DSH_COVERAGE_PARTITIONS set
      # they replace the instrumented share of DSH_COVERAGE_MAX_WORKERS, which
      # then sizes only the exempt-heavy gate: 2 gives it one worker where
      # upstream's 6 gives two, so the lane runs five Vitest processes on this
      # job's four cores. What has failed here so far are fixture budgets, not
      # thresholds — a case whose ceiling assumed a machine several times
      # faster than this runner, and a fixture row resolving a workspace
      # package name to a built lib/ that no lane on a clean tree has. Both
      # sizes and the rule behind them are recorded in
      # .agents/notes/implemented/process/2026-09-19-fork-ci-hygiene-and-coverage-gates.md.
      DSH_COVERAGE_PARTITIONS: '4'
      DSH_COVERAGE_MAX_WORKERS: '2'
      # The same budget the unit lane grants: managed-scope teardown cases in
      # subprocess-local and bash-sandbox run past the default 5000ms once
      # partitions, workers, and sibling gates share one host.
      DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'
      # A failed gate aborts the sibling instrumented run instead of waiting
      # out its multi-minute remainder.
      DSH_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bubblewrap
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Prepare Graphviz and a CJK font
        # This lane runs the same suite as node-checks, and the render signal's
        # presence gate fails wherever the binary is missing; the rationale for
        # the package list is on that lane's step.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz fonts-noto-cjk fontconfig

      - name: Coverage
        # No build: workspace imports resolve to src through the tsconfig
        # paths map, and the aggregate builds the native system addon it
        # needs before the instrumented run. The Loader's own entry-module
        # import does not travel that map — it resolves a row's specifier
        # through Node — so a preset fixture must name a file, never a
        # workspace package whose exports point at an unbuilt lib/.
        run: pnpm run check:ci:coverage

  benchmarks:
    # Wall-clock budgets need an otherwise idle runner, so the lane runs alone
    # instead of joining a concurrent gate aggregate. The fork had no performance
    # signal at all: the upstream workflow that defined this job is archived under
    # workflows-disabled/, while docs/testing.md still described the lane as a
    # required PR gate. `scripts/ci-workflow.spec.ts` asserts this job's shape
    # against this file, not against the archived copy.
    if: github.event_name == 'pull_request' && github.repository_owner == 'xujian519'
    runs-on: ubuntu-latest
    name: node 24 / benchmarks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the benchmark browser
        run: pnpm --filter @deepseek-ai/dsh-benchmarks exec playwright install --with-deps chromium

      - name: Run performance benchmarks
        env:
          DSH_GATE_VERBOSE: '1'
        run: pnpm run check:ci:bench

  python-checks:
    if: github.repository_owner == 'xujian519'
    runs-on: ubuntu-latest
    name: python 3.10 / keyless SDK
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.23

      - name: Run keyless Python suite
        run: uv run --python 3.10 --group test --project python/sdk pytest
