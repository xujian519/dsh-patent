    newColumnText: |-
      在本节中，术语“生物材料”是指任何带有遗传信息并能
      够自我复制或者能够在生物系统中被复制的材料，如基因、
      质粒、微生物、动物和植物等。
      术语“动物”的定义适用本部分第一章第4.4 节的
      规定。术语“植物”是指可以借助光合作用，以水、二氧化碳
      和无机盐等无机物合成碳水化合物、蛋白质来维系生存，并
      通常不发生移动的生物。其中所述的动物和植物可以是动物
      和植物的各级分类单位，如界、门、纲、目、科、属和种等。

  - path: 第二部分第十章9.1.2.3
    title: 动物和植物个体及其组成部分
    kind: amended
    oldColumnText: |-
      动物的体细胞以及动物组织和器官（除胚胎以外）不符
      合本部分第一章第4.4 节所述的“动物”的定义，因此不属于
      专利法第二十五条第一款第（四）项规定的范畴。
      可以借助光合作用，以水、二氧化碳和无机盐等无机物
      合成碳水化合物、蛋白质来维系生存的植物的单个植株及其
      繁殖材料（如种子等），属于本部分第一章第4.4 节所述的“植
      物品种”的范畴，根据专利法第二十五条第一款第（四）项规
      定，不能被授予专利权。
      植物的细胞、组织和器官如果不具有上述特性，则其不
      能被认为是“植物品种”，因此不属于专利法第二十五条第一
      款第（四）项规定的范畴。
    newColumnText: |-
      动物的体细胞以及动物组织和器官（除胚胎以外）不符
      合本部分第一章第4.4 节所述的“动物”的定义，因此不属于
      专利法第二十五条第一款第（四）项规定的范畴。
      人们从自然界找到的、未经技术处理的、天然存在的野
      生植物属于专利法第二十五条第一款第（一）项规定的科学
      发现，不能被授予专利权。但是，当野生植物经过人工选育
      或者改良，且在产业上有利用价值时，该植物本身不属于科
      学发现的范畴。
      根据本部分第一章第4.4 节所述的“植物品种”的定义，
      经过人工选育或对发现的野生植物加以改良而获得的植物及
      其繁殖材料，如果在其群体上不具有一
      致的形态特征和生物学特性或者相对稳定的遗传性状
      ，则其不能被认为是“植物品种”，因此不属于专利法第二
      十五条第一款第（四）项规定的范畴。

