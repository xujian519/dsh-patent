  - article: 2
    topics: ['管理专利工作的部⻔开展专利行政执法,即处理专利侵']
    text: '管理专利工作的部⻔开展专利行政执法,即处理专利侵权纠纷、调解专利纠纷以及查处假冒专利行为,适用本办法。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 3
    topics: [管理专利工作的部⻔处理专利侵权纠纷应当以事实为依]
    text: |-
      管理专利工作的部⻔处理专利侵权纠纷应当以事实为依据、以法律为准绳,遵循公正、及时的原则。
      管理专利工作的部⻔调解专利纠纷,应当遵循自愿、合法的原则,在查明事实、分清是非的基础上,促使当事人相互谅解,达成调解协议。
      管理专利工作的部⻔查处假冒专利行为,应当以事实为依据、以法律为准绳,遵循公正、公开的原则,给予的行政处罚应当与违法行为的事实、性质、情节以及社会危害程度相当。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 4
    topics: ['管理专利工作的部⻔应当加强专利行政执法力量建设,']
    text: |-
      管理专利工作的部⻔应当加强专利行政执法力量建设,严格行政执法人员资格管理,落实行政执法责任制,规范开展专利行政执法。
      专利行政执法人员(以下简称“执法人员”)应当持有国家知识产权局或者省、自治区、直辖市人⺠政府颁发的行政执法证件。执法人员执行公务时应当严肃着装。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 5
    topics: ['对有重大影响的专利侵权纠纷案件、假冒专利案件,国']
    text: |-
      对有重大影响的专利侵权纠纷案件、假冒专利案件,国家知识产权局在必要时可以组织有关管理专利工作的部⻔处理、查处。
      对于行为发生地涉及两个以上省、自治区、直辖市的重大案件,有关省、自治区、直辖市管理专利工作的部⻔可以报请国家知识产权局协调处理或者查处。
      管理专利工作的部⻔开展专利行政执法遇到疑难问题的,国家知识产权局应当给予必要的指导和支持。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 6
    topics: ['管理专利工作的部⻔可以依据本地实际,委托有实际处']
    text: |-
      管理专利工作的部⻔可以依据本地实际,委托有实际处理能力的市、县级人⺠政府设立的专利管理部⻔查处假冒专利行为、调解专利纠纷。
      委托方应当对受托方查处假冒专利和调解专利纠纷的行为进行监督和指导,并承担法律责任。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 7
    topics: [管理专利工作的部⻔指派的执法人员与当事人有直接利]
    text: |-
      管理专利工作的部⻔指派的执法人员与当事人有直接利害关系的,应当回避,当事人有权申请其回避。当事人申请回避的,应当说明理由。
      执法人员的回避,由管理专利工作部⻔的负责人决定。是否回避的决定作出前,被申请回避的人员应当暂停参与本案的工作。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 8
    topics: [管理专利工作的部⻔应当加强展会和电子商务领域的行]
    text: '管理专利工作的部⻔应当加强展会和电子商务领域的行政执法,快速调解、处理展会期间和电子商务平台上的专利侵权纠纷,及时查处假冒专利行为。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 9
    topics: [管理专利工作的部⻔应当加强行政执法信息化建设和信]
    text: '管理专利工作的部⻔应当加强行政执法信息化建设和信息共享。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 10
    topics: ['请求管理专利工作的部⻔处理专利侵权纠纷的,应当符']
    text: |-
      请求管理专利工作的部⻔处理专利侵权纠纷的,应当符合下列条件:
      (一)请求人是专利权人或者利害关系人;
      (二)有明确的被请求人;
      (三)有明确的请求事项和具体事实、理由;
      (四)属于受案管理专利工作的部⻔的受案和管辖范围;
      (五)当事人没有就该专利侵权纠纷向人⺠法院起诉。
      第一项所称利害关系人包括专利实施许可合同的被许可人、专利权人的合法继承人。专利实施许可合同的被许可人中,独占实施许可合同的被许可人可以单独提出请求;排他实施许可合同的被许可人在专利权人不请求的情况下,可以单独提出请求;除合同另有约定外,普通实施许可合同的被许可人不能单独提出请求。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 11
    topics: ['请求管理专利工作的部⻔处理专利侵权纠纷的,应当提']
    text: |-
      请求管理专利工作的部⻔处理专利侵权纠纷的,应当提交请求书及下列证明材料:
      (一)主体资格证明,即个人应当提交居⺠身份证或者其他有效身份证件,单位应当提交有效的营业执照或者其他主体资格证明文件副本及法定代表人或者主要负责人的身份证明;
      (二)专利权有效的证明,即专利登记簿副本,或者专利证书和当年缴纳专利年费的收据。
      专利侵权纠纷涉及实用新型或者外观设计专利的,管理专利工作的部⻔可以要求请求人出具由国家知识产权局作出的专利权评价报告(实用新型专利检索报告)。
      请求人应当按照被请求人的数量提供请求书副本及有关证据。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 12
    topics: [请求书应当记载以下内容]
    text: |-
      请求书应当记载以下内容:
      (一)请求人的姓名或者名称、地址,法定代表人或者主要负责人的姓名、职务,委托代理人的,代理人的姓名和代理机构的名称、地址;
      (二)被请求人的姓名或者名称、地址;
      (三)请求处理的事项以及事实和理由。
      有关证据和证明材料可以以请求书附件的形式提交。
      请求书应当由请求人签名或者盖章。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 13
    topics: ['请求符合本办法第十条规定条件的,管理专利工作的部']
    text: '请求符合本办法第十条规定条件的,管理专利工作的部⻔应当在收到请求书之日起5个工作日内立案并通知请求人,同时指定3名或者3名以上单数执法人员处理该专利侵权纠纷;请求不符合本办法第十条规定条件的,管理专利工作的部⻔应当在收到请求书之日起5个工作日内通知请求人不予受理,并说明理由。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 14
    topics: [管理专利工作的部⻔应当在立案之日起5个工作日内将]
    text: |-
      管理专利工作的部⻔应当在立案之日起5个工作日内将请求书及其附件的副本送达被请求人,要求其在收到之日起15日内提交答辩书并按照请求人的数量提供答辩书副本。被请求人逾期不提交答辩书的,不影响管理专利工作的部⻔进行处理。
      被请求人提交答辩书的,管理专利工作的部⻔应当在收到之日起5个工作日内将答辩书副本送达请求人。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 15
    topics: ['管理专利工作的部⻔处理专利侵权纠纷案件时,可以根']
    text: '管理专利工作的部⻔处理专利侵权纠纷案件时,可以根据当事人的意愿进行调解。双方当事人达成一致的,由管理专利工作的部⻔制作调解协议书,加盖其公章,并由双方当事人签名或者盖章。调解不成的,应当及时作出处理决定。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 16
    topics: ['管理专利工作的部⻔处理专利侵权纠纷,可以根据案情']
    text: '管理专利工作的部⻔处理专利侵权纠纷,可以根据案情需要决定是否进行口头审理。管理专利工作的部⻔决定进行口头审理的,应当至少在口头审理3个工作日前将口头审理的时间、地点通知当事人。当事人无正当理由拒不参加的,或者未经允许中途退出的,对请求人按撤回请求处理,对被请求人按缺席处理。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 17
    topics: ['管理专利工作的部⻔举行口头审理的,应当将口头审理']
    text: '管理专利工作的部⻔举行口头审理的,应当将口头审理的参加人和审理要点记入笔录,经核对无误后,由执法人员和参加人签名或者盖章。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 18
    topics: [专利法第五十九条第一款所称的“发明或者实用新型专]
    text: '专利法第五十九条第一款所称的“发明或者实用新型专利权的保护范围以其权利要求的内容为准”,是指专利权的保护范围应当以其权利要求记载的技术特征所确定的范围为准,也包括与记载的技术特征相等同的特征所确定的范围。等同特征是指与记载的技术特征以基本相同的手段,实现基本相同的功能,达到基本相同的效果,并且所属领域的普通技术人员无需经过创造性劳动就能够联想到的特征。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 19
    topics: ['除达成调解协议或者请求人撤回请求之外,管理专利工']
    text: |-
      除达成调解协议或者请求人撤回请求之外,管理专利工作的部⻔处理专利侵权纠纷应当制作处理决定书,写明以下内容:
      (一)当事人的姓名或者名称、地址;
      (二)当事人陈述的事实和理由;
      (三)认定侵权行为是否成立的理由和依据;
      (四)处理决定认定侵权行为成立并需要责令侵权人立即停止侵权行为的,应当明确写明责令被请求人立即停止的侵权行为的类型、对象和范围;认定侵权行为不成立的,应当驳回请求人的请求;
      (五)不服处理决定提起行政诉讼的途径和期限。
      处理决定书应当加盖管理专利工作的部⻔的公章。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 20
    topics: [管理专利工作的部⻔或者人⺠法院作出认定侵权成立并]
    text: '管理专利工作的部⻔或者人⺠法院作出认定侵权成立并责令侵权人立即停止侵权行为的处理决定或者判决之后,被请求人就同一专利权再次作出相同类型的侵权行为,专利权人或者利害关系人请求处理的,管理专利工作的部⻔可以直接作出责令立即停止侵权行为的处理决定。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 21
    topics: ['管理专利工作的部⻔处理专利侵权纠纷,应当自立案之']
    text: |-
      管理专利工作的部⻔处理专利侵权纠纷,应当自立案之日起3个月内结案。案件特别复杂需要延⻓期限的,应当由管理专利工作的部⻔负责人批准。经批准延⻓的期限,最多不超过1个月。
      案件处理过程中的公告、鉴定、中止等时间不计入前款所述案件办理期限。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 22
    topics: ['请求管理专利工作的部⻔调解专利纠纷的,应当提交请']
    text: |-
      请求管理专利工作的部⻔调解专利纠纷的,应当提交请求书。
      请求书应当记载以下内容:
      (一)请求人的姓名或者名称、地址,法定代表人或者主要负责人的姓名、职务,委托代理人的,代理人的姓名和代理机构的名称、地址;
      (二)被请求人的姓名或者名称、地址;
      (三)请求调解的具体事项和理由。
      单独请求调解侵犯专利权赔偿数额的,应当提交有关管理专利工作的部⻔作出的认定侵权行为成立的处理决定书副本。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 23
    topics: ['管理专利工作的部⻔收到调解请求书后,应当及时将请']
    text: '管理专利工作的部⻔收到调解请求书后,应当及时将请求书副本通过寄交、直接送交或者其他方式送达被请求人,要求其在收到之日起15日内提交意⻅陈述书。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 24
    topics: ['被请求人提交意⻅陈述书并同意进行调解的,管理专利']
    text: |-
      被请求人提交意⻅陈述书并同意进行调解的,管理专利工作的部⻔应当在收到意⻅陈述书之日起5个工作日内立案,并通知请求人和被请求人进行调解的时间和地点。
      被请求人逾期未提交意⻅陈述书,或者在意⻅陈述书中表示不接受调解的,管理专利工作的部⻔不予立案,并通知请求人。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 25
    topics: [管理专利工作的部⻔调解专利纠纷可以邀请有关单位或]
    text: '管理专利工作的部⻔调解专利纠纷可以邀请有关单位或者个人协助,被邀请的单位或者个人应当协助进行调解。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 26
    topics: ['当事人经调解达成协议的,由管理专利工作的部⻔制作']
    text: '当事人经调解达成协议的,由管理专利工作的部⻔制作调解协议书,加盖其公章,并由双方当事人签名或者盖章;未能达成协议的,管理专利工作的部⻔以撤销案件的方式结案,并通知双方当事人。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 27
    topics: ['因专利申请权或者专利权的归属纠纷请求调解的,当事']
    text: |-
      因专利申请权或者专利权的归属纠纷请求调解的,当事人可以持管理专利工作的部⻔的受理通知书请求国家知识产权局中止该专利申请或者专利权的有关程序。
      经调解达成协议的,当事人应当持调解协议书向国家知识产权局办理恢复手续;达不成协议的,当事人应当持管理专利工作的部⻔出具的撤销案件通知书向国家知识产权局办理恢复手续。自请求中止之日起满1年未请求延⻓中止的,国家知识产权局自行恢复有关程序。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 28
    topics: [管理专利工作的部⻔发现或者接受举报、投诉发现涉嫌]
    text: '管理专利工作的部⻔发现或者接受举报、投诉发现涉嫌假冒专利行为的,应当自发现之日起5个工作日内或者收到举报、投诉之日起10个工作日内立案,并指定两名或者两名以上执法人员进行调查。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 29
    topics: [查处假冒专利行为由行为发生地的管理专利工作的部⻔]
    text: |-
      查处假冒专利行为由行为发生地的管理专利工作的部⻔管辖。
      管理专利工作的部⻔对管辖权发生争议的,由其共同的上级人⺠政府管理专利工作的部⻔指定管辖;无共同上级人⺠政府管理专利工作的部⻔的,由国家知识产权局指定管辖。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 30
    topics: ['管理专利工作的部⻔查封、扣押涉嫌假冒专利产品的,']
    text: |-
      管理专利工作的部⻔查封、扣押涉嫌假冒专利产品的,应当经其负责人批准。查封、扣押时,应当向当事人出具有关通知书。
      管理专利工作的部⻔查封、扣押涉嫌假冒专利产品,应当当场清点,制作笔录和清单,由当事人和执法人员签名或者盖章。当事人拒绝签名或者盖章的,由执法人员在笔录上注明。清单应当交当事人一份。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 31
    topics: ['案件调查终结,经管理专利工作的部⻔负责人批准,根']
    text: |-
      案件调查终结,经管理专利工作的部⻔负责人批准,根据案件情况分别作如下处理:
      (一)假冒专利行为成立应当予以处罚的,依法给予行政处罚;
      (二)假冒专利行为轻微并已及时改正的,免予处罚;
      (三)假冒专利行为不成立的,依法撤销案件;
      (四)涉嫌犯罪的,依法移送公安机关。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 32
    topics: ['管理专利工作的部⻔作出行政处罚决定前,应当告知当']
    text: |-
      管理专利工作的部⻔作出行政处罚决定前,应当告知当事人作出处罚决定的事实、理由和依据,并告知当事人依法享有的权利。
      管理专利工作的部⻔作出较大数额罚款的决定之前,应当告知当事人有要求举行听证的权利。当事人提出听证要求的,应当依法组织听证。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 33
    topics: ['当事人有权进行陈述和申辩,管理专利工作的部⻔不得']
    text: |-
      当事人有权进行陈述和申辩,管理专利工作的部⻔不得因当事人申辩而加重行政处罚。
      管理专利工作的部⻔对当事人提出的事实、理由和证据应当进行核实。当事人提出的事实属实、理由成立的,管理专利工作的部⻔应当予以采纳。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 34
    topics: ['对情节复杂或者重大违法行为给予较重的行政处罚的,']
    text: '对情节复杂或者重大违法行为给予较重的行政处罚的,应当由管理专利工作的部⻔负责人集体讨论决定。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 35
    topics: ['经调查,假冒专利行为成立应当予以处罚的,管理专利']
    text: |-
      经调查,假冒专利行为成立应当予以处罚的,管理专利工作的部⻔应当制作处罚决定书,写明以下内容:
      (一)当事人的姓名或者名称、地址;
      (二)认定假冒专利行为成立的证据、理由和依据;
      (三)处罚的内容以及履行方式;
      (四)不服处罚决定申请行政复议和提起行政诉讼的途径和期限。
      处罚决定书应当加盖管理专利工作的部⻔的公章。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 36
    topics: ['管理专利工作的部⻔查处假冒专利案件,应当自立案之']
    text: |-
      管理专利工作的部⻔查处假冒专利案件,应当自立案之日起1个月内结案。案件特别复杂需要延⻓期限的,应当由管理专利工作的部⻔负责人批准。经批准延⻓的期限,最多不超过15日。
      案件处理过程中听证、公告等时间不计入前款所述案件办理期限。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 37
    topics: ['在专利侵权纠纷处理过程中,当事人因客观原因不能自']
    text: |-
      在专利侵权纠纷处理过程中,当事人因客观原因不能自行收集部分证据的,可以书面请求管理专利工作的部⻔调查取证。管理专利工作的部⻔根据情况决定是否调查收集有关证据。
      在处理专利侵权纠纷、查处假冒专利行为过程中,管理专利工作的部⻔可以根据需要依职权调查收集有关证据。
      执法人员调查收集有关证据时,应当向当事人或者有关人员出示其行政执法证件。当事人和有关人员应当协助、配合,如实反映情况,不得拒绝、阻挠。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 38
    topics: [管理专利工作的部⻔调查收集证据可以查阅、复制与案]
    text: |-
      管理专利工作的部⻔调查收集证据可以查阅、复制与案件有关的合同、账册等有关文件;询问当事人和证人;采用测量、拍照、摄像等方式进行现场勘验。涉嫌侵犯制造方法专利权的,管理专利工作的部⻔可以要求被调查人进行现场演示。
      管理专利工作的部⻔调查收集证据应当制作笔录。笔录应当由执法人员、被调查的单位或者个人签名或者盖章。被调查的单位或者个人拒绝签名或者盖章的,由执法人员在笔录上注明。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 39
    topics: [管理专利工作的部⻔调查收集证据可以采取抽样取证的]
    text: |-
      管理专利工作的部⻔调查收集证据可以采取抽样取证的方式。
      涉及产品专利的,可以从涉嫌侵权的产品中抽取一部分作为样品;涉及方法专利的,可以从涉嫌依照该方法直接获得的产品中抽取一部分作为样品。被抽取样品的数量应当以能够证明事实为限。
      管理专利工作的部⻔进行抽样取证应当制作笔录和清单,写明被抽取样品的名称、特征、数量以及保存地点,由执法人员、被调查的单位或者个人签字或者盖章。被调查的单位或者个人拒绝签名或者盖章的,由执法人员在笔录上注明。
      清单应当交被调查人一份。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 40
    topics: ['在证据可能灭失或者以后难以取得,又无法进行抽样取']
    text: |-
      在证据可能灭失或者以后难以取得,又无法进行抽样取证的情况下,管理专利工作的部⻔可以进行登记保存,并在7日内作出决定。
      经登记保存的证据,被调查的单位或者个人不得销毁或者转移。
      管理专利工作的部⻔进行登记保存应当制作笔录和清单,写明被登记保存证据的名称、特征、数量以及保存地点,由执法人员、被调查的单位或者个人签名或者盖章。被调查的单位或者个人拒绝签名或者盖章的,由执法人员在笔录上注明。清单应当交被调查人一份。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 41
    topics: [管理专利工作的部⻔需要委托其他管理专利工作的部⻔]
    text: '管理专利工作的部⻔需要委托其他管理专利工作的部⻔协助调查收集证据的,应当提出明确的要求。接受委托的部⻔应当及时、认真地协助调查收集证据,并尽快回复。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 42
    topics: ['海关对被扣留的侵权嫌疑货物进行调查,请求管理专利']
    text: |-
      海关对被扣留的侵权嫌疑货物进行调查,请求管理专利工作的部⻔提供协助的,管理专利工作的部⻔应当依法予以协助。
      管理专利工作的部⻔处理涉及进出口货物的专利案件的,可以请求海关提供协助。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 43
    topics: ['管理专利工作的部⻔认定专利侵权行为成立,作出处理']
    text: |-
      管理专利工作的部⻔认定专利侵权行为成立,作出处理决定,责令侵权人立即停止侵权行为的,应当采取下列制止侵权行为的措施:
      (一)侵权人制造专利侵权产品的,责令其立即停止制造行为,销毁制造侵权产品的专用设备、模具,并且不得销售、使用尚未售出的侵权产品或者以任何其他形式将其投放市场;侵权产品难以保存的,责令侵权人销毁该产品;
      (二)侵权人未经专利权人许可使用专利方法的,责令侵权人立即停止使用行为,销毁实施专利方法的专用设备、模具,并且不得销售、使用尚未售出的依照专利方法所直接获得的侵权产品或者以任何其他形式将其投放市场;侵权产品难以保存的,责令侵权人销毁该产品;
      (三)侵权人销售专利侵权产品或者依照专利方法直接获得的侵权产品的,责令其立即停止销售行为,并且不得使用尚未售出的侵权产品或者以任何其他形式将其投放市场;尚未售出的侵权产品难以保存的,责令侵权人销毁该产品;
      (四)侵权人许诺销售专利侵权产品或者依照专利方法直接获得的侵权产品的,责令其立即停止许诺销售行为,消除影响,并且不得进行任何实际销售行为;
      (五)侵权人进口专利侵权产品或者依照专利方法直接获得的侵权产品的,责令侵权人立即停止进口行为;侵权产品已经入境的,不得销售、使用该侵权产品或者以任何其他形式将其投放市场;侵权产品难以保存的,责令侵权人销毁该产品;侵权产品尚未入境的,可以将处理决定通知有关海关;
      (六)责令侵权的参展方采取从展会上撤出侵权展品、销毁或者封存相应的宣传材料、更换或者遮盖相应的展板等撤展措施;
      (七)停止侵权行为的其他必要措施。
      管理专利工作的部⻔认定电子商务平台上的专利侵权行为成立,作出处理决定的,应当通知电子商务平台提供者及时对专利侵权产品或者依照专利方法直接获得的侵权产品相关网⻚采取删除、屏蔽或者断开链接等措施。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 44
    topics: [管理专利工作的部⻔作出认定专利侵权行为成立并责令]
    text: |-
      管理专利工作的部⻔作出认定专利侵权行为成立并责令侵权人立即停止侵权行为的处理决定后,被请求人向人⺠法院提起行政诉讼的,在诉讼期间不停止决定的执行。
      侵权人对管理专利工作的部⻔作出的认定侵权行为成立的处理决定期满不起诉又不停止侵权行为的,管理专利工作的部⻔可以申请人⺠法院强制执行。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 45
    topics: ['管理专利工作的部⻔认定假冒专利行为成立的,应当责']
    text: |-
      管理专利工作的部⻔认定假冒专利行为成立的,应当责令行为人采取下列改正措施:
      (一)在未被授予专利权的产品或者其包装上标注专利标识、专利权被宣告无效后或者终止后继续在产品或者其包装上标注专利标识或者未经许可在产品或者产品包装上标注他人的专利号的,立即停止标注行为,消除尚未售出的产品或者其包装上的专利标识;产品上的专利标识难以消除的,销毁该产品或者包装;
      (二)销售第(一)项所述产品的,立即停止销售行为;
      (三)在产品说明书等材料中将未被授予专利权的技术或者设计称为专利技术或者专利设计,将专利申请称为专利,或者未经许可使用他人的专利号,使公众将所涉及的技术或者设计误认为是他人的专利技术或者专利设计的,立即停止发放该材料,销毁尚未发出的材料,并消除影响;
      (四)伪造或者变造专利证书、专利文件或者专利申请文件的,立即停止伪造或者变造行为,销毁伪造或者变造的专利证书、专利文件或者专利申请文件,并消除影响;
      (五)责令假冒专利的参展方采取从展会上撤出假冒专利展品、销毁或者封存相应的宣传材料、更换或者遮盖相应的展板等撤展措施;
      (六)其他必要的改正措施。
      管理专利工作的部⻔认定电子商务平台上的假冒专利行为成立的,应当通知电子商务平台提供者及时对假冒专利产品相关网⻚采取删除、屏蔽或者断开链接等措施。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 46
    topics: [管理专利工作的部⻔作出认定专利侵权行为成立并责令]
    text: '管理专利工作的部⻔作出认定专利侵权行为成立并责令侵权人立即停止侵权行为的决定,或者认定假冒专利行为成立并作出处罚决定的,应当自作出决定之日起20个工作日内予以公开,通过政府网站等途径及时发布执法信息。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 47
    topics: ['管理专利工作的部⻔认定假冒专利行为成立的,可以按']
    text: |-
      管理专利工作的部⻔认定假冒专利行为成立的,可以按照下列方式确定行为人的违法所得:
      (一)销售假冒专利的产品的,以产品销售价格乘以所销售产品的数量作为其违法所得;
      (二)订立假冒专利的合同的,以收取的费用作为其违法所得。
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 48
    topics: ['管理专利工作的部⻔作出处罚决定后,当事人申请行政']
    text: '管理专利工作的部⻔作出处罚决定后,当事人申请行政复议或者向人⺠法院提起行政诉讼的,在行政复议或者诉讼期间不停止决定的执行。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 49
    topics: [假冒专利行为的行为人应当自收到处罚决定书之日起1]
    text: '假冒专利行为的行为人应当自收到处罚决定书之日起15日内,到指定的银行缴纳处罚决定书写明的罚款;到期不缴纳的,每日按罚款数额的百分之三加处罚款。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 50
    topics: ['拒绝、阻碍管理专利工作的部⻔依法执行公务的,由公']
    text: '拒绝、阻碍管理专利工作的部⻔依法执行公务的,由公安机关根据《中华人⺠共和国治安管理处罚法》的规定给予处罚;情节严重构成犯罪的,由司法机关依法追究刑事责任。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 51
    topics: [管理专利工作的部⻔可以通过寄交、直接送交、留置送]
    text: '管理专利工作的部⻔可以通过寄交、直接送交、留置送达、公告送达或者其他方式送达有关法律文书和材料。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 52
    topics: [本办法由国家知识产权局负责解释]
    text: '本办法由国家知识产权局负责解释。'
    sourceDoc: '专利行政执法办法（知识库原件 Markdown）'
