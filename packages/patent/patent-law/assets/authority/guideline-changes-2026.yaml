      【例9】
      一种知识图谱推理方法
      （4）未解决技术问题，或者未利用技术手段，或者
      未获得技术效果的包含算法特征或商业规则和方法特征的发
      明专利申请，不属于专利法第二条第二款规定的技术方案，
      因而不属于专利保护的客体。
      【例10】
      一种消费返利的方法
      【例11】
      一种基于用电特征的经济景气指数分析方法
      【例12】
      一种金融产品的价格预测方法
      （5）在进行创造性审查时，应当考虑与技术特征在
      功能上彼此相互支持、存在相互作用关系的算法特征或商业
      规则和方法特征对技术方案作出的贡献。
      【例13】
      一种基于多传感器信息仿人机器人跌倒状态检测方法
      【例14】
      基于合作协同进化和多种群遗传算法的多机器人路径规
      划系统
      【例15】
      一种物流配送方法
      【例16】
      一种动态观点演变的可视化方法
      【例17】
      一种用于适配神经网络参数的方法
      【例18】
      一种识别船只数量的方法
      申请内容概述
      发明专利申请提出了一种识别船只数量的方法，其获取
      船只图片数据，通过深度学习训练出检测数据模型，解决准
      确识别当前海域内船只数量的技术问题。
      申请的权利要求
      一种识别船只数量的方法，其特征在于，包括：
      获取船只图片数据集，并对数据集中的图片信息进行预
      处理，标记出图片信息中船只的位置和边界信息，并把所述
      数据集划分为训练数据集与测试数据集；
      采用所述训练数据集进行深度学习，构建训练模型；
      基于所述测试数据输入训练模型中训练，以获得船只测
      试结果数据；
      根据所述船只测试结果数据与预设误差参数相乘，以确
      定出实际船只数量。
      分析及结论
      对比文件1 公开了一种识别树上果实数量的方法，并具
      体公开了获取图片信息、标记图片上果实的位置和边界、划
      分数据集、模型训练和确定实际果实数量的步骤。
      发明专利申请的解决方案与对比文件1 的区别仅在于识
      别对象的不同。虽然船只和果实本身在外观、体积和存在环
      境等方面存在差异，但是对于所属技术领域的技术人员而言，
      识别出实际数量所需的信息标记、数据集划分、模型训练等
      步骤，其针对的都是图片上待识别对象的位置关系，权利要
      求中也未体现出因识别对象不同，在深度学习、模型训练过
      程中对训练方式、模型层级等做出的改变，对图片上的船只
      数据进行标记与对图片上的果实数据进行标记以获得用于训
      练的数据集并进行模型训练，没有对深度学习、模型构建或
      者训练过程等做出调整或者改进。因此，要求保护的发明技
      术方案不具备创造性。
      【例19】
      一种建立废钢等级划分神经网络模型的方法
      申请内容概述
      废钢在收储时需要根据钢料的平均尺寸进行等级划分，
      但其存放时杂乱无章、相互堆叠，人工进行尺寸测量和等级
      判定时效率低且等级划分准确率不高。发明专利申请提出一
      种建立废钢等级划分神经网络模型的方法，通过卷积神经网
      络学习形成具有等级分类输出的等级划分神经网络模型，能
      够提高废钢等级划分的效率和准确率。
      申请的权利要求
      一种建立废钢等级划分神经网络模型的方法，所述模型
      用于对收储的废钢进行等级划分，包括：
      获取多个图像，确定多个图像的不同废钢等级，对所述
      图像进行预处理，提取不同等级的图像数据特征，对提取的
      不同等级的图像数据特征进行卷积神经网络学习形成具有等
      级分类输出的等级划分神经网络模型；
      所述图像数据特征的提取是对图像画面像素点矩阵数据
      进行卷积神经网络卷积计算的集合进行提取，包括：对卷积
      层或者卷积层加池化层构成的多条线路的输出集合来实现对
      图像中物体颜色、边缘特征和纹理特征的提取，以及对图像
      中物体边缘、纹理之间关联特征的提取；
      其中，所述对图像中物体颜色、边缘特征的提取由卷积
      层加池化层构成的三条线路的输出集合来实现，包括从左至
      右的第一条线路一层池化层、第二条线路二层卷积层和第三
      条线路四层卷积层；所述对图像中纹理特征的提取是对上述
      图像中物体颜色、边缘特征的提取结果进行集合后，由卷积
      层构成的三条线路的输出集合来实现，包括从左至右的第一
      条线路0 卷积层、第二条线路二层卷积层和第三条线路三层
      卷积层；
      所述对边缘、纹理之间关联特征提取的卷积层计算的线
      路数大于对图像中物体颜色、边缘和纹理特征提取的卷积层
      计算的线路数。
      分析及结论
      对比文件1 为解决再生资源来源复杂、种类多、材质差
      异大，需要准确识别出废钢属于料豆、冲压料余料、面包铁
      或者其他种类以提高再生资源回收利用率的问题，提供了一
      种基于卷积神经网络模型对废钢种类进行识别的方法，并具
      体公开了获取多个已经确定废钢种类的图像数据，对所述图
      像数据进行预处理以进行特征提取，利用卷积神经网络进行
      训练并获得产品模型的相关步骤。
      发明专利申请的解决方案与对比文件1 的区别在于训练
      的数据和提取的特征不同、卷积层和池化层的线路数量和层
      级设置也不同。相对于对比文件1，确定发明实际解决的技
      术问题是如何提升废钢等级划分的准确性。对比文件1 是利
      用已经确定种类的废钢图像数据进行特征提取并进行模型训
      练，发明专利申请为了根据废钢的平均尺寸进行等级划分，
      需要针对杂乱无章、相互叠压的废钢图像识别出废钢的形状、
      厚度，为了提取图像中废钢的颜色、边缘和纹理等特征，在
      模型训练的过程中对卷积层和池化层的线路数量和层级设置
      等均进行了调整，上述算法特征与技术特征功能上彼此相互
      支持、存在相互作用关系，能够提升废钢等级划分的准确性，
      应当考虑所述算法特征对技术方案作出的贡献。上述对卷积
      层和池化层线路数量和层级设置进行调整等内容未被其他对
      比文件公开，也不属于本领域的公知常识，现有技术整体上
      并不存在对上述对比文件1 进行改进以获得发明专利申请的
      技术方案的启示，要求保护的发明技术方案具备创造性。

  - path: 第二部分第九章6.3.1
    title: 说明书的撰写
    kind: amended
    oldColumnText: |-
      包含算法特征或商业规则和方法特征的发明专利申请的
      说明书应当清楚、完整地描述发明为解决其技术问题所采用
      的解决方案。所述解决方案在包含技术特征的基础上，可以
      进一步包含与技术特征功能上彼此相互支持、存在相互作用
      关系的算法特征或商业规则和方法特征。
    newColumnText: |-
      包含算法特征或商业规则和方法特征的发明专利申请的
      说明书应当清楚、完整地描述发明为解决其技术问题所采用
      的解决方案。所述解决方案在包含技术特征的基础上，可以
      进一步包含与技术特征功能上彼此相互支持、存在相互作用
      关系的算法特征或商业规则和方法特征。如果涉及人工智能
      模型的构建或者训练，则一般需要在说明书中清楚记载模型
      必要的模块、层级或者连接关系，训练必需的具体步骤、参
      数等；如果涉及在具体领域或者场景中应用人工智能模型或
      者算法，则一般需要在说明书中清楚记载模型或者算法如何
      与具体领域或者场景相结合，算法或者模型的输入、输出数
      据如何设置以表明其内在关联关系等，使得所属技术领域的
      技术人员按照说明书记载的内容，能够实现该发明的解决方
      案。

