    domain: patent_general
    phase: post_execution
    severity: critical
    action: block
    legalBasis: 专利法第5条；审查指南第二部分第一章3.1.1
    basisKind: statute
    check:
      type: keyword_blocklist
      keywords:
        - 克隆人
        - 人体胚胎
        - 赌博
        - 造假
        - 窃听
        - 毒品
  - id: EX-SEL-005
    name: 不授权—动物和植物品种
    domain: patent_general
    phase: post_execution
    severity: major
    action: warn
    legalBasis: 专利法第25条第1款第(四)项；审查指南第二部分第一章4.4
    basisKind: statute
    check:
      type: structural_analysis
      requiresAll:
        - element: 期望模式
          description: 不授权—动物和植物品种
          patterns:
