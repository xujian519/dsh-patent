  - path: 第二部分第一章3.1.1
    topics: [违反法律, 专利法第五条]
    text: |-
      法律，是指由全国人民代表大会或者全国人民代表大会常务委员会依照立法程序制定和颁布的法律。它不包括行政法规和规章。
      发明创造与法律相违背的，不能被授予专利权。例如，《中华人民共和国刑法》《中华人民共和国治安管理处罚法》《中华人民共和国中国人民银行法》《中华人民共和国票据法》禁止赌博、吸毒、伪造国家货币或票据等相关行为，用于赌博的设备、机器或工具，吸毒的器具，伪造国家货币、票据、公文、证件、印章的设备等都属于违反法律的发明创造，不能被授予专利权。
      发明创造并没有违反法律，但是由于其被滥用而违反法律的，则不属此列。例如，用于医疗的各种毒药、麻醉品、镇静剂、兴奋剂和用于娱乐的棋牌等。
      专利法实施细则第十条规定，专利法第五条所称违反法律的发明创造，不包括仅其实施为法律所禁止的发明创造。其含义是，如果仅仅是发明创造的产品的生产、销售或使用受到法律的限制或约束，则该产品本身及其制造方法并不属于违反法律的发明创造。例如，用于国防的各种武器的生产、销售及使用虽然受到法律的限制，但这些武器本身及其制造方法仍然属于可给予专利保护的客体。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
    verifiedOn: 2026-11-08

  - path: 第二部分第一章4.2
    topics: [智力活动的规则和方法]
    text: |-
      智力活动，是指人的思维运动，它源于人的思维，经过推理、分析和判断产生出抽象的结果，或者必须经过人的思维运动作为媒介，间接地作用于自然产生结果。智力活动的规则和方法是指导人们进行思维、表述、判断和记忆的规则和方法。由于其没有采用技术手段或者利用自然规律，也未解决技术问题和产生技术效果，因而不构成技术方案。它既不符合专利法第二条第二款的规定，又属于专利法第二十五条第一款第（二）项规定的情形。因此，指导人们进行这类活动的规则和方法不能被授予专利权。
      在判断涉及智力活动的规则和方法的专利申请要求保护的主题是否属于可授予专利权的客体时，应当遵循以下原则：
      （1）如果一项权利要求仅仅涉及智力活动的规则和方法，则不应当被授予专利权。
      如果一项权利要求，除其主题名称以外，对其进行限定的全部内容均为智力活动的规则和方法，则该权利要求实质上仅仅涉及智力活动的规则和方法，也不应当被授予专利权。
      【例如】
      审查专利申请的方法；
      组织、生产、商业实施和经济等方面的管理方法及制度；
      交通行车规则、时间调度表、比赛规则；
      演绎、推理和运筹的方法；
      图书分类规则、字典的编排方法、情报检索的方法、专利分类法；
      日历的编排规则和方法；
      仪器和设备的操作说明；
      各种语言的语法、汉字编码方法；
      计算机的语言及计算规则；
      速算法或口诀；
      数学理论和换算方法；
      心理测验方法；
      教学、授课、训练和驯兽的方法；
      各种游戏、娱乐的规则和方法；
      统计、会计和记账的方法；
      乐谱、食谱、棋谱；
      锻炼身体的方法；
      疾病普查的方法和人口统计的方法；
      信息表述方法；
      计算机程序本身。
      （2）除了上述（1）所描述的情形之外，如果一项权利要求在对其进行限定的全部内容中既包含智力活动的规则和方法的内容，又包含技术特征，则该权利要求就整体而言并不是一种智力活动的规则和方法，不应当依据专利法第二十五条排除其获得专利权的可能性。
      【例如】
      涉及商业模式的权利要求，如果既包含商业规则和方法的内容，又包含技术特征，则不应当依据专利法第二十五条排除其获得专利权的可能性。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
