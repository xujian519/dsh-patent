      该项费用的数额以页数或者项数计算。对于符合规定格式提
      交的计算机可读形式序列表，不计算页数。

  - path: 第五部分第二章4.2.1.1
    title: 当事人可以请求退款的情形
    kind: amended
    oldColumnText: |-
      （1）多缴费用的情形：如当事人应当缴纳年费为600
      元，在规定的期限内实际缴纳费用为650 元，可以对多缴的
      50 元提出退款请求。
      （2）重缴费用的情形：如提出一次著录项目变更请求应
      当缴纳著录事项变更费200 元，当事人缴纳200 元后，再次
      缴纳了200 元，当事人可以对再次缴纳的200 元提出退款请
      求。
      （3）错缴费用的情形：如当事人缴费时写错费用种类、
      申请号（或者专利号）的；或者因缴费不足、逾期缴费导致
      权利丧失的，或者权利丧失后缴纳专利费用的，当事人可以
      提出退款请求。
      （4）当事人对于进入实质审查阶段的发明专利申请，在
      第一次审查意见通知书答复期限届满前主动申请撤回的，可
      以请求退还50%的发明专利申请实质审查费，已提交答复意
      见的除外。
    newColumnText: |-
      （1）多缴费用的情形：如当事人应当缴纳年费为600
      元，在规定的期限内实际缴纳费用为650 元，可以对多缴的
      50 元提出退款请求。
      （2）重缴费用的情形：如提出一次著录项目变更请求应
      当缴纳著录事项变更费200 元，当事人缴纳200 元后，再次
      缴纳了200 元，当事人可以对再次缴纳的200 元提出退款请
      求。
      （3）错缴费用的情形：如当事人缴费时写错费用种类、
      申请号（或者专利号）的；或者因缴费不足、逾期缴费导致
      权利丧失的，或者权利丧失后缴纳专利费用的，当事人可以
      提出退款请求。
      （4）在专利局作出发明专利申请进入实质审查阶段通知
      书之前，专利申请已被视为撤回、分案申请已被视为未提出
      或者撤回专利申请的声明已被批准，当事人可以对已缴纳的
      实质审查费提出退款请求。
      （5）当事人对于进入实质审查阶段的发明专利申请，
      在第一次审查意见通知书答复期限届满前主动申请撤回的，
      可以请求退还50%的发明专利申请实质审查费，已提交答复
      意见的除外。
      （6）当事人可以对在专利权终止或者宣告专利权全部无
      效的决定公告后缴纳的年费提出退款请求。
      （7）恢复权利请求审批程序启动后，专利局作出不予恢
      复权利决定的，当事人可以对已缴纳的恢复权利请求费及相
      关费用提出退款请求。

