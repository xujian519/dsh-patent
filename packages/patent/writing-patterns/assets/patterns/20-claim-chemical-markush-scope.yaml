id: "wp-claim-chemical-markush-scope"
name: "马库什通式范围——每个变量都用「选自」闭合定义"
category: "claim_drafting"
summary: "通式中的每个可变基团都用「选自」列出可实施的下位，禁止只写「任选取代」；共同结构必须是对现有技术作出贡献的特定技术特征，否则并列化合物之间缺乏单一性。"
context: "适用于化合物通式、马库什权利要求以及含多个并列下位的产品权利要求。"
keywords: ["化学", "马库什", "通式", "任选取代", "单一性", "26.4"]
source_ref: "专利法第26条第4款；审查指南第二部分第十章"
quality: 0.89
version: 1
steps:
  - order: 1
    name: "闭合定义每个变量"
    instruction: "为 R1、R2、n 等每个变量写「选自」清单，逐一列出基团、取代位置与数量；不要用「任选取代」「取代或未取代」把范围留给读者解释。"
  - order: 2
    name: "检查共同结构的技术贡献"
    instruction: "确认所有并列化合物共有的核心结构相对最接近现有技术作出贡献；若共同结构已是现有技术，则必须共有相应的理化性质或用途。"
  - order: 3
    name: "为每个变量类别配实施例"
    instruction: "每类并列基团至少一个代表性制备例与效果数据；数值范围另给端点实施例，避免只给一个代表例而概括全部下位。"
  - order: 4
    name: "核对单一性与分案"
    instruction: "并列化合物共享同一发明构思才可合案；核心结构不同的，拆分为多个申请或删除不共享构思的下位。"
examples:
  - context: "通式权要"
    text: "一种式（I）所示的化合物，其中 R1 选自氢、C1–C4 烷基、卤素；R2 选自羟基、氨基；n 为 1–4 的整数；说明书分别给出 R1 为甲基、乙基、丙基、丁基的制备例与同一靶点活性数据。"
dos:
  - rule: "每个可变基团都有闭合的「选自」清单"
  - rule: "每个基团类别都有制备例与效果数据"
donts:
  - rule: "不要只写「任选取代」而不列取代基"
  - rule: "不要把共同结构仅属现有技术的多类化合物强行合案"
