  - path: 第二部分第三章5
    topics: [新颖性, 宽限期]
    text: |-
      专利法第二十四条规定，申请专利的发明创造在申请日以前六个月内，有下列情形之一的，不丧失新颖性：
      （一）在国家出现紧急状态或者非常情况时，为公共利益目的首次公开的；
      （二）在中国政府主办或者承认的国际展览会上首次展出的；
      （三）在规定的学术会议或者技术会议上首次发表的；
      （四）他人未经申请人同意而泄露其内容的。
      关于上述四种情形的审查适用本指南第一部分第一章第6.3 节的规定。
      申请专利的发明创造在申请日以前六个月内，发生专利法第二十四条规定的四种情形之一的，该申请不丧失新颖性。即这四种情形不构成影响该申请的现有技术。所说的六个月期限，称为宽限期，或者称为优惠期。
      宽限期和优先权的效力是不同的。宽限期仅仅是把申请人（包括发明人）的某些公开，或者他人从申请人或者发明人那里以合法手段或者不合法手段得来的发明创造的某些公开，认为是不损害该专利申请新颖性和创造性的公开。实际上，发明创造公开以后已经成为现有技术，只是这种公开在一定期限内对申请人的专利申请来说不视为影响其新颖性和创造性的现有技术，并不是把发明创造的公开日看作是专利申请的申请日。所以，从公开之日至提出申请的期间，如果他人独立地作出了同样的发明创造，而且在申请人提出专利申请以前提出了专利申请，那么根据先申请原则，申请人就不能取得专利权。当然，由于申请人（包括发明人）的公开，使该发明创造成为现有技术，故他人的申请没有新颖性，也不能取得专利权。
      发生专利法第二十四条规定的任何一种情形之日起六个月内，申请人提出申请之前，发明创造再次被公开的，只要该公开不属于上述四种情形，则该申请将由于此再次公开而丧失新颖性。再次公开属于上述四种情形的，该申请不会因此而丧失新颖性，但是，宽限期自发明创造的第一次公开之日起计算。在国家出现紧急状态或者非常情况时，为公共利益目的首次公开的发明创造，他人得知后将其再次公开的，视为专利法第二十四条第（一）项所述情形。他人未经申请人同意泄露发明创造的内容，第三人得知该方式公开的发明创造后将其再次公开的，视为专利法第二十四条第（四）项所述情形。
      专利申请有专利法第二十四条第（二）项或者第（三）项所述情形，申请人未按照专利法实施细则第三十三条第三款的规定提出声明和提交证明文件的（参见本指南第一部分第一章第6.3 节），其申请不能享受专利法第二十四条规定的新颖性宽限期。
      专利申请有专利法第二十四条第（一）项或者第（四）项所述情形，申请人在收到专利局的通知书后才得知的，应当在该通知书指定的答复期限内，提出不丧失新颖性宽限期的答复意见并附具证明文件。专利局在必要时也可以要求申请人提交证明文件，证实其发生所述情形的日期及实质内容。
      申请人未按照专利法实施细则第三十三条第四款的规定在指定的期限内提交证明文件的，其申请不能享受专利法第二十四条规定的新颖性宽限期。
      对专利法第二十四条的适用发生争议时，主张该规定效力的一方有责任举证或者作出使人信服的说明。
