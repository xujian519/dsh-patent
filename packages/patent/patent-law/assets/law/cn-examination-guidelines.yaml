  - path: 第二部分第三章3.2
    topics: [新颖性, 审查基准]
    text: |-
      判断发明或者实用新型有无新颖性，应当以专利法第二十二条第二款为基准。
      为有助于掌握该基准，以下给出新颖性判断中几种常见的情形。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
