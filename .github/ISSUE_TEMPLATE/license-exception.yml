---
name: License exception request
description: 请求允许一个不在白名单内的依赖，或覆盖其 concluded license。
title: "[License exception] "
labels: ["legal-mode", "license"]
body:
  - type: markdown
    attributes:
      value: |
        本仓库的完整许可证策略见 [LICENSE_POLICY.md](https://github.com/deepseek-ai/dsh/blob/main/LICENSE_POLICY.md)。白名单只包含 permissive 与弱 copyleft；GPLv1/v2 和 AGPLv3 明确禁止。
  - type: input
    id: package-name
    attributes:
      label: 依赖名称
      description: npm 包名 / Python 模块名 / Rust crate 名
      placeholder: "@some-org/some-package"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 你想引入的版本号
      placeholder: "1.2.3"
    validations:
      required: true
  - type: input
    id: declared-license
    attributes:
      label: Manifest 声明的 license
      description: package.json#license / pyproject.toml / Cargo.toml
      placeholder: "GPL-3.0-only"
  - type: input
    id: observed-license
    attributes:
      label: Shipped LICENSE 文件的真实 license
      description: 若你从 tarball 里看到了实际 LICENSE 文件
      placeholder: "LGPL-3.0-only (GPL-3.0 OR MIT)"
  - type: input
    id: requested-concluded
    attributes:
      label: 你申请的 concluded license
      description: 仓库最终将采用的判定。必须与声明/observed 之一一致或显式解释冲突
      placeholder: "LGPL-3.0-only"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由
      description: 为什么这个依赖不可替代，或为什么它的 license 不会与根项目 MIT 冲突？引用 LICENSE_POLICY.md 的相关章节。
    validations:
      required: true
  - type: input
    id: upstream-source
    attributes:
      label: 上游仓库 / tarball 地址
      description: 让 reviewer 能自己核实 LICENSE 文件
      placeholder: "https://github.com/some-org/some-package"
  - type: dropdown
    id: tier
    attributes:
      label: 进入哪一层
      description: 不同 tier 的风险不一样。runtime 最严，dev/test/build 相对宽松
      options:
        - runtime-npm
        - python-runtime
        - native-runtime
        - dev-npm
        - build-npm
        - test-npm
        - python-test
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 我已确认
      options:
        - label: 我阅读了 LICENSE_POLICY.md 的 §2 和 §3
          required: true
        - label: 我已检查该依赖的 tarball 是否包含 LICENSE 文件
          required: true
        - label: 若获得批准，我会在 scripts/gen-third-party-notices.ts 的 OVERRIDES 里登记 concluded license
          required: true
