# 化学领域规则包 — 马库什通式创造性答辩的论证完整性
# 依据：《专利审查指南》第二部分第十章（马库什权利要求的创造性判断）。
# 适用前提（premise）即语境锚点：不讨论马库什/通式/共同结构的文本不评估，
# 否则任何提到「取代基」的化学文本都会命中 2/3。
# 锚点命中后要求 3/3（2/3 = 0.67 < 0.75）：缺共同结构的区别或取代基效果任一即报。

version: "1.0"

rules:
  # ---------------------------------------------------------------------------
  # 马库什通式创造性论证完整性
  # 主张马库什通式具备创造性时，须说明：共同结构相对最接近现有技术的区别，
  # 以及取代基变化带来的技术效果。只罗列取代基种类而不比较共同结构，
  # 或只主张效果而不指出区别，都不构成完整论证。
  # ---------------------------------------------------------------------------
  chemical_markush_inventiveness:
    id: CHEM-INV-001
    name: 马库什通式创造性论证完整性
    domain: chemical
    description: 主张马库什通式具备创造性时，须给出共同结构的区别与取代基变化的技术效果
    phase: 论证
    severity: minor
    action: warn
    legalBasis: 《专利审查指南》第二部分第十章：马库什权利要求的创造性应考察共同结构相对最接近现有技术的区别，以及取代基变化是否带来预料不到的技术效果
    basisKind: guideline
    premise:
      - 马库什
      - 通式
      - 共同结构
    check:
      type: structural_analysis
      requiresAll:
        - element: 马库什论证语境
          description: 文本处于马库什/通式共同结构的论证上下文（语境锚点）
          patterns:
            - 马库什
            - 通式
            - 共同结构
        - element: 共同结构的区别
          description: 应指明共同结构相对最接近现有技术的区别
          patterns:
            - 区别技术特征
            - 区别特征
            - 未公开
            - 对比文件
        - element: 取代基变化的效果
          description: 应说明取代基变化带来的技术效果
          patterns:
            - 取代基
            - 技术效果
            - 活性
            - 选择性
            - 稳定性
      minConfidence: 0.75
