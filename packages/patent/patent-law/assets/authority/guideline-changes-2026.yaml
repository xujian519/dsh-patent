      提交实质审查请求书并缴纳实质审查费的先后顺序启动实质
      审查；另有规定的除外。
      如果需要，对于技术内容、申请人或发明人相互关联的
      专利申请，可以合并审查。
    newColumnText: |-
      对于发明、实用新型和外观设计专利申请，一般应当按
      照申请提交的先后顺序启动初步审查；对于发明专利申请，
      在符合启动实质审查程序的其他条件前提下，一般应当按照
      提交实质审查请求书并缴纳实质审查费的先后顺序启动实质
