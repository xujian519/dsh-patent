  - path: 第二部分第二章3.1.2
    topics: [独立权利要求, 从属权利要求]
    text: |-
      独立权利要求应当从整体上反映发明或者实用新型的技术方案，记载解决技术问题的必要技术特征。
      必要技术特征是指，发明或者实用新型为解决其技术问题所不可缺少的技术特征，其总和足以构成发明或者实用新型的技术方案，使之区别于背景技术中所述的其他技术方案。
      判断某一技术特征是否为必要技术特征，应当从所要解决的技术问题出发并考虑说明书描述的整体内容，不应简单地将实施例中的技术特征直接认定为必要技术特征。
      在一件专利申请的权利要求书中，独立权利要求所限定的一项发明或者实用新型的保护范围最宽。
      如果一项权利要求包含了另一项同类型权利要求中的所有技术特征，且对该另一项权利要求的技术方案作了进一步的限定，则该权利要求为从属权利要求。由于从属权利要求用附加的技术特征对所引用的权利要求作了进一步的限定，所以其保护范围落在其所引用的权利要求的保护范围之内。
      从属权利要求中的附加技术特征，可以是对所引用的权利要求的技术特征作进一步限定的技术特征，也可以是增加的技术特征。
      一件专利申请的权利要求书中，应当至少有一项独立权利要求。当有两项或者两项以上独立权利要求时，写在最前面的独立权利要求被称为第一独立权利要求，其他独立权利要求称为并列独立权利要求。审查员应当注意，有时并列独立权利要求也引用在前的独立权利要求，例如，“一种实施权利要求1的方法的装置，……”；“一种制造权利要求1 的产品的方法，……”；“一种包含权利要求1 的部件的设备，……”；“与权利要求1 的插座相配合的插头，……”等。这种引用其他独立权利要求的权利要求是并列的独立权利要求，而不能被看作是从属权利要求。对于这种引用另一权利要求的独立权利要求，在确定其保护范围时，被引用的权利要求的特征均应予以考虑，而其实际的限定作用应当最终体现在对该独立权利要求的保护主题产生了何种影响。
      在某些情况下，形式上的从属权利要求（即其包含有从属权利要求的引用部分），实质上不一定是从属权利要求。例如，独立权利要求1 为：“包括特征X 的机床”。在后的另一项权利要求为：“根据权利要求1 所述的机床，其特征在于用特征Y 代替特征X”。在这种情况下，后一权利要求也是独立权利要求。审查员不得仅从撰写的形式上判定在后的权利要求为从属权利要求。
