# 基础规则包 — 通用合规规则
# 从 rules/patent/compliance.yaml 复制归位（法条引用范围规则移至 citation.yaml，
# 以 base 命名空间 BASE-CITE-001 收录，避免 scope=pack 下重复报出）。

version: "1.0"

rules:
  # ---------------------------------------------------------------------------
  # 风险结论免责声明：命中即追加"不构成正式法律意见"提示（warn）
  # 对齐 quality-gate.ts 的 PATENT_RISK_KEYWORDS
  # ---------------------------------------------------------------------------
  patent_risk_disclaimer:
    id: PAT-RISK-001
    name: 专利风险结论免责声明
    domain: patent
    phase: 输出
    severity: major
    action: warn
    legalBasis: 执业规范：AI 输出不构成正式法律意见，应由专利代理人/律师确认
    basisKind: practice-note
    check:
      type: keyword_blocklist
      # 否定语境（"不构成侵权"/"避免侵权"）不误报
      negationContext: true
      quoteImmune: true
      # 只收风险结论的完整措辞：裸「侵权/无效/驳回/专利性」是案件主题词。
      keywords:
        - "构成侵权"
        - "侵权成立"
        - "侵权风险"
        - "宣告无效"
        - "无效风险"
        - "驳回风险"
        - "将被驳回"
        - "应当驳回"
        - "不授权"
        - "具备专利性"
        - "不具备专利性"
        - "自由实施风险"
        - "可以自由实施"
        - "新颖性结论"
        - "创造性结论"

  # ---------------------------------------------------------------------------
  # 结论性表述人工审批：命中即挂起，需人工审批后入库（review）
  # 对齐 quality-gate.ts 的 PATENT_APPROVAL_KEYWORDS
  # ---------------------------------------------------------------------------
  patent_approval_review:
    id: PAT-APPROVAL-001
    name: 专利结论人工审批
    domain: patent
    phase: 输出
    severity: critical
    action: review
    legalBasis: 质量门禁：结论性/侵权性/有效性判断需人工确认
    basisKind: practice-note
    check:
      type: keyword_blocklist
      # 「不应给出最终建议」不是结论；引文里的条款词也不是本模型的主张。
      negationContext: true
      quoteImmune: true
      keywords:
        - "专利结论"
        - "侵权判断"
        - "有效性结论"
        - "最终建议"

  # ---------------------------------------------------------------------------
  # 回避绝对化表述（warn）
  # 对齐 quality-gate.ts 的 ABSOLUTE_PHRASES（P-A07 条款）
  # ---------------------------------------------------------------------------
  patent_absolute_phrases:
    id: PAT-ABS-001
    name: 回避绝对化表述
    domain: patent
    phase: 输出
    severity: minor
    action: warn
    legalBasis: 审查规范：回避绝对化断言（绝对可以/一定能够/必然导致等），改用限定性表述
    basisKind: practice-note
    check:
      type: keyword_blocklist
      # 否定语境（"不一定"/"绝非绝对"）不误报
      negationContext: true
      quoteImmune: true
      # 只收绝对化断言的完整措辞：裸「一定/绝对/必然」在「一定的弹性」
      # 「绝对新颖性」「反对绝对化表述」里是正常术语或否定对象，误报远高于命中。
      keywords:
        - "绝对可以"
        - "绝对可行"
        - "绝对能"
        - "绝对是"
        - "绝对优于"
        - "绝对领先"
        - "一定能够"
        - "一定会"
        - "一定是"
        - "一定属于"
        - "一定具有"
        - "百分百"
        - "毫无疑问"
        - "必然导致"
        - "必然会"
        - "必然能够"
