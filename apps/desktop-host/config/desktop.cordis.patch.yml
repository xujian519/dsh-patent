# The Electron desktop composition: the browser surface plus the shell surface.
#
# The browser half arrives unchanged with the Web profile's bundles — the
# application window is served the same Web UI, over the Host's authenticated
# loopback URL. Only the rows below differ.

# The desktop-shell provider occupies ctx.desktop: it calls the Electron main
# process over the bridge socket (DSH_DESKTOP_BRIDGE_PATH) for dialogs,
# notifications, menu items, global shortcuts, and tray customization, and it
# degrades to warn-only when the variable is absent (headless development).
- insert:
    - id: desktop-shell
      name: '@deepseek-ai/dsh-desktop-shell'

# The macOS native tools package: open/reveal, browser URLs, clipboard
# read/write, notifications, speech, and app control driven through system
# CLIs. Host effects beyond the session resolve one-time approval through the
# approval seam. darwin-only: every executable it spawns is macOS-specific.
- insert:
    - id: macos-tools
      name: '@deepseek-ai/dsh-macos-tools'
      disabled: !!js process.platform !== 'darwin'

# The workspace sidebar package (`@deepseek-ai/dsh-better-sidebar`) is removed
# from this fork. Desktop keeps the web-app bundle's `ui-sidebar-right` alone.
