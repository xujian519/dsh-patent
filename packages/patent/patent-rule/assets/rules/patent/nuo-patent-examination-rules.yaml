  - id: EX-DIS-002
    name: 说明书—发明内容要素关键词（形式提示）
    description: 仅检查技术问题、技术方案、有益效果的关键词是否出现，不判断三者是否对应或方案是否成立；实体判断由 spec-check 的 not_assessed 条目交给人工或 LLM。
    domain: patent_disclosure
    phase: post_execution
    severity: major
    action: warn
    legalBasis: 审查指南第二部分第二章2.2.4
    basisKind: guideline
    check:
      type: structural_analysis
      requiresAll:
        - element: technical_problem
          patterns:
            - 技术问题
            - 要解决
            - 存在的技术问题
            - 待解决
        - element: technical_solution
          patterns:
            - 技术方案
            - 为实现上述目的
            - 解决上述技术问题
        - element: beneficial_effect
          patterns:
            - 有益效果
            - 技术效果
            - 优点
            - 有益的
  - id: EX-DIS-003
    name: 说明书—实施例关键词（形式提示）
    description: 仅检查「实施例/具体实施」字样是否出现，不判断实施例是否足以使本领域技术人员实现；充分公开由 spec-check 标为 not_assessed。
    domain: patent_disclosure
    phase: post_execution
    severity: major
    action: warn
    legalBasis: 专利法第26条第3款；审查指南第二部分第二章2.2.6
    basisKind: statute
    check:
      type: structural_analysis
      requiresAll:
        - element: 期望模式
          description: 说明书—实施例充分性
          patterns:
            - 实施例
            - 具体实施
      minConfidence: 1
  - id: EX-DIS-004
    name: 说明书—附图说明关键词（形式提示）
    description: 仅检查附图说明相关字样是否出现；图号连续性、图名、正文引用与摘要附图号由 validate_specification 的 figures 规则检查。
    domain: patent_disclosure
    phase: post_execution
    severity: major
    action: warn
    legalBasis: 审查指南第二部分第二章2.2.5
    basisKind: guideline
    check:
      type: structural_analysis
      requiresAll:
        - element: 期望模式
          description: 说明书—附图说明规范
          patterns:
            - 附图
            - 图1
            - 示意图
            - 流程图
            - 结构图
      minConfidence: 1
  - id: EX-CLM-001
    name: 权利要求—清楚性要求
    domain: patent_claims
    phase: post_execution
    severity: critical
    action: block
    legalBasis: 专利法第26条第4款；审查指南第二部分第二章3.2.2
    basisKind: statute
    check:
      type: keyword_blocklist
      # 「应避免使用大约」是撰写建议，不是权利要求本身的用语。
      negationContext: true
      quoteImmune: true
      keywords:
        - 大约
        - 优选地
        - 最好是
        - 大概是
  - id: EX-CLM-007
    name: 权利要求—数值范围近似用语
    domain: patent_claims
    phase: post_execution
    severity: major
    action: warn
    legalBasis: 专利法第26条第4款；审查指南第二部分第二章3.2.2
    basisKind: statute
    check:
      type: pattern_analysis
      patterns:
        # 只有数值语境里的「左右/上下/大约」才是范围不确定；「左右两侧」是方位描述。
        - '[0-9０-９][^。；\n]{0,8}(?:左右|上下)'
        - '(?:大约|约为|近似)[^。；\n]{0,8}[0-9０-９]'
  - id: EX-CLM-002
    name: 权利要求—以说明书为依据
    domain: patent_claims
