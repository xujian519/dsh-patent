  - path: 第二部分第二章3.3
    topics: [权利要求, 撰写]
    text: |-
      权利要求的保护范围是由权利要求中记载的全部内容作为一个整体限定的，因此每一项权利要求只允许在其结尾处使用句号。
      权利要求书有几项权利要求的，应当用阿拉伯数字顺序编号。
      权利要求中使用的科技术语应当与说明书中使用的科技术语一致。权利要求中可以有化学式或者数学式，但是不得有插图。除绝对必要外，权利要求中不得使用“如说明书……部分所述”或者“如图……所示”等类似用语。绝对必要的情况是指当发明或者实用新型涉及的某特定形状仅能用图形限定而无法用语言表达时，权利要求可以使用“如图……所示”等类似用语。
      权利要求中通常不允许使用表格，除非使用表格能够更清楚地说明发明或者实用新型要求保护的主题。
      权利要求中的技术特征可以引用说明书附图中相应的标记，以帮助理解权利要求所记载的技术方案。但是，这些标记应当用括号括起来，放在相应的技术特征后面。附图标记不得解释为对权利要求保护范围的限制。
      通常，一项权利要求用一个自然段表述。但是当技术特征较多，内容和相互关系较复杂，借助于标点符号难以将其关系表达清楚时，一项权利要求也可以用分行或者分小段的方式描述。
      通常，开放式的权利要求宜采用“包含”“包括”“主要由……组成”的表达方式，其解释为还可以含有该权利要求中没有述及的结构组成部分或方法步骤。封闭式的权利要求宜采用“由……组成”的表达方式，其一般解释为不含有该权利要求所述以外的结构组成部分或方法步骤。
      一般情况下，权利要求中包含有数值范围的，其数值范围尽量以数学方式表达，例如，“≥30℃”“＞5”等。通常，“大于”“小于”“超过”等理解为不包括本数；
      “以上”“以下”“以内”等理解为包括本数。
      在得到说明书支持的情况下，允许权利要求对发明或者实用新型作概括性的限定。通常，概括的方式有以下两种：
      （1）用上位概念概括。例如，用“气体激光器”概括氦氖激光器、氩离子激光器、一氧化碳激光器、二氧化碳激光器等。又如用“C1—C4 烷基”概括甲基、乙基、丙基和丁基。再如，用“皮带传动”概括平皮带、三角皮带和齿形皮带传动等。
      （2）用并列选择法概括，即用“或者”或者“和”并列几个必择其一的具体特征。例如，“特征A、B、C 或者D”。又如，“由A、B、C 和D 组成的物质组中选择的一种物质”等。
      采用并列选择法概括时，被并列选择概括的具体内容应当是等效的，不得将上位概念概括的内容，用“或者”与其下位概念并列。另外，被并列选择概括的概念，应含义清楚。例如在“A、B、C、D 或者类似物（设备、方法、物质）”这一描述中，“类似物”这一概念含义是不清楚的，因而不能与具体的物或者方法（A、B、C、D）并列。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
