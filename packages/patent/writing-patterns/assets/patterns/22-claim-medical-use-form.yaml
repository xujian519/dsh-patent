id: "wp-claim-medical-use-form"
name: "医药用途——第一用途写产品，第二用途写 Swiss 型"
category: "claim_drafting"
summary: "物质的医药用途不能写成「治疗……的方法」（专利法 25.1.3）；第一医药用途写成用途限定的产品，已知物质的新适应症写成「在制备治疗……的药物中的用途」。"
context: "适用于化合物、抗体、中药与生物制品的医药用途权利要求。"
keywords: ["化学", "医药用途", "第二医药用途", "Swiss 型", "治疗方法", "25.1.3"]
source_ref: "专利法第25条第1款第3项；审查指南第二部分第十章"
quality: 0.9
version: 1
steps:
  - order: 1
    name: "判断用途层级"
    instruction: "先确认物质是否已公开用于治疗某疾病：没有则属第一医药用途，可写成「用于治疗 Y 的化合物 X」或「包含 X 的用于治疗 Y 的药物组合物」。"
  - order: 2
    name: "第二用途改用 Swiss 型"
    instruction: "已知物质的新适应症写成「化合物 X 在制备治疗 Y2 的药物中的用途」，并在说明书中写明 Y2 与已知用途 Y1 的区别。"
  - order: 3
    name: "删除治疗方法主题"
    instruction: "不要以「一种治疗 Y 的方法，包括给予患者有效量的 X」作为权利要求主题；需要保护给药方案时改为药物组合物或制备药物的用途。"
  - order: 4
    name: "补适应症对应的药效数据"
    instruction: "药效数据必须与权项中的适应症对应，给出体内或体外模型、给药剂量与指标；与已知用途对比时给出对比数据。"
examples:
  - context: "第二医药用途"
    text: "化合物 X 在制备治疗糖尿病肾病的药物中的用途，其中化合物 X 此前已知用于治疗 2 型糖尿病；说明书给出糖尿病肾病模型的尿蛋白与病理数据。"
dos:
  - rule: "第二医药用途采用「在制备……药物中的用途」形式"
  - rule: "药效数据与权项适应症一一对应"
donts:
  - rule: "不要把疾病的治疗或诊断方法写成权利要求主题"
  - rule: "不要只写「用于治疗 Y」而不限定是药物组合物还是制备用途"
