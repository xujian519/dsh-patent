id: "wp-claim-3step-prior-art-check"
name: "撰写期三步法自检——用最接近现有技术反打独权"
category: "claim_drafting"
summary: "独权成文前先按创造性三步法自检：选定最接近现有技术，确定区别特征与实际解决的技术问题，再判断区别特征是否足以支撑创造性。自检不通过的独权应补入必要技术特征或缩小概括，而不是把效果写进权要。"
context: "适用于发明专利申请的独立权利要求定稿前，以及从检索报告得到最接近现有技术后的权要调整。"
keywords: ["三步法", "最接近现有技术", "创造性自检", "区别特征", "独立权利要求"]
source_ref: "专利法第22条第3款；审查指南第二部分第四章3.2"
quality: 0.90
version: 1
steps:
  - order: 1
    name: "选定最接近现有技术"
    instruction: "从检索结果中选与独权技术领域相同、所要解决的技术问题最接近、公开必要技术特征最多的一篇。仅在检索结果确实没有同领域文献时，才选相邻领域并写明理由。"
    example: "D1（CN101234567A）与本申请同属储罐伴热领域，公开了伴热夹套与温度控制，选为最接近现有技术。"
  - order: 2
    name: "确定区别特征与实际解决的技术问题"
    instruction: "逐项比对独权与 D1，列出区别特征；把区别特征放回技术方案，写清它实际带来的技术效果，再据此确定实际解决的技术问题。不得直接把交底书声称的效果当作实际效果。"
  - order: 3
    name: "反打独权"
    instruction: "判断区别特征是否属于本领域惯用手段、常规选择或显而易见的组合。若不足以支撑创造性，把说明书中的关键限定补入独权，或缩小上位概括；不要靠在权要中写效果或优势来补救。"
    example: "区别仅为「设置温度传感器」而 D2 已公开同类传感器用于闭环控温时，独权应补入传感器的布置位置与联动关系。"
  - order: 4
    name: "留下退守层级"
    instruction: "把自检中找到的备选限定整理成从权层级，并确认每层限定在说明书中有对应实施例，避免自检结论只留在模型推理里。"
examples:
  - context: "独权自检失败"
    text: "独权：一种储罐，其特征在于，包括伴热夹套。D1 已公开伴热夹套；区别仅在于控制方式。将「根据温度传感器反馈调节加热功率」补入独权后再评估创造性。"
dos:
  - rule: "先写清实际解决的技术问题，再判断区别特征是否显而易见"
  - rule: "自检发现的必要限定写进独权，与说明书实施例一一对应"
donts:
  - rule: "不要把交底书声称的效果直接当作实际解决的技术问题"
  - rule: "不要用「取得了显著效果」这类断言代替区别特征与技术效果的对应"
