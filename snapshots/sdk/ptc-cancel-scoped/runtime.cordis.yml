# Cancels the ptc-cancel program running in the scoped REPL. The base bundle
# already mounts `ptc-runtime`; override its config instead of inserting it
# again, which the loader rejects as a duplicate entry id.
- id: ptc-runtime
  config:
    executionMode: persistent-in-memory

- insert:
    - id: ptc-cancel-fixture
      name: '../ptc-cancel/cancel.mjs'
