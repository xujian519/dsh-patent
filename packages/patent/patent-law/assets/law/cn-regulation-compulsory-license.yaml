  - article: 1
    topics: [为了规范实施发明专利或者实用新型专利的强制许可(]
    text: '为了规范实施发明专利或者实用新型专利的强制许可(以下简称强制许可)的给予、费用裁决和终止程序,根据《中华人⺠共和国专利法》(以下简称专利法)、《中华人⺠共和国专利法实施细则》及有关法律法规,制定本办法。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 2
    topics: [国家知识产权局负责受理和审查强制许可请求、强制许]
    text: '国家知识产权局负责受理和审查强制许可请求、强制许可使用费裁决请求和终止强制许可请求并作出决定。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 3
    topics: [请求给予强制许可、请求裁决强制许可使用费和请求终]
    text: |-
      请求给予强制许可、请求裁决强制许可使用费和请求终止强制许可,应当使用中文以书面形式办理。
      依照本办法提交的各种证件、证明文件是外文的,国家知识产权局认为必要时,可以要求当事人在指定期限内附送中文译文;期满未附送的,视为未提交该证件、证明文件。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 4
    topics: [在中国没有经常居所或者营业所的外国人、外国企业或]
    text: |-
      在中国没有经常居所或者营业所的外国人、外国企业或者外国其他组织办理强制许可事务的,应当委托依法设立的专利代理机构办理。
      当事人委托专利代理机构办理强制许可事务的,应当提交委托书,写明委托权限。一方当事人有两个以上且未委托专利代理机构的,除另有声明外,以提交的书面文件中指明的第一当事人为该方代表人。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 5
    topics: ['专利权人自专利权被授予之日起满3年,且自提出专利']
    text: |-
      专利权人自专利权被授予之日起满3年,且自提出专利申请之日起满4年,无正当理由未实施或者未充分实施其专利的,具备实施条件的单位或者个人可以根据专利法第四十八条第一项的规定,请求给予强制许可。
      专利权人行使专利权的行为被依法认定为垄断行为的,为消除或者减少该行为对竞争产生的不利影响,具备实施条件的单位或者个人可以根据专利法第四十八条第二项的规定,请求给予强制许可。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 6
    topics: ['在国家出现紧急状态或者非常情况时,或者为了公共利']
    text: '在国家出现紧急状态或者非常情况时,或者为了公共利益的目的,国务院有关主管部⻔可以根据专利法第四十九条的规定,建议国家知识产权局给予其指定的具备实施条件的单位强制许可。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 7
    topics: ['为了公共健康目的,具备实施条件的单位可以根据专利']
    text: |-
      为了公共健康目的,具备实施条件的单位可以根据专利法第五十条的规定,请求给予制造取得专利权的药品并将其出口到下列国家或者地区的强制许可:
      (一)最不发达国家或者地区;
      (二)依照有关国际条约通知世界贸易组织表明希望作为进口方的该组织的发达成员或者发展中成员。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 8
    topics: [一项取得专利权的发明或者实用新型比前已经取得专利]
    text: '一项取得专利权的发明或者实用新型比前已经取得专利权的发明或者实用新型具有显著经济意义的重大技术进步,其实施又有赖于前一发明或者实用新型的实施的,该专利权人可以根据专利法第五十一条的规定请求给予实施前一专利的强制许可。国家知识产权局给予实施前一专利的强制许可的,前一专利权人也可以请求给予实施后一专利的强制许可。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 9
    topics: ['请求给予强制许可的,应当提交强制许可请求书,写明']
    text: |-
      请求给予强制许可的,应当提交强制许可请求书,写明下列各项:
      (一)请求人的姓名或者名称、地址、邮政编码、联系人及电话;
      (二)请求人的国籍或者注册的国家或者地区;
      (三)请求给予强制许可的发明专利或者实用新型专利的名称、专利号、申请日、授权公告日,以及专利权人的姓名或者名称;
      (四)请求给予强制许可的理由和事实、期限;
      (五)请求人委托专利代理机构的,受托机构的名称、机构代码以及该机构指定的代理人的姓名、执业证号码、联系电话;
      (六)请求人的签字或者盖章;委托专利代理机构的,还应当有该机构的盖章;
      (七)附加文件清单;
      (八)其他需要注明的事项。
      请求书及其附加文件应当一式两份。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 10
    topics: ['强制许可请求涉及两个或者两个以上的专利权人的,请']
    text: '强制许可请求涉及两个或者两个以上的专利权人的,请求人应当按专利权人的数量提交请求书及其附加文件副本。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 11
    topics: [根据专利法第四十八条第一项或者第五十一条的规定请]
    text: |-
      根据专利法第四十八条第一项或者第五十一条的规定请求给予强制许可的,请求人应当提供证据,证明其以合理的条件请求专利权人许可其实施专利,但未能在合理的时间内获得许可。
      根据专利法第四十八条第二项的规定请求给予强制许可的,请求人应当提交已经生效的司法机关或者反垄断执法机构依法将专利权人行使专利权的行为认定为垄断行为的判决或者决定。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 12
    topics: [国务院有关主管部⻔根据专利法第四十九条建议给予强]
    text: |-
      国务院有关主管部⻔根据专利法第四十九条建议给予强制许可的,应当指明下列各项:
      (一)国家出现紧急状态或者非常情况,或者为了公共利益目的需要给予强制许可;
      (二)建议给予强制许可的发明专利或者实用新型专利的名称、专利号、申请日、授权公告日,以及专利权人的姓名或者名称;
      (三)建议给予强制许可的期限;
      (四)指定的具备实施条件的单位名称、地址、邮政编码、联系人及电话;
      (五)其他需要注明的事项。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 13
    topics: ['根据专利法第五十条的规定请求给予强制许可的,请求']
    text: '根据专利法第五十条的规定请求给予强制许可的,请求人应当提供进口方及其所需药品和给予强制许可的有关信息。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 14
    topics: ['强制许可请求有下列情形之一的,不予受理并通知请求']
    text: |-
      强制许可请求有下列情形之一的,不予受理并通知请求人:
      (一) 请求给予强制许可的发明专利或者实用新型专利的专利号不明确或者难以确定;
      (二)请求文件未使用中文;
      (三)明显不具备请求强制许可的理由;
      (四) 请求给予强制许可的专利权已经终止或者被宣告无效。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 15
    topics: [请求文件不符合本办法第四条、第九条、第十条规定的]
    text: '请求文件不符合本办法第四条、第九条、第十条规定的,请求人应当自收到通知之日起15日内进行补正。期满未补正的,该请求视为未提出。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 16
    topics: ['国家知识产权局受理强制许可请求的,应当及时将请求']
    text: '国家知识产权局受理强制许可请求的,应当及时将请求书副本送交专利权人。除另有指定的外,专利权人应当自收到通知之日起15日内陈述意⻅;期满未答复的,不影响国家知识产权局作出决定。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 17
    topics: [国家知识产权局应当对请求人陈述的理由、提供的信息]
    text: '国家知识产权局应当对请求人陈述的理由、提供的信息和提交的有关证明文件以及专利权人陈述的意⻅进行审查;需要实地核查的,应当指派两名以上工作人员实地核查。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 18
    topics: ['请求人或者专利权人要求听证的,由国家知识产权局组']
    text: |-
      请求人或者专利权人要求听证的,由国家知识产权局组织听证。
      国家知识产权局应当在举行听证7日前通知请求人、专利权人和其他利害关系人。
      除涉及国家秘密、商业秘密或者个人隐私外,听证公开进行。
      举行听证时,请求人、专利权人和其他利害关系人可以进行申辩和质证。
      举行听证时应当制作听证笔录,交听证参加人员确认无误后签字或者盖章。
      根据专利法第四十九条或者第五十条的规定建议或者请求给予强制许可的,不适用听证程序。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 19
    topics: ['请求人在国家知识产权局作出决定前撤回其请求的,强']
    text: |-
      请求人在国家知识产权局作出决定前撤回其请求的,强制许可请求的审查程序终止。
      在国家知识产权局作出决定前,请求人与专利权人订立了专利实施许可合同的,应当及时通知国家知识产权局,并撤回其强制许可请求。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 20
    topics: ['经审查认为强制许可请求有下列情形之一的,国家知识']
    text: |-
      经审查认为强制许可请求有下列情形之一的,国家知识产权局应当作出驳回强制许可请求的决定:
      (一)请求人不符合本办法第四条、第五条、第七条或者第八条的规定;
      (二)请求给予强制许可的理由不符合专利法第四十八条、第五十条或者第五十一条的规定;
      (三)强制许可请求涉及的发明创造是半导体技术的,其理由不符合专利法
      第五十二条 的规定;
      (四)强制许可请求不符合本办法第十一条或者第十三条的规定;
      (五)请求人陈述的理由、提供的信息或者提交的有关证明文件不充分或者不真实。
      国家知识产权局在作出驳回强制许可请求的决定前,应当通知请求人拟作出的决定及其理由。除另有指定的外,请求人可以自收到通知之日起15日内陈述意⻅。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 21
    topics: ['经审查认为请求给予强制许可的理由成立的,国家知识']
    text: |-
      经审查认为请求给予强制许可的理由成立的,国家知识产权局应当作出给予强制许可的决定。在作出给予强制许可的决定前,应当通知请求人和专利权人拟作出的决定及其理由。除另有指定的外,双方当事人可以自收到通知之日起15日内陈述意⻅。
      国家知识产权局根据专利法第四十九条作出给予强制许可的决定前,应当通知专利权人拟作出的决定及其理由。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 22
    topics: [给予强制许可的决定应当写明下列各项]
    text: |-
      给予强制许可的决定应当写明下列各项:
      (一)取得强制许可的单位或者个人的名称或者姓名、地址;
      (二)被给予强制许可的发明专利或者实用新型专利的名称、专利号、申请日及授权公告日;
      (三)给予强制许可的范围和期限;
      (四)决定的理由、事实和法律依据;
      (五)国家知识产权局的印章及负责人签字;
      (六)决定的日期;
      (七)其他有关事项。
      给予强制许可的决定应当自作出之日起5日内通知请求人和专利权人。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 23
    topics: [国家知识产权局根据专利法第五十条作出给予强制许可]
    text: |-
      国家知识产权局根据专利法第五十条作出给予强制许可的决定的,还应当在该决定中明确下列要求:
      (一)依据强制许可制造的药品数量不得超过进口方所需的数量,并且必须全部出口到该进口方;
      (二)依据强制许可制造的药品应当采用特定的标签或者标记明确注明该药品是依据强制许可而制造的;在可行并且不会对药品价格产生显著影响的情况下,应当对药品本身采用特殊的颜色或者形状,或者对药品采用特殊的包装;
      (三)药品装运前,取得强制许可的单位应当在其网站或者世界贸易组织的有关网站上发布运往进口方的药品数量以及本条第二项所述的药品识别特征等信息。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 24
    topics: [国家知识产权局根据专利法第五十条作出给予强制许可]
    text: |-
      国家知识产权局根据专利法第五十条作出给予强制许可的决定的,由国务院有关主管部⻔将下列信息通报世界贸易组织:
      (一)取得强制许可的单位的名称和地址;
      (二)出口药品的名称和数量;
      (三)进口方;
      (四)强制许可的期限;
      (五)本办法第二十三条第三项所述网址。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 25
    topics: ['请求裁决强制许可使用费的,应当提交强制许可使用费']
    text: |-
      请求裁决强制许可使用费的,应当提交强制许可使用费裁决请求书,写明下列各项:
      (一)请求人的姓名或者名称、地址;
      (二)请求人的国籍或者注册的国家或者地区;
      (三)给予强制许可的决定的文号;
      (四)被请求人的姓名或者名称、地址;
      (五)请求裁决强制许可使用费的理由;
      (六)请求人委托专利代理机构的,受托机构的名称、机构代码以及该机构指定的代理人的姓名、执业证号码、联系电话;
      (七)请求人的签字或者盖章;委托专利代理机构的,还应当有该机构的盖章;
      (八)附加文件清单;
      (九)其他需要注明的事项。
      请求书及其附加文件应当一式两份。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 26
    topics: ['强制许可使用费裁决请求有下列情形之一的,不予受理']
    text: |-
      强制许可使用费裁决请求有下列情形之一的,不予受理并通知请求人:
      (一)给予强制许可的决定尚未作出;
      (二)请求人不是专利权人或者取得强制许可的单位或者个人;
      (三)双方尚未进行协商或者经协商已经达成协议。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 27
    topics: ['国家知识产权局受理强制许可使用费裁决请求的,应当']
    text: |-
      国家知识产权局受理强制许可使用费裁决请求的,应当及时将请求书副本送交对方当事人。除另有指定的外,对方当事人应当自收到通知之日起15日内陈述意⻅;期满未答复的,不影响国家知识产权局作出决定。
      强制许可使用费裁决过程中,双方当事人可以提交书面意⻅。国家知识产权局可以根据案情需要听取双方当事人的口头意⻅。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 28
    topics: [请求人在国家知识产权局作出决定前撤回其裁决请求的]
    text: '请求人在国家知识产权局作出决定前撤回其裁决请求的,裁决程序终止。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 29
    topics: [国家知识产权局应当自收到请求书之日起3个月内作出]
    text: '国家知识产权局应当自收到请求书之日起3个月内作出强制许可使用费的裁决决定。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 30
    topics: [强制许可使用费裁决决定应当写明下列各项]
    text: |-
      强制许可使用费裁决决定应当写明下列各项:
      (一)取得强制许可的单位或者个人的名称或者姓名、地址;
      (二)被给予强制许可的发明专利或者实用新型专利的名称、专利号、申请日及授权公告日;
      (三)裁决的内容及其理由;
      (四)国家知识产权局的印章及负责人签字;
      (五)决定的日期;
      (六)其他有关事项。
      强制许可使用费裁决决定应当自作出之日起5日内通知双方当事人。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 31
    topics: ['有下列情形之一的,强制许可自动终止']
    text: |-
      有下列情形之一的,强制许可自动终止:
      (一)给予强制许可的决定规定的强制许可期限届满;
      (二)被给予强制许可的发明专利或者实用新型专利终止或者被宣告无效。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 32
    topics: ['给予强制许可的决定中规定的强制许可期限届满前,强']
    text: |-
      给予强制许可的决定中规定的强制许可期限届满前,强制许可的理由消除并不再发生的,专利权人可以请求国家知识产权局作出终止强制许可的决定。
      请求终止强制许可的,应当提交终止强制许可请求书,写明下列各项:
      (一)专利权人的姓名或者名称、地址;
      (二)专利权人的国籍或者注册的国家或者地区;
      (三)请求终止的给予强制许可决定的文号;
      (四)请求终止强制许可的理由和事实;
      (五)专利权人委托专利代理机构的,受托机构的名称、机构代码以及该机构指定的代理人的姓名、执业证号码、联系电话;
      (六)专利权人的签字或者盖章;委托专利代理机构的,还应当有该机构的盖章;
      (七)附加文件清单;
      (八)其他需要注明的事项。
      请求书及其附加文件应当一式两份。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 33
    topics: ['终止强制许可的请求有下列情形之一的,不予受理并通']
    text: |-
      终止强制许可的请求有下列情形之一的,不予受理并通知请求人:
      (一)请求人不是被给予强制许可的发明专利或者实用新型专利的专利权人;
      (二)未写明请求终止的给予强制许可决定的文号;
      (三)请求文件未使用中文;
      (四)明显不具备终止强制许可的理由。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 34
    topics: ['请求文件不符合本办法第三十二条规定的,请求人应当']
    text: '请求文件不符合本办法第三十二条规定的,请求人应当自收到通知之日起15日内进行补正。期满未补正的,该请求视为未提出。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 35
    topics: ['国家知识产权局受理终止强制许可请求的,应当及时将']
    text: '国家知识产权局受理终止强制许可请求的,应当及时将请求书副本送交取得强制许可的单位或者个人。除另有指定的外,取得强制许可的单位或者个人应当自收到通知之日起15日内陈述意⻅;期满未答复的,不影响国家知识产权局作出决定。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 36
    topics: [国家知识产权局应当对专利权人陈述的理由和提交的有]
    text: '国家知识产权局应当对专利权人陈述的理由和提交的有关证明文件以及取得强制许可的单位或者个人陈述的意⻅进行审查;需要实地核查的,应当指派两名以上工作人员实地核查。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 37
    topics: ['专利权人在国家知识产权局作出决定前撤回其请求的,']
    text: '专利权人在国家知识产权局作出决定前撤回其请求的,相关程序终止。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 38
    topics: ['经审查认为请求终止强制许可的理由不成立的,国家知']
    text: '经审查认为请求终止强制许可的理由不成立的,国家知识产权局应当作出驳回终止强制许可请求的决定。在作出驳回终止强制许可请求的决定前,应当通知专利权人拟作出的决定及其理由。除另有指定的外,专利权人可以自收到通知之日起15日内陈述意⻅。'
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

  - article: 39
    topics: ['经审查认为请求终止强制许可的理由成立的,国家知识']
    text: |-
      经审查认为请求终止强制许可的理由成立的,国家知识产权局应当作出终止强制许可的决定。在作出终止强制许可的决定前,应当通知取得强制许可的单位或者个人拟作出的决定及其理由。除另有指定的外,取得强制许可的单位或者个人可以自收到通知之日起15日内陈述意⻅。
      终止强制许可的决定应当写明下列各项:
      (一)专利权人的姓名或者名称、地址;
      (二)取得强制许可的单位或者个人的名称或者姓名、地址;
      (三)被给予强制许可的发明专利或者实用新型专利的名称、专利号、申请日及授权公告日;
      (四)给予强制许可的决定的文号;
      (五)决定的事实和法律依据;
      (六)国家知识产权局的印章及负责人签字;
      (七)决定的日期;
      (八)其他有关事项。
      终止强制许可的决定应当自作出之日起5日内通知专利权人和取得强制许可的单位或者个人。
    sourceDoc: '专利实施强制许可办法（知识库原件 Markdown）'
    verifiedOn: 2026-11-14

