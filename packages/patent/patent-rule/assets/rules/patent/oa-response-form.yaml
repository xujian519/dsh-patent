# 审查意见答复的文书形式规则（手写资产，非生成物镜像）
#
# 来源：2026-09-30 案件评审（26.3 答复自检事故，会话 dsh-session-d5c70bfc）。该答复
# 通过了全部既有规则（既有规则管「不该出现什么」），却出现两类无规则可查的缺陷：
#   1. 以字词计数代替实体论证（「『供漆』『储漆』各出现 0 次」「『涂漆刷』共出现 15 处」）——
#      26.3 的法定判准是「所属技术领域的技术人员能否实现」，不是词频统计；
#   2. 同一段说明书原文被反复整段复述，篇幅增长而论证不增。
# 两类都可用确定性规则判定，故落为本文件：作用于 rule_check 显式自检（答复作业
# scope）与制品结构门禁（render_patent_document × template=oa-response；PR-OA-007
# 自 2026-10-16 审阅甲7 裁决起以 block 级执行），不进输出门禁（输出门禁只取
# keyword_blocklist，见 selectGateRules）。PR-OA-008/009 属双输入族（rule_check 的
# notice 入参 + 答复正文），单文本评估跳过。
#
# 2026-10-30 篇幅纪律（答复太啰嗦的复盘）：加 PR-OA-010（空节）与 PR-OA-011（结论
# 重复）。既有六条管「一个段落内部怎么写」，这两条管「同一件事在文书里写了几遍」——
# 渲染路径已由模板折叠空节（槽位置空即整节不出现），规则守的是手写成件与草稿直接
# 送审的路径。001-006、010、011 同属表达质量：命中说明该改稿，不说明法律上不合规，
# 故在 response-check 里走独立的 response_concision_* 通道，不翻 response_check_passed。
# 未核验的条号按语义命名，不写未核验条号。

version: "1.0"

rules:
  # ---------------------------------------------------------------------------
  # 禁止计数式论证：以词频/条数统计支撑结论，替代实体法论证
  # ---------------------------------------------------------------------------
  pr_oa_count_argument:
    id: PR-OA-005
    name: 答复—禁止计数式论证
    domain: patent_oa_response
    phase: 输出
    severity: major
    action: warn
    legalBasis: 专利法第二十六条第三款：说明书充分公开以所属技术领域的技术人员能够实现为准；字词出现次数不是法定判准
    basisKind: statute
    description: 命中词频/条数统计式表述；计数可用于检索留痕，不能作为"公开是否充分"的论证依据——应按 26.3 判准改以"本领域技术人员能否实现"陈述
    check:
      type: pattern_analysis
      patterns:
        - "出现\\s*0\\s*次"
        - "(?:共|各|合计|总计)\\s*出现\\s*[0-9]+\\s*(?:处|次)"
        - "[0-9]+\\s*处(?:记载|提到|出现)"
        - "全文(?:共|仅|只)\\s*(?:出现|记载)\\s*[0-9]+"

  # ---------------------------------------------------------------------------
  # 重复引证：同一引文整段重复出现
  # ---------------------------------------------------------------------------
  pr_oa_quote_repetition:
    id: PR-OA-006
    name: 答复—重复引证
    domain: patent_oa_response
    phase: 输出
    severity: minor
    action: warn
    legalBasis: 答复撰写规范：同一引文以一处完整引用为限，其后以引文位置指代（"见前述引文"），不复述原文
    basisKind: practice-note
    description: 同一引述片段重复出现；重复引证不增加论证，只增加篇幅，并让逐点答复的线索被打散
    check:
      type: quote_repetition
      minLength: 12
      minOccurrences: 2

  # ---------------------------------------------------------------------------
  # 26.3 答复的判准落位：答复必须用法定判准组织（本领域技术人员 + 能否实现 + 说明书内容）
  # 前提：只在该答复确实围绕 26.3 时评估（判准落位是对 26.3 答复的形式要求）
  # ---------------------------------------------------------------------------
  pr_oa_enablement_standard:
    id: PR-OA-007
    name: 答复—26.3 判准落位
    domain: patent_oa_response
    phase: 输出
    severity: major
    action: block
    legalBasis: 专利法第二十六条第三款；《专利审查指南》第二部分第二章第 2.1.3 节：以所属技术领域的技术人员能够实现为准，判断依据为说明书记载的内容
    basisKind: statute
    description: 26.3 答复须落到法定判准（本领域技术人员 / 能否实现 / 说明书记载的内容）；只陈述"说明书未记载某特征"而未回到判准，等于把技术方案要件审查混入充分公开审查
    premise:
      - "第二十六条\\s*第三款"
      - "26\\s*[.．]\\s*3"
      - "充分公开"
      - "公开不充分"
    check:
      type: structural_analysis
      # 三项判准是并列要求，2/3 会让缺“说明书记载”的答复通过。
      minConfidence: 1
      requiresAll:
        - element: enablement_standard
          description: 以"能否实现"为判准的落位表述
          patterns:
            - "能够实现"
            - "能够实施"
            - "不能实现"
            - "无法实现"
            - "无法实施"
            # 2026-10-16 审阅修复：肯定式判准写法（可以实现/可以实施）曾漏判
            - "可以实现"
            - "可以实施"
        - element: skilled_person
          description: 判准主体（所属技术领域的技术人员）
          patterns:
            - "所属技术领域的技术人员"
            - "本领域技术人员"
            - "本领域的技术人员"
        - element: spec_basis
          description: 判准依据（以说明书记载的内容为据）
          patterns:
            - "说明书记载"
            - "说明书公开"
            - "说明书的内容"
            - "根据说明书"
            - "按照说明书"
            - "依据说明书"
            # 2026-10-16 审阅修复：插词写法（说明书第N段记载／说明书所记载）曾漏判；
            # 否定式（未记载／没有记载／无法记载）不得计入判准依据，以字符类显式排除。
            - "说明书(?:的)?第[^。；\\n]{1,20}?(?:段|页|栏)[^。；\\n未不没无]{0,8}?(?:记载|公开|内容)"
            - "说明书[^。；\\n未不没无]{0,8}?(?:记载|公开)"

  # ---------------------------------------------------------------------------
  # 法条/理由双向覆盖（双输入：通知书解析结果 + 答复正文）
  # 依据：2026-10-16 审阅甲8/B5 裁决；论文 10 的 Finding 3/4（漏答与自造理由）。
  # ---------------------------------------------------------------------------
  pr_oa_ground_coverage:
    id: PR-OA-008
    name: 答复—驳回理由覆盖
    domain: patent_oa_response
    phase: 输出
    severity: major
    action: warn
    legalBasis: 答复撰写规范：答复须逐条回应通知书指出的驳回理由
    basisKind: practice-note
    description: 通知书提出的每条驳回理由（简称）须在答复中覆盖；漏答即以本条提示补答。按简称核验，覆盖不等于论证成立
    check:
      type: notice_ground_coverage

  pr_oa_unraised_statute:
    id: PR-OA-009
    name: 答复—未提条款引用
    domain: patent_oa_response
    phase: 输出
    severity: major
    action: warn
    legalBasis: 答复撰写规范：引用通知书未提出的驳回条款须说明来源，避免自造理由
    basisKind: practice-note
    description: 答复引用的驳回条款（22.2/22.3/26.3/26.4/33）不在通知书援引范围内时提示说明来源；通知书未识别到具体条款时不评估
    check:
      type: unraised_statute_citation

  # ---------------------------------------------------------------------------
  # 空节：标题后没有正文，或只有「无」一类占位语
  # 渲染路径由模板折叠（槽位置空即整节不出现），本规则守的是渲染之外的路径：手写成件、
  # 团队模式直接出稿、以及把草稿本身当交付物送审的场合。前提取「文本确有分节标题」，
  # 不使用标题的段落式短答复不评估本节形式要求。
  # ---------------------------------------------------------------------------
  pr_oa_empty_section:
    id: PR-OA-010
    name: 答复—空节
    domain: patent_oa_response
    phase: 输出
    severity: minor
    action: warn
    legalBasis: 答复撰写规范：无内容的小节整节删除，成品不保留空标题
    basisKind: practice-note
    description: 小节标题后没有正文，或正文只有「无」一类占位语；无内容的争点不设节、不留标题（模板槽位置空即整节折叠）。只含子标题的父节不算空
    premise:
      # 标题锚点：引擎按无 m 标志编译正则，故同时写行首与换行两种入口。
      - "(?:^|\\n)\\s{0,3}#{2,6}\\s"
      - "<h[2-6]\\b"
    check:
      type: empty_section
      minLevel: 2

  # ---------------------------------------------------------------------------
  # 结论重复：同一个结论句在全文写三遍（总体立场／论证末句／结论与请求）
  # 与 PR-OA-006 分工：006 统计成对引号内的引述片段，本规则统计作者自己的句子。
  # 阈值取 3：两处重复仍是正常的「首尾呼应」，三处起才是换词重述。不设前提——判据
  # 本身就是「同一句出现 3 次」，加「须含结论二字」只会让没写该词的稿子漏判。
  # ---------------------------------------------------------------------------
  pr_oa_conclusion_repetition:
    id: PR-OA-011
    name: 答复—结论重复
    domain: patent_oa_response
    phase: 输出
    severity: minor
    action: warn
    legalBasis: 答复撰写规范：一个结论只写一处，其余以引述位置指代
    basisKind: practice-note
    description: 同一句（≥12 字）在全文出现 3 次以上；总体立场、论证末句与结论与请求三处改写同一结论是篇幅膨胀的主要来源
    check:
      type: sentence_repetition
      minLength: 12
      minOccurrences: 3
