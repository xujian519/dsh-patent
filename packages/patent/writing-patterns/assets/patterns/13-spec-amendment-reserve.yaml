id: "wp-spec-amendment-reserve"
name: "33 条预埋——把替代例、端点与等同结构写进原始说明书"
category: "spec_drafting"
sub_category: "amendment"
summary: "原始说明书是后续修改的唯一依据；撰写时就把替代实施方式、数值端点与结构等同方案写入，答复或无效阶段才有可退守的修改基础。"
context: "适用于说明书撰写阶段，尤其是需要预留答复退路的机械、化学与软件案。"
keywords: ["33条", "修改超范围", "预埋", "替代例", "数值端点"]
source_ref: "专利法第33条；审查指南第二部分第八章5.2.1"
quality: 0.90
version: 1
steps:
  - order: 1
    name: "为必要特征写替代方案"
    instruction: "每个必要技术特征至少写一个可替代的结构、材料或步骤，并说明替代后仍能实现同一效果；替代方案要具体到可实施。"
  - order: 2
    name: "数值范围写端点与中值"
    instruction: "权利要求中的每个数值范围，在说明书中写出两个端点、至少一个中值或优选值，以及范围外的对比例。"
  - order: 3
    name: "结构特征写等同替换"
    instruction: "对机械结构写明可直接替换的等同件及其连接关系，避免后续只能把权要限缩到唯一实施例。"
  - order: 4
    name: "核对修改基础"
    instruction: "逐条检查每个从权与替代例是否能在原始说明书中找到逐字或可直接毫无疑义确定的支持；找不到的内容不得写进权要。"
examples:
  - context: "数值预埋"
    text: "权要限定加热温度 80-95℃；说明书分别写 80℃、88℃、95℃三个实施例，并写 70℃ 对比例说明低于 80℃ 时固化不足。"
dos:
  - rule: "替代方案与端点写成独立段落，便于后续逐段引用"
  - rule: "每个预埋点标注它支撑哪一项从权或哪种退守"
donts:
  - rule: "不要把替代方案写成「还可以采用其他等效结构」这类无内容的概括"
  - rule: "不要只在权要中写范围，而说明书只给单一实施例"
