    basisKind: statute
    check:
      type: structural_analysis
      requiresAll:
        - element: 期望模式
          description: 不授权—疾病诊断和治疗方法
          patterns:
            - 诊断
            - 治疗
            - 疾病
            - 外科
            - 给药
      minConfidence: 1
