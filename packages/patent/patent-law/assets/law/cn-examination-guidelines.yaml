  - path: 第二部分第四章3.2
    topics: [创造性, 三步法]
    text: |-
      评价发明有无创造性，应当以专利法第二十二条第三款为基准。为有助于正确掌握该基准，下面分别给出突出的实质性特点的一般性判断方法和显著的进步的判断标准。
    sourceDoc: '《专利审查指南》2023 年修订版（2024-01-20 施行）——本机 PDF 全文抽取的节正文（去页眉页脚与左边栏法规号、去固定列折行）'
